<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Guidance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6f5; --card:#fff; --ink:#18231f; --muted:#64748b; --line:#e2e8f0;
    --brand:#0d9488; --brand-d:#115e59; --brand-soft:#ccfbf1;
    --new:#2563eb; --new-bg:#dbeafe; --sch:#7c3aed; --sch-bg:#ede9fe; --on:#b45309; --on-bg:#fef3c7; --done:#15803d; --done-bg:#dcfce7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  [hidden]{display:none!important}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 50% 30%,rgba(16,185,129,.28),transparent 55%),#15201c}
  .lcard{width:min(24rem,100%);background:#fff;border-radius:1rem;padding:1.8rem;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .logo{width:3.2rem;height:3.2rem;border-radius:.8rem;background:linear-gradient(135deg,#10b981,#0f766e);color:#fff;display:grid;place-items:center;margin:0 auto .8rem}
  .logo svg{width:1.8rem;height:1.8rem}
  .lcard h1{text-align:center;font-size:1.3rem;font-weight:600}
  .lcard .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.3rem}
  .lcard form{display:flex;flex-direction:column;gap:.85rem}
  .lcard .btn{width:100%;padding:.75rem}
  .err{background:#fee2e2;color:#b91c1c;border-radius:.5rem;padding:.5rem .7rem;font-size:.82rem}
  .switchlink{text-align:center;font-size:.83rem;color:var(--muted);margin-top:1rem}
  .switchlink button{color:var(--brand);font-weight:500;text-decoration:underline}
  .demo{margin-top:1.2rem;border-top:1px dashed var(--line);padding-top:1rem;font-size:.78rem;color:var(--muted)}
  .demo b{color:var(--ink);font-weight:500}
  .demo button{display:block;width:100%;text-align:left;padding:.45rem .6rem;border:1px solid var(--line);border-radius:.5rem;margin-top:.4rem}
  .demo button:hover{border-color:#5eead4;background:#f0fdfa}
  .seg{display:flex;gap:.4rem}
  .seg label{flex:1;margin:0;text-align:center;border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem;cursor:pointer;font-weight:400}
  .seg input{display:none}
  .seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d);font-weight:500}

  /* app */
  header{background:linear-gradient(135deg,#10b981,#0f766e);color:#fff;padding:1.2rem 1.5rem 0}
  .head{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:.8rem}
  .head .ic{width:2.6rem;height:2.6rem;border-radius:.6rem;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .head .ic svg{width:1.5rem;height:1.5rem}
  .head h1{font-size:1.25rem;font-weight:600;line-height:1.2}
  .head p{font-size:.8rem;opacity:.88}
  .who{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex:none}
  .who .av{width:2.1rem;height:2.1rem;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:600;font-size:.8rem}
  .who .nm{font-size:.82rem;line-height:1.2;text-align:right}
  .who .nm small{display:block;opacity:.8;font-size:.7rem}
  .who .out{border:1px solid rgba(255,255,255,.5);border-radius:.4rem;padding:.3rem .7rem;font-size:.78rem}
  .who .out:hover{background:rgba(255,255,255,.12)}
  .role{display:inline-block;background:#fff;color:var(--brand-d);font-size:.62rem;font-weight:600;padding:.05rem .4rem;border-radius:.3rem;letter-spacing:.04em;margin-left:.3rem;vertical-align:middle}
  .tabs{max-width:1100px;margin:1rem auto 0;display:flex;gap:.25rem;overflow-x:auto}
  .tabs button{padding:.6rem 1rem;border-radius:.5rem .5rem 0 0;color:rgba(255,255,255,.88);font-weight:500;white-space:nowrap}
  .tabs button.on{background:var(--bg);color:var(--brand-d)}
  .tabs .count{display:inline-block;min-width:1.3rem;padding:0 .35rem;margin-left:.3rem;border-radius:1rem;background:rgba(255,255,255,.25);font-size:.72rem}
  .tabs button.on .count{background:var(--brand-soft)}

  main{max-width:1100px;margin:0 auto;padding:1.5rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.4rem}
  h2{font-size:1.05rem;font-weight:600;margin-bottom:.2rem}
  h3.sec{font-size:.9rem;font-weight:600;margin:0 0 .7rem}
  .hint{color:var(--muted);font-size:.85rem;margin-bottom:1.2rem}
  .care{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:.7rem;padding:.8rem 1rem;font-size:.83rem;margin-bottom:1rem}
  .care b{font-weight:600}
  .private{background:#f8fafc;border:1px solid var(--line);color:var(--muted);border-radius:.6rem;padding:.6rem .8rem;font-size:.78rem;margin-bottom:1rem;display:flex;gap:.5rem;align-items:center}

  .form{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .full{grid-column:1/-1}
  label{display:block;font-size:.78rem;font-weight:500;color:#334155;margin-bottom:.3rem}
  label i{color:#e11d48;font-style:normal}
  input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.6rem .7rem;background:#fff}
  textarea{min-height:6.5rem;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--brand)}
  .asme{background:var(--bg);border-radius:.5rem;padding:.6rem .7rem}
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
  .cats label{margin:0;border:1px solid #cbd5e1;border-radius:.5rem;padding:.6rem;cursor:pointer;font-weight:400;font-size:.82rem}
  .cats input{display:none}
  .cats label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d);font-weight:500}
  .check{display:flex;gap:.6rem;align-items:flex-start;border:1px solid #fecaca;background:#fff5f5;border-radius:.6rem;padding:.7rem .8rem;cursor:pointer;font-weight:400;font-size:.85rem;margin:0}
  .check input{width:auto;margin-top:.25rem;accent-color:#dc2626}
  .btn{background:var(--brand);color:#fff;padding:.65rem 1.3rem;border-radius:.5rem;font-weight:500}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
  .actions{display:flex;justify-content:flex-end;gap:.6rem}

  .done-msg{text-align:center;padding:2.5rem 1rem}
  .done-msg .big{font-size:1.6rem;font-weight:700;color:var(--brand-d);margin:.4rem 0}
  .done-msg .chk{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--done-bg);color:var(--done);display:grid;place-items:center;margin:0 auto}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1rem}
  .stat{background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:.8rem 1rem;cursor:pointer;text-align:left}
  .stat b{display:block;font-size:1.5rem;font-weight:600}
  .stat span{color:var(--muted);font-size:.78rem}
  .stat.on{outline:2px solid var(--brand)}
  .stat.alert b{color:#dc2626}
  .tools{display:flex;gap:.6rem;margin-bottom:.8rem}
  .tools input{flex:1}
  .tools select{width:auto}
  .list{display:flex;flex-direction:column;gap:.5rem}
  .tk{background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:.85rem 1rem;display:grid;grid-template-columns:auto 1fr auto;gap:.3rem 1rem;align-items:center;cursor:pointer;text-align:left;width:100%}
  .tk:hover{border-color:#5eead4}
  .tk.urgent{border-left:4px solid #dc2626}
  .tk .no{font-weight:600;color:var(--brand-d);font-size:.8rem}
  .tk .ttl{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk .meta{grid-column:2/4;color:var(--muted);font-size:.78rem}
  .pill{display:inline-block;padding:.15rem .6rem;border-radius:1rem;font-size:.72rem;font-weight:500;white-space:nowrap}
  .s-New{background:var(--new-bg);color:var(--new)}
  .s-Scheduled{background:var(--sch-bg);color:var(--sch)}
  .s-Ongoing{background:var(--on-bg);color:var(--on)}
  .s-Closed{background:var(--done-bg);color:var(--done)}
  .t-pill{background:#f1f5f9;color:#475569}
  .u-pill{background:#fee2e2;color:#b91c1c}
  .empty{text-align:center;color:var(--muted);padding:2.5rem;background:#fff;border:1px dashed var(--line);border-radius:.7rem}

  .dash{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem}
  .sess{display:flex;flex-direction:column;gap:.5rem}
  .si{display:grid;grid-template-columns:4.2rem 1fr;gap:.8rem;align-items:center;border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;cursor:pointer;text-align:left;width:100%;background:#fff}
  .si:hover{border-color:#5eead4}
  .si .d{text-align:center;background:var(--brand-soft);color:var(--brand-d);border-radius:.5rem;padding:.3rem 0;line-height:1.15}
  .si .d b{display:block;font-size:1.1rem}
  .si .d small{font-size:.68rem;text-transform:uppercase}
  .si .w{font-weight:500}
  .si .m{color:var(--muted);font-size:.78rem}

  .shade{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;justify-content:flex-end;z-index:10}
  .shade.on{display:flex}
  .drawer{width:min(31rem,100%);height:100%;background:#fff;overflow:auto;padding:1.4rem;display:flex;flex-direction:column;gap:1rem}
  .drawer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  .drawer .x{font-size:1.4rem;line-height:1;color:var(--muted);padding:.2rem .4rem}
  .kv{display:grid;grid-template-columns:7.5rem 1fr;gap:.4rem;font-size:.85rem}
  .kv dt{color:var(--muted)}
  .desc{background:var(--bg);border-radius:.6rem;padding:.8rem;white-space:pre-wrap;font-size:.88rem}
  .box{border:1px solid var(--line);border-radius:.7rem;padding:1rem}
  .box h3{font-size:.85rem;font-weight:600;margin-bottom:.6rem}
  .box.admin{border:1px dashed #5eead4;background:#f0fdfa}
  .box.admin h3{color:var(--brand-d)}
  .box.secret{border:1px dashed #cbd5e1;background:#f8fafc}
  .box.secret h3{color:#334155}
  .row{display:flex;gap:.5rem;margin-bottom:.6rem}
  .notes{display:flex;flex-direction:column;gap:.5rem;margin-top:.7rem}
  .notes div{background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:.5rem .7rem;font-size:.83rem;white-space:pre-wrap}
  .notes small{display:block;color:var(--muted);font-size:.7rem}
  .schedbox{background:var(--sch-bg);color:var(--sch);border-radius:.6rem;padding:.7rem .9rem;font-size:.88rem}
  .schedbox b{font-weight:600}
  .tl{display:flex;flex-direction:column;gap:.7rem;border-left:2px solid var(--line);padding-left:1rem;margin-left:.3rem}
  .tl div{position:relative;font-size:.83rem}
  .tl div::before{content:"";position:absolute;left:-1.37rem;top:.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--brand)}
  .tl div.them::before{background:#94a3b8}
  .tl small{display:block;color:var(--muted);font-size:.72rem}
  .foot{text-align:center;color:#94a3b8;font-size:.75rem;padding:1rem}
  .foot button{text-decoration:underline;color:#94a3b8;font-size:.75rem}

  @media (max-width:760px){
    main{padding:1rem}
    .head p,.who .nm{display:none}
    .form{grid-template-columns:1fr}
    .cats{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:1fr 1fr}
    .dash{grid-template-columns:1fr}
    .tools{flex-wrap:wrap}
    .tk{grid-template-columns:1fr auto}
    .tk .no,.tk .meta{grid-column:1/-1}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><symbol id="gIcon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5l-2.6-2.5a1.7 1.7 0 0 1 2.6-2.2 1.7 1.7 0 0 1 2.6 2.2z"/></symbol></svg>

<!-- ================= LOGIN ================= -->
<section id="login" hidden>
  <div class="lcard">
    <div class="logo"><svg><use href="#gIcon"/></svg></div>
    <h1>E-Guidance</h1>
    <div id="signinBox">
      <p class="sub">Guidance Office · sign in to continue</p>
      <form id="signinForm">
        <div id="signinErr" class="err" hidden></div>
        <div><label>Username</label><input name="u" required autocomplete="username"></div>
        <div><label>Password</label><input name="p" type="password" required autocomplete="current-password"></div>
        <button class="btn">Sign in</button>
      </form>
      <p class="switchlink">No account yet? <button onclick="showSignup(true)">Create one</button></p>
      <div class="demo">
        <b>Prototype demo accounts</b> (tap to fill in)
        <button onclick="fill('counselor','counselor123')">Guidance Counselor (admin) — counselor / counselor123</button>
        <button onclick="fill('teacher','teacher123')">Teacher — teacher / teacher123</button>
        <button onclick="fill('student','student123')">Student — student / student123</button>
      </div>
    </div>
    <div id="signupBox" hidden>
      <p class="sub">Create an account</p>
      <form id="signupForm">
        <div id="signupErr" class="err" hidden></div>
        <div><label>I am a</label>
          <div class="seg"><label><input type="radio" name="role" value="student" checked>Student</label><label><input type="radio" name="role" value="teacher">Teacher</label></div></div>
        <div><label>Full name</label><input name="name" required placeholder="e.g. Juan Dela Cruz"></div>
        <div id="suGrade"><label>Grade &amp; section</label><input name="grade" placeholder="e.g. Grade 8 – Sampaguita"></div>
        <div><label>Username</label><input name="u" required pattern="[A-Za-z0-9._-]{3,}" title="At least 3 letters or numbers, no spaces"></div>
        <div><label>Password</label><input name="p" type="password" required minlength="6"></div>
        <button class="btn">Create account</button>
      </form>
      <p class="switchlink">Already have an account? <button onclick="showSignup(false)">Sign in</button></p>
    </div>
  </div>
</section>

<!-- ================= APP ================= -->
<section id="app" hidden>
<header>
  <div class="head">
    <div class="ic"><svg><use href="#gIcon"/></svg></div>
    <div><h1>E-Guidance</h1><p id="tagline"></p></div>
    <div class="who">
      <div class="nm"><span id="whoName"></span><small id="whoPos"></small></div>
      <div class="av" id="whoAv"></div>
      <button class="out" onclick="logout()">Sign out</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section id="tab-new" hidden></section>
  <section id="tab-dash" hidden></section>
  <section id="tab-list" hidden>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="q" placeholder="Search case no., student, grade, or concern…">
      <select id="ftype"><option value="">All types</option><option>Referral</option><option>Counseling</option><option>Good Moral</option></select>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>
<div class="shade" id="shade"><aside class="drawer" id="drawer"></aside></div>
<div class="foot">Prototype · accounts and records are saved in this browser only · <button onclick="resetDemo()">Reset demo data</button></div>
</section>

<script>
const CATS = ['Academic / Failing grades','Absences / Tardiness','Behavior','Bullying','Family / Personal','Emotional / Stress','Career guidance','Other'];
const STATUSES = ['New','Scheduled','Ongoing','Closed'];
const K = {users:'svnhs-go-users', cases:'svnhs-go-cases', session:'svnhs-go-session'};
const D = 864e5, H = 36e5, now = Date.now();
const dayStr = off => { const d = new Date(Date.now() + off*D), p = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); };

// ---- demo data (prototype only; passwords are plain text in this browser) ----
const SAMPLE_USERS = [
  {u:'counselor', p:'counselor123', name:'Guidance Counselor', pos:'Guidance Office', role:'counselor'},
  {u:'teacher',   p:'teacher123',   name:'Grade 8 Adviser',    pos:'Adviser',          role:'teacher'},
  {u:'teacher2',  p:'teacher123',   name:'Grade 10 Adviser',   pos:'Adviser',          role:'teacher'},
  {u:'student',   p:'student123',   name:'Student Demo',       pos:'Grade 9 – Rizal',  role:'student'},
  {u:'student2',  p:'student123',   name:'Student Two',        pos:'Grade 7 – Mabini', role:'student'},
];
const SAMPLE_CASES = [
  {no:1,type:'Referral',by:'teacher',student:'Student A (sample)',grade:'Grade 8 – Sampaguita',cat:'Absences / Tardiness',details:'Absent 6 times in the past 2 weeks. Parents could not be reached.',urgent:false,status:'Scheduled',sched:{date:dayStr(1),time:'09:00'},at:now-3*D,
   log:[{t:now-3*D,m:'Referral submitted',by:'teacher'},{t:now-2*D,m:'Session scheduled',by:'counselor'}],notes:[{t:now-2*D,m:'Will call parent before the session.'}]},
  {no:2,type:'Counseling',by:'student',student:'Student Demo',grade:'Grade 9 – Rizal',cat:'Emotional / Stress',details:'I feel stressed with all the projects and I can\'t sleep well.',pref:'After lunch',urgent:false,status:'New',sched:null,at:now-5*H,
   log:[{t:now-5*H,m:'Request submitted',by:'student'}],notes:[]},
  {no:3,type:'Referral',by:'teacher2',student:'Student B (sample)',grade:'Grade 10 – Narra',cat:'Bullying',details:'Classmates reported that the student is being teased and pushed during breaks.',urgent:true,status:'New',sched:null,at:now-2*H,
   log:[{t:now-2*H,m:'Referral submitted',by:'teacher2'}],notes:[]},
  {no:4,type:'Good Moral',by:'student2',student:'Student Two',grade:'Grade 7 – Mabini',cat:'Certificate',details:'For scholarship application.',urgent:false,status:'Closed',sched:null,at:now-6*D,
   log:[{t:now-6*D,m:'Request submitted',by:'student2'},{t:now-5*D,m:'Status changed to Closed',by:'counselor'},{t:now-5*D,m:'Certificate is ready. Please claim it at the Guidance Office.',by:'counselor'}],notes:[]},
  {no:5,type:'Referral',by:'teacher',student:'Student C (sample)',grade:'Grade 8 – Sampaguita',cat:'Academic / Failing grades',details:'Failing in 3 subjects this quarter.',urgent:false,status:'Ongoing',sched:{date:dayStr(3),time:'14:00'},at:now-8*D,
   log:[{t:now-8*D,m:'Referral submitted',by:'teacher'},{t:now-7*D,m:'Session scheduled',by:'counselor'},{t:now-6*D,m:'Status changed to Ongoing',by:'counselor'},{t:now-6*D,m:'First session done. Follow-up session set.',by:'counselor'}],notes:[{t:now-6*D,m:'Student shared problems at home. Monitor weekly.'}]},
];
const clone = x => JSON.parse(JSON.stringify(x));
const get = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const put = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
let users = get(K.users) || clone(SAMPLE_USERS);
let cases = get(K.cases) || clone(SAMPLE_CASES);
let me = null, lastId, filter = '', current = '';
const save = () => { put(K.users, users); put(K.cases, cases); };
const isC = () => me && me.role === 'counselor';
const userOf = u => users.find(x => x.u === u) || {u, name:u, pos:'', role:''};

const cno = n => 'GO-' + String(n).padStart(4,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = t => { const m = Math.round((Date.now()-t)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' hr ago'; const d=Math.round(h/24); return d+' day'+(d>1?'s':'')+' ago'; };
const when = t => new Date(t).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtTime = hm => { if(!hm) return ''; const [h,m] = hm.split(':').map(Number); return ((h+11)%12+1) + ':' + String(m).padStart(2,'0') + (h<12?' AM':' PM'); };
const fmtDate = ds => new Date(ds+'T00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
const sPill = s => `<span class="pill s-${s}">${s}</span>`;
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const $ = id => document.getElementById(id);
const titleOf = c => c.type === 'Good Moral' ? 'Good Moral Certificate' : c.type === 'Counseling' ? 'Counseling request – ' + c.cat : c.cat;

// ================= AUTH =================
function showSignup(on){ $('signinBox').hidden = on; $('signupBox').hidden = !on; }
function fill(u,p){ const f = $('signinForm'); f.u.value = u; f.p.value = p; }
$('signupForm').addEventListener('change', e => { if(e.target.name === 'role') $('suGrade').hidden = e.target.value !== 'student'; });
$('signinForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target, u = f.u.value.trim().toLowerCase();
  const acc = users.find(x => x.u === u && x.p === f.p.value);
  if(!acc){ $('signinErr').textContent = 'Wrong username or password.'; $('signinErr').hidden = false; return; }
  $('signinErr').hidden = true; f.reset(); start(acc);
};
$('signupForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target, u = f.u.value.trim().toLowerCase(), role = f.role.value;
  if(users.some(x => x.u === u)){ $('signupErr').textContent = 'That username is taken. Try another.'; $('signupErr').hidden = false; return; }
  if(role === 'student' && !f.grade.value.trim()){ $('signupErr').textContent = 'Please enter your grade and section.'; $('signupErr').hidden = false; return; }
  const acc = {u, p:f.p.value, name:f.name.value.trim(), pos: role === 'student' ? f.grade.value.trim() : 'Teacher', role};
  users.push(acc); save(); f.reset(); $('suGrade').hidden = false; $('signupErr').hidden = true; showSignup(false); start(acc);
};
function start(acc){
  me = acc; try{ sessionStorage.setItem(K.session, acc.u); }catch(e){}
  $('login').hidden = true; $('app').hidden = false;
  $('whoName').innerHTML = esc(me.name) + (isC() ? '<span class="role">ADMIN</span>' : '');
  $('whoPos').textContent = me.pos;
  $('whoAv').textContent = initials(me.name);
  $('tagline').textContent = {
    counselor:'Referrals, counseling requests, and certificates in one place.',
    teacher:'Refer a student to the Guidance Office and follow up on your referrals.',
    student:'Talk to a guidance counselor or request a Good Moral Certificate.'}[me.role];
  filter = ''; buildTabs(); tab(isC() ? 'dash' : 'new');
}
function logout(){ me = null; try{ sessionStorage.removeItem(K.session); }catch(e){} closeD(); $('app').hidden = true; $('login').hidden = false; showSignup(false); }

// ================= TABS =================
function buildTabs(){
  const t = {
    counselor:[['dash','Dashboard'],['list','All Cases <span class="count" id="openCount"></span>']],
    teacher:[['new','＋ Refer a Student'],['list','My Referrals <span class="count" id="openCount"></span>']],
    student:[['new','＋ New Request'],['list','My Requests <span class="count" id="openCount"></span>']],
  }[me.role];
  $('tabs').innerHTML = t.map(([k,l]) => `<button data-tab="${k}">${l}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
}
function tab(name){
  current = name;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  ['new','dash','list'].forEach(k => $('tab-'+k).hidden = k !== name);
  if(name === 'new') renderForm();
  if(name === 'dash') renderDash();
  renderList();
}

// ================= FORMS =================
const catPicker = () => `<div class="cats">${CATS.map((c,i)=>`<label><input type="radio" name="cat" value="${c}" ${i?'':'required'}>${c}</label>`).join('')}</div>`;
const careNote = `<div class="care"><b>In danger or thinking of hurting yourself?</b> Go to the Guidance Office now or tell any teacher right away. You can also call the <b>NCMH Crisis Hotline 1553</b> (free, 24/7).</div>`;
function renderForm(){
  const el = $('tab-new');
  if(me.role === 'teacher'){
    el.innerHTML = `<div class="card" id="formCard">
      <h2>Refer a student</h2>
      <p class="hint">The guidance counselor will review your referral and schedule a session with the student.</p>
      <div class="private">🔒 Details you write here are seen only by you and the Guidance Office.</div>
      <form class="form" id="form">
        <div><label>Student's name <i>*</i></label><input name="student" required></div>
        <div><label>Grade &amp; section <i>*</i></label><input name="grade" required placeholder="e.g. Grade 8 – Sampaguita"></div>
        <div class="full"><label>Reason for referral <i>*</i></label>${catPicker()}</div>
        <div class="full"><label>What did you observe? <i>*</i></label><textarea name="details" required placeholder="Describe what happened, when, and anything you have already done (e.g. talked to the parent)."></textarea></div>
        <div class="full"><label class="check"><input type="checkbox" name="urgent"> <span><b>Needs attention today</b> – the student may be in danger, being harmed, or harming others.</span></label></div>
        <div class="full actions"><button type="reset" class="btn ghost">Clear</button><button class="btn">Send referral</button></div>
      </form></div>`;
  } else {
    el.innerHTML = careNote + `<div class="card" id="formCard">
      <h2>New request</h2>
      <p class="hint">Requesting as <b>${esc(me.name)}</b> · ${esc(me.pos)}</p>
      <form class="form" id="form">
        <div class="full"><label>What do you need?</label>
          <div class="seg"><label><input type="radio" name="type" value="Counseling" checked>Talk to a counselor</label><label><input type="radio" name="type" value="Good Moral">Good Moral Certificate</label></div></div>
        <div class="full" id="fCat"><label>What is it about? <i>*</i></label>${catPicker()}</div>
        <div class="full"><label id="detLabel">Tell us a little more <i>*</i></label><textarea name="details" required placeholder="You can share as much or as little as you want. This is private."></textarea></div>
        <div class="full" id="fPref"><label>When are you free?</label><input name="pref" placeholder="e.g. After lunch, or Friday morning"></div>
        <div class="full actions"><button type="reset" class="btn ghost">Clear</button><button class="btn">Send request</button></div>
      </form></div>`;
    $('form').addEventListener('change', e => {
      if(e.target.name !== 'type') return;
      const cert = e.target.value === 'Good Moral';
      $('fCat').hidden = cert; $('fPref').hidden = cert;
      $('fCat').querySelector('input').required = !cert;
      $('detLabel').innerHTML = cert ? 'What is it for? <i>*</i>' : 'Tell us a little more <i>*</i>';
      $('form').details.placeholder = cert ? 'e.g. Scholarship application, transfer to another school' : 'You can share as much or as little as you want. This is private.';
    });
  }
  el.insertAdjacentHTML('beforeend', `<div class="card done-msg" id="doneCard" hidden>
    <div class="chk"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
    <p style="margin-top:1rem">Sent to the Guidance Office. Your reference number is</p>
    <div class="big" id="doneNo"></div>
    <p class="hint">You'll see the schedule and any updates in ${me.role === 'teacher' ? 'My Referrals' : 'My Requests'}.</p>
    <div class="actions" style="justify-content:center"><button class="btn ghost" onclick="viewCase(lastId)">View</button><button class="btn" onclick="renderForm()">New ${me.role === 'teacher' ? 'referral' : 'request'}</button></div>
  </div>`);
  $('form').onsubmit = submit;
}
function submit(e){
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const no = cases.reduce((m,c)=>Math.max(m,c.no),0) + 1, t = Date.now();
  const c = me.role === 'teacher'
    ? {no, type:'Referral', by:me.u, student:f.student.trim(), grade:f.grade.trim(), cat:f.cat, details:f.details, urgent:!!f.urgent}
    : {no, type:f.type, by:me.u, student:me.name, grade:me.pos, cat: f.type === 'Good Moral' ? 'Certificate' : f.cat, details:f.details, pref:f.pref || '', urgent:false};
  Object.assign(c, {status:'New', sched:null, at:t, log:[{t, m: c.type === 'Referral' ? 'Referral submitted' : 'Request submitted', by:me.u}], notes:[]});
  cases.push(c); save(); lastId = no;
  $('formCard').hidden = true; $('doneCard').hidden = false; $('doneNo').textContent = cno(no);
  renderList();
}

// ================= COUNSELOR DASHBOARD =================
function renderDash(){
  const today = dayStr(0);
  const up = cases.filter(c => c.sched && c.status !== 'Closed' && c.sched.date >= today)
    .sort((a,b) => (a.sched.date + a.sched.time).localeCompare(b.sched.date + b.sched.time));
  const urgent = cases.filter(c => c.urgent && c.status !== 'Closed');
  const fresh = cases.filter(c => c.status === 'New').sort((a,b) => (b.urgent-a.urgent) || b.at-a.at);
  const sessItem = c => { const d = new Date(c.sched.date+'T00:00');
    return `<button class="si" onclick="viewCase(${c.no})"><div class="d"><small>${d.toLocaleDateString('en-PH',{month:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-PH',{weekday:'short'})}</small></div>
      <div><div class="w">${esc(c.student)} · ${fmtTime(c.sched.time)}</div><div class="m">${cno(c.no)} · ${esc(c.type)} · ${esc(c.cat)}</div></div></button>`; };
  const newItem = c => `<button class="tk ${c.urgent?'urgent':''}" onclick="viewCase(${c.no})"><span class="no">${cno(c.no)}</span><span class="ttl">${esc(c.student)}</span>
      <span>${c.urgent?'<span class="pill u-pill">Urgent</span> ':''}<span class="pill t-pill">${c.type}</span></span>
      <span class="meta">${esc(titleOf(c))} · ${esc(c.grade)} · ${ago(c.at)}</span></button>`;
  $('tab-dash').innerHTML = `
    ${urgent.length ? `<div class="care"><b>${urgent.length} urgent case${urgent.length>1?'s':''} need${urgent.length>1?'':'s'} attention today:</b> ${urgent.map(c=>esc(c.student)+' ('+cno(c.no)+')').join(', ')}</div>` : ''}
    <div class="dash">
      <div class="card"><h3 class="sec">New — waiting for your action (${fresh.length})</h3>
        <div class="list">${fresh.length ? fresh.map(newItem).join('') : '<div class="empty">All caught up.</div>'}</div></div>
      <div class="card"><h3 class="sec">Upcoming sessions (${up.length})</h3>
        <div class="sess">${up.length ? up.map(sessItem).join('') : '<div class="empty">No sessions scheduled.</div>'}</div></div>
    </div>`;
}

// ================= LIST =================
const visible = () => isC() ? cases : cases.filter(c => c.by === me.u);
function renderList(){
  if(!me) return;
  const mine = visible();
  const oc = $('openCount'); if(oc) oc.textContent = mine.filter(c => c.status !== 'Closed').length;
  if(current !== 'list') return;
  const by = s => mine.filter(c => c.status === s).length;
  const st = [['','All',mine.length]].concat(STATUSES.map(s => [s,s,by(s)]));
  $('stats').innerHTML = st.map(([k,l,n]) => `<button class="stat ${filter===k?'on':''}" data-f="${k}"><b>${n}</b><span>${l}</span></button>`).join('');
  document.querySelectorAll('#stats .stat').forEach(b => b.onclick = () => { filter = b.dataset.f; renderList(); });
  const q = $('q').value.trim().toLowerCase(), ty = $('ftype').value;
  const sOrder = {New:0,Scheduled:1,Ongoing:2,Closed:3};
  const rows = mine
    .filter(c => !filter || c.status === filter)
    .filter(c => !ty || c.type === ty)
    .filter(c => !q || [cno(c.no), c.student, c.grade, c.cat, c.details, c.type].join(' ').toLowerCase().includes(q))
    .sort((a,b) => (b.urgent && b.status!=='Closed') - (a.urgent && a.status!=='Closed') || sOrder[a.status]-sOrder[b.status] || b.at-a.at);
  $('list').innerHTML = rows.length ? rows.map(c => `
    <button class="tk ${c.urgent && c.status!=='Closed'?'urgent':''}" onclick="viewCase(${c.no})">
      <span class="no">${cno(c.no)}</span>
      <span class="ttl">${me.role === 'student' ? esc(titleOf(c)) : esc(c.student) + ' – ' + esc(titleOf(c))}</span>
      <span>${c.urgent && c.status!=='Closed' ? '<span class="pill u-pill">Urgent</span> ' : ''}${sPill(c.status)}</span>
      <span class="meta">${esc(c.type)}${me.role !== 'student' ? ' · ' + esc(c.grade) : ''}${c.sched && c.status!=='Closed' ? ' · Session ' + fmtDate(c.sched.date) + ', ' + fmtTime(c.sched.time) : ''}${isC() && c.type==='Referral' ? ' · by ' + esc(userOf(c.by).name) : ''} · ${ago(c.at)}</span>
    </button>`).join('')
    : `<div class="empty">${mine.length ? 'Nothing matches.' : me.role === 'teacher' ? 'You haven\'t referred any students yet.' : me.role === 'student' ? 'You have no requests yet.' : 'No cases yet.'}</div>`;
}
$('q').oninput = renderList;
$('ftype').onchange = renderList;

// ================= DETAIL =================
function viewCase(no){
  const c = cases.find(x => x.no === no);
  if(!c || (!isC() && c.by !== me.u)) return;
  const who = userOf(c.by);
  const nameOf = u => userOf(u).role === 'counselor' ? 'Guidance Office' : userOf(u).name;
  const sched = c.sched ? `<div class="schedbox">📅 Session: <b>${fmtDate(c.sched.date)}, ${fmtTime(c.sched.time)}</b> · Guidance Office</div>` : '';
  $('drawer').innerHTML = `
    <div class="top"><div><div style="color:var(--brand-d);font-weight:600">${cno(c.no)}</div><h2>${esc(titleOf(c))}</h2>
      <div style="margin-top:.4rem">${c.urgent?'<span class="pill u-pill">Urgent</span> ':''}${sPill(c.status)} <span class="pill t-pill">${c.type}</span></div></div>
      <button class="x" onclick="closeD()" aria-label="Close">×</button></div>
    <dl class="kv">
      <dt>Student</dt><dd>${esc(c.student)}</dd>
      <dt>Grade &amp; section</dt><dd>${esc(c.grade)}</dd>
      ${c.type === 'Referral' ? `<dt>Referred by</dt><dd>${esc(who.name)}</dd>` : ''}
      ${c.pref ? `<dt>Free time</dt><dd>${esc(c.pref)}</dd>` : ''}
      <dt>Submitted</dt><dd>${when(c.at)}</dd>
    </dl>
    <div class="desc">${esc(c.details)}</div>
    ${sched}
    ${isC() ? `
    <div class="box admin">
      <h3>Counselor actions</h3>
      <div class="row"><select id="newStatus">${STATUSES.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div>
      ${c.type !== 'Good Moral' ? `<label>Session date &amp; time</label><div class="row"><input type="date" id="sDate" value="${c.sched?c.sched.date:''}"><input type="time" id="sTime" value="${c.sched?c.sched.time:''}"></div>` : ''}
      <textarea id="msg" placeholder="Message to the ${c.type==='Referral'?'teacher':'student'} (they will see this)" style="min-height:4rem"></textarea>
      <div class="actions" style="margin-top:.6rem"><button class="btn" onclick="saveCase(${c.no})">Save update</button></div>
    </div>
    <div class="box secret">
      <h3>🔒 Private case notes</h3>
      <p class="hint" style="margin:0 0 .6rem;font-size:.75rem">Only the Guidance Office can see these. Teachers and students never see them.</p>
      <textarea id="pnote" placeholder="Write a confidential note…" style="min-height:4rem"></textarea>
      <div class="actions" style="margin-top:.6rem"><button class="btn ghost" onclick="addNote(${c.no})">Add note</button></div>
      <div class="notes">${c.notes.slice().reverse().map(n=>`<div>${esc(n.m)}<small>${when(n.t)}</small></div>`).join('') || ''}</div>
    </div>` : c.status !== 'Closed' ? `
    <div class="box"><h3>Send a message to the Guidance Office</h3>
      <textarea id="msg" placeholder="${me.role==='teacher'?'Add an update about the student':'Anything else you want to tell the counselor'}" style="min-height:4rem"></textarea>
      <div class="actions" style="margin-top:.6rem"><button class="btn" onclick="saveCase(${c.no})">Send</button></div></div>` : ''}
    <div><h3 class="sec">Updates</h3>
      <div class="tl">${c.log.slice().reverse().map(l=>`<div class="${userOf(l.by).role==='counselor'?'':'them'}">${esc(l.m)}<small>${esc(nameOf(l.by))} · ${when(l.t)}</small></div>`).join('')}</div></div>`;
  $('shade').classList.add('on');
}
function saveCase(no){
  const c = cases.find(x => x.no === no), ts = Date.now();
  const msg = $('msg').value.trim();
  if(isC()){
    const d = $('sDate') ? $('sDate').value : '', tm = $('sTime') ? $('sTime').value : '';
    let s = $('newStatus').value;
    if(d && tm && (!c.sched || c.sched.date !== d || c.sched.time !== tm)){
      c.sched = {date:d, time:tm};
      c.log.push({t:ts, m:'Session set for ' + fmtDate(d) + ', ' + fmtTime(tm), by:me.u});
      if(s === 'New') s = 'Scheduled';
    }
    if(s !== c.status){ c.status = s; c.log.push({t:ts, m:'Status changed to ' + s, by:me.u}); }
  }
  if(msg) c.log.push({t:ts, m:msg, by:me.u});
  save(); viewCase(no); renderList(); if(current === 'dash') renderDash();
}
function addNote(no){
  const c = cases.find(x => x.no === no), m = $('pnote').value.trim();
  if(!m) return;
  c.notes.push({t:Date.now(), m}); save(); viewCase(no);
}
function closeD(){ $('shade').classList.remove('on'); }
$('shade').onclick = e => { if(e.target.id === 'shade') closeD(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeD(); });
function resetDemo(){
  if(!confirm('Remove all accounts and records and bring back the demo data?')) return;
  users = clone(SAMPLE_USERS); cases = clone(SAMPLE_CASES); save(); logout();
}

// ================= BOOT =================
let saved = null; try{ saved = sessionStorage.getItem(K.session); }catch(e){}
let as0 = null; try{ as0 = new URLSearchParams(location.search).get('as'); }catch(e){} // opened from the School Hub: already signed in
const acc0 = (as0 && users.find(x => x.u === as0)) || (saved && users.find(x => x.u === saved));
if(acc0) start(acc0); else $('login').hidden = false;
</script>
<script src="../shared/hublock.js"></script>
</body>
</html>
