<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/cloud.js" data-mod="aralread"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aral Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lilita+One&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/proto.css">
<style>
  :root{--brand:#be185d;--brand-d:#9d174d;--brand-soft:#fce7f3;--grad:linear-gradient(135deg,#ec4899,#9d174d)}
  /* the narrator: "Little Boy" by Ducks (Rive, CC BY 4.0) */
  .narr{display:flex;align-items:center;gap:1.2rem;border-radius:1.2rem;padding:1rem;background:linear-gradient(135deg,#fdf2f8,#e0f2fe)}
  .boy{flex:none;width:clamp(7.5rem,18vw,11rem);aspect-ratio:1;border-radius:1.4rem;overflow:hidden;background:#0596f7;box-shadow:0 0 0 4px #fff,0 10px 24px -10px rgba(15,23,42,.45);position:relative}
  .boy canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}.boy.on canvas{opacity:1}
  .boy.talk{animation:boytalk .5s ease-in-out infinite alternate}@keyframes boytalk{to{transform:translateY(-3px) rotate(-1deg)}}
  .say{position:relative;flex:1;background:#fff;border-radius:1rem;padding:.9rem 1.1rem;font-weight:600;font-size:1.08rem;color:#0f172a;box-shadow:0 6px 18px -10px rgba(15,23,42,.35)}
  .say::before{content:"";position:absolute;left:-.55rem;top:50%;width:1.1rem;height:1.1rem;background:#fff;transform:translateY(-50%) rotate(45deg);border-radius:.15rem}
  .say small{display:block;color:var(--brand);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.2rem}
  /* library */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1rem}
  .book{position:relative;text-align:left;border:0;border-radius:1.1rem;padding:1.1rem 1.1rem 1rem;background:#fff;box-shadow:0 1px 0 #e2e8f0,0 8px 20px -14px rgba(15,23,42,.4);cursor:pointer;display:flex;flex-direction:column;gap:.35rem;border-left:.55rem solid var(--c,#ec4899);transition:transform .15s}
  .book:hover{transform:translateY(-2px)}.book h3{margin:0;font:400 1.35rem 'Lilita One',Poppins,sans-serif;color:#0f172a}
  .book p{margin:0;color:#475569;font-size:.9rem}.book .meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}
  .book.locked{opacity:.6;cursor:not-allowed}.book.locked::after{content:"🔒";position:absolute;right:.9rem;top:.8rem;font-size:1.3rem}
  .book.next{box-shadow:0 0 0 3px #facc15,0 8px 20px -14px rgba(15,23,42,.4)}.book.next::before{content:"READ NEXT";position:absolute;right:.8rem;top:-.6rem;background:#facc15;color:#422006;font-size:.62rem;font-weight:700;padding:.1rem .5rem;border-radius:1rem;letter-spacing:.06em}
  .stars{display:inline-flex;gap:1px;color:#cbd5e1;font-size:1rem}.stars .on{color:#f59e0b}
  /* reader */
  .page{background:#fffdf7;border-radius:1.2rem;padding:1.4rem 1.6rem;box-shadow:inset 0 0 0 1px #f1e8d6,0 10px 26px -18px rgba(15,23,42,.45);font:400 1.18rem/1.9 Merriweather,Georgia,serif;color:#1e293b}
  .page h2{font:400 1.7rem 'Lilita One',Poppins,sans-serif;color:var(--brand-d);margin:0 0 .6rem}
  .ln{display:inline;padding:.12rem .2rem;border-radius:.35rem;transition:background .3s,color .3s;cursor:pointer}
  .ln.done{color:#475569}.ln.cur{background:#fde68a;color:#0f172a;box-shadow:0 0 0 2px #fde68a}.ln.todo{color:#cbd5e1}
  .vocab{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;font-family:Poppins,sans-serif;font-size:.85rem}
  .vocab span{background:var(--brand-soft);color:var(--brand-d);border-radius:2rem;padding:.25rem .7rem}
  .rbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.rbar .grow{flex:1}
  .prog{height:.55rem;border-radius:1rem;background:#f1f5f9;overflow:hidden;min-width:8rem}.prog i{display:block;height:100%;background:var(--grad)}
  /* your turn: the learner reads the line aloud (speech recognition) */
  .turn{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:#fff;border-radius:1.1rem;padding:1rem 1.2rem;box-shadow:0 0 0 2px #fbcfe8}
  .turn.pass{box-shadow:0 0 0 2px #86efac;background:#f0fdf4}.turn.miss{box-shadow:0 0 0 2px #fca5a5}
  .turn .grow{flex:1;min-width:14rem}.turn h3{margin:0 0 .2rem;font-size:1.05rem}.turn p{margin:0;color:#475569}
  .mic{font:600 1.05rem Poppins,sans-serif;border:0;border-radius:2rem;padding:.8rem 1.4rem;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 4px 0 #831843}
  .mic.pulse{animation:micp 1.3s ease-in-out infinite}@keyframes micp{50%{box-shadow:0 4px 0 #831843,0 0 0 8px rgba(236,72,153,.25)}}
  .mic.on{background:#ef4444;box-shadow:0 4px 0 #991b1b;animation:micp 1s ease-in-out infinite}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  .heard{font-style:italic;color:#64748b;margin-top:.3rem !important}
  .acc{font:400 1.8rem 'Lilita One',Poppins,sans-serif}.acc.good{color:#16a34a}.acc.bad{color:#dc2626}
  .ln.cur .w.ok{color:#15803d;text-decoration:underline 2px #86efac;text-underline-offset:4px}.ln.cur .w.miss{color:#b91c1c;background:#fee2e2;border-radius:.25rem}
  /* quiz */
  .q{font-weight:600;font-size:1.15rem;margin:.2rem 0 .9rem}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  .opts button{text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:.9rem;padding:.8rem 1rem;font:500 1rem Poppins,sans-serif;cursor:pointer;color:#0f172a}
  .opts button:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opts button.right{border-color:#16a34a;background:#dcfce7}.opts button.wrong{border-color:#dc2626;background:#fee2e2}
  .opts button b{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:#f1f5f9;margin-right:.5rem;font-size:.85rem}
  .result{text-align:center}.result .big{font:400 3rem 'Lilita One',Poppins,sans-serif;color:var(--brand-d)}
  .credit{margin-top:.6rem;font-size:.72rem;color:#94a3b8}.credit a{color:inherit}
  /* voice-over studio (admin only) */
  .vrow{display:flex;align-items:center;gap:.5rem;padding:.45rem .2rem;border-bottom:1px solid #f1f5f9}.vrow .vt{flex:1}.vrow.has .vt::before{content:"✓ ";color:#16a34a;font-weight:700}
  .vrow.rec{background:#fef2f2}.btn.stop{background:#ef4444}.vgh small{color:#94a3b8;font-weight:500}
  table.cls{width:100%;border-collapse:collapse;font-size:.92rem}table.cls th,table.cls td{padding:.55rem .5rem;border-bottom:1px solid #f1f5f9;text-align:left}
  @media (max-width:640px){.narr{flex-direction:column;text-align:center}.say::before{left:50%;top:-.5rem;transform:translateX(-50%) rotate(45deg)}.opts{grid-template-columns:1fr}.page{padding:1.1rem;font-size:1.05rem}}
</style>
</head>
<body>
<script src="../shared/proto.js"></script>
<script>
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>';
const MIN_PASS = 3; // right answers (of 4) to clear a story and unlock the next one

/* ================= STORIES (sample starter set: replace or add your own) =================
   Each story: id, band ('78' = Grades 7–8 book, '910' = Grades 9–10 book), title, blurb, color,
   lines (read one at a time by the narrator), vocab, and 4 questions [question, [4 options], index of the right one]. */
const BANDS = {'78': 'Grades 7–8', '910': 'Grades 9–10'};
const STORIES = [
  {id:'umbrella', band:'78', title:'The Borrowed Umbrella', color:'#ec4899', blurb:'A rainy afternoon, a kind classmate and a promise.',
   lines:['The rain fell hard on the roof of the waiting shed.', 'Mila held her bag over her head, but her notebooks were getting wet.', 'Her classmate Jun opened his old blue umbrella and stepped beside her.',
     '"You can use it," he said. "My house is just across the street."', 'The next morning, Mila brought the umbrella back, dry and neatly folded.', 'Inside it, she tucked a note: "Thank you for keeping my homework safe."'],
   vocab:[['waiting shed', 'a small roofed place where people wait'], ['neatly', 'in a clean and careful way']],
   qs:[['Why were Mila\'s notebooks getting wet?', ['She dropped them in a puddle', 'It was raining hard', 'Jun spilled water on them', 'She left them outside'], 1],
       ['What did Jun do to help?', ['He lent her his umbrella', 'He carried her bag home', 'He called her parents', 'He gave her a new notebook'], 0],
       ['What does "neatly folded" tell us about Mila?', ['She was in a hurry', 'She was careless', 'She took good care of the umbrella', 'She did not like the umbrella'], 2],
       ['What is the main lesson of the story?', ['Always bring two bags', 'Rain is dangerous', 'Kindness should be returned with thanks', 'Never borrow things'], 2]]},
  {id:'garden', band:'78', title:"Lola's Rooftop Garden", color:'#22c55e', blurb:'Tomatoes, patience and a very small space.',
   lines:['Lola Ising had no yard, only a small rooftop above her sari-sari store.', 'She filled old paint cans with soil and planted tomato seeds in each one.', 'Every morning, Paolo carried water up the stairs for her plants.',
     'For weeks, nothing seemed to happen, and Paolo almost gave up.', '"Seeds are like learning," Lola said. "The roots grow first, where you cannot see them."', 'By summer, red tomatoes hung over every can, and Lola shared them with the whole street.'],
   vocab:[['sari-sari store', 'a small neighborhood store'], ['roots', 'the part of a plant that grows under the soil']],
   qs:[['Where did Lola plant her tomatoes?', ['In a big farm', 'In old paint cans on the rooftop', 'In the school garden', 'Beside the road'], 1],
       ['What was Paolo\'s job?', ['Selling tomatoes', 'Buying seeds', 'Carrying water for the plants', 'Painting the cans'], 2],
       ['What did Lola mean by "the roots grow first"?', ['Growth happens even when we cannot see it yet', 'Roots are more important than fruit', 'Plants grow faster at night', 'Tomatoes have no roots'], 0],
       ['How did the story end?', ['The plants died', 'Lola sold the store', 'Paolo moved away', 'Lola shared the tomatoes with the street'], 3]]},
  {id:'fisher', band:'910', title:"The Fisherman's Choice", color:'#0ea5e9', blurb:'A good catch, a small net and a hard decision.',
   lines:['Before sunrise, Mang Ruben pushed his bangka into the calm sea of Batangas.', 'By noon his net was heavy, but half of the fish were still very young.', 'Selling all of them would pay for his son\'s school project.',
     'Yet he remembered how the reef had once been empty because people took too much, too soon.', 'One by one, he let the young fish slip back into the water.', 'That evening he earned less, but he knew there would be fish for his son\'s children too.'],
   vocab:[['bangka', 'a small outrigger boat'], ['reef', 'a ridge of rock or coral in the sea where fish live']],
   qs:[['What problem did Mang Ruben face?', ['His boat was broken', 'Half of his catch were young fish', 'The sea was too rough', 'No one would buy fish'], 1],
       ['Why was selling all the fish tempting?', ['It would pay for his son\'s school project', 'He wanted a new boat', 'The fish would spoil anyway', 'His friends told him to'], 0],
       ['What memory helped him decide?', ['A storm that sank his boat', 'His first day of fishing', 'A reef that was once empty from overfishing', 'A fish market that closed'], 2],
       ['Which word best describes Mang Ruben\'s decision?', ['Careless', 'Selfish', 'Responsible', 'Lucky'], 2]]},
  {id:'signal', band:'910', title:'Signal in the Storm', color:'#8b5cf6', blurb:'When the power goes out, a radio and a plan.',
   lines:['The typhoon knocked out the power in Barangay San Isidro just after dinner.', 'Phones lost signal, and the families near the river began to worry.', 'Carla remembered the battery radio her science club had repaired.',
     'Through the static, a voice from the municipal office warned that the river would rise by midnight.', 'Carla and her brother knocked on doors, telling neighbors to move to the school on the hill.', 'When the water came, every family was safe, and the old radio had a new name: Hero.'],
   vocab:[['static', 'crackling noise on a radio'], ['municipal', 'belonging to a town or city government']],
   qs:[['What caused the power outage?', ['A typhoon', 'An earthquake', 'A broken generator', 'A fire'], 0],
       ['How did Carla get the warning?', ['From a text message', 'From a battery radio', 'From the television', 'From a neighbor'], 1],
       ['What did Carla and her brother do after hearing the warning?', ['They went to sleep', 'They fixed the power line', 'They warned neighbors to move to higher ground', 'They called the radio station'], 2],
       ['Why did the radio get the name "Hero"?', ['It was very old', 'It helped keep every family safe', 'It belonged to a hero', 'It won a science contest'], 1]]},
];
const storyOf = id => STORIES.find(s => s.id === id);

/* ================= helpers ================= */
const isStudent = () => P.me && P.me.role === 'student';
function isHubAdmin(){ return ((window.HUB_ACCOUNT || {}).role) === 'admin'; }
const gradeOf = u => +((String((P.userOf(u) || {}).pos || '').match(/\b(?:Grade|G)\s*(7|8|9|10)\b/i) || [])[1]) || null;
const bandOf = u => { const g = gradeOf(u); return g && g >= 9 ? '910' : '78'; };
const first = () => esc(String(P.me.name).split(' ')[0]);
const attemptsOf = (u, id) => P.db.attempts.filter(a => a.u === u && (!id || a.story === id));
const bestOf = (u, id) => attemptsOf(u, id).reduce((m, a) => Math.max(m, a.score), -1);
const cleared = (u, id) => bestOf(u, id) >= MIN_PASS;
const readOf = (u, id) => { const r = attemptsOf(u, id).map(a => a.read).filter(x => x != null); return r.length ? Math.max(...r) : null; };
const starsFor = s => s >= 4 ? 3 : s >= 3 ? 2 : s >= 2 ? 1 : 0;
const starsHtml = n => `<span class="stars">${[0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}">★</span>`).join('')}</span>`;
const bandStories = b => STORIES.filter(s => s.band === b);
const nextStory = u => bandStories(bandOf(u)).find(s => !cleared(u, s.id)) || null;
const storyLocked = (u, id) => { if (!isStudent()) return false; const list = bandStories(bandOf(u)), nx = nextStory(u); return !!nx && !cleared(u, id) && list.indexOf(storyOf(id)) > list.indexOf(nx); };
function sfx(kind){ try { const c = sfx.c || (sfx.c = new (window.AudioContext || window.webkitAudioContext)()), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  const f = {ok: [660, 880], no: [300, 220], win: [523, 784], tap: [520, 520]}[kind] || [500, 500];
  o.frequency.setValueAtTime(f[0], t); o.frequency.exponentialRampToValueAtTime(f[1], t + .15); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .26); } catch (e) {} }
const CREDIT = `Narrator: <a href="https://rive.app/community/files/12293-23439-little-boy/" target="_blank" rel="noopener">Little Boy by Ducks</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · made with Rive · voice recorded by the school`;

/* ================= the narrator (Rive "Little Boy" by Ducks, CC BY 4.0) =================
   One boy is kept alive and moved into each screen's narrator box, so he never reloads. His eyes follow the pointer;
   "Hover" makes him react, which we use as a little nod each time he starts a new line. */
let BOY = null, BOY_EL = null, riveP = null;
function loadRive(){
  if (window.rive) return Promise.resolve();
  return riveP || (riveP = new Promise((ok, no) => { const s = document.createElement('script'); s.src = '../aralmath/rive/rive.js';
    s.onload = () => { try { rive.RuntimeLoader.setWasmUrl('../aralmath/rive/rive.wasm'); ok(); } catch (e) { no(e); } }; s.onerror = no; document.head.appendChild(s); }));
}
function boyMount(){
  const slot = $('boySlot'); if (!slot) return;
  if (!BOY_EL) { BOY_EL = document.createElement('div'); BOY_EL.className = 'boy'; BOY_EL.innerHTML = '<canvas></canvas>'; const cv = BOY_EL.querySelector('canvas');
    slot.appendChild(BOY_EL);
    loadRive().then(() => { const fit = () => { const n = Math.round(cv.clientWidth * Math.min(2, window.devicePixelRatio || 1)); if (n && cv.width !== n) { cv.width = cv.height = n; BOY && BOY.resizeDrawingSurfaceToCanvas && BOY.resizeDrawingSurfaceToCanvas(); } };
      fit(); BOY = new rive.Rive({src: 'rive/littleboy.riv', canvas: cv, stateMachines: 'State Machine 1', autoplay: true, layout: new rive.Layout({fit: rive.Fit.Cover}),
        onLoad: () => { fit(); BOY_EL && BOY_EL.classList.add('on'); }});
      try { new ResizeObserver(fit).observe(cv); } catch (e) {} }).catch(() => {});
  } else slot.appendChild(BOY_EL);
}
function boyNod(){ if (!BOY) return; try { const h = BOY.stateMachineInputs('State Machine 1').find(i => i.name === 'Hover'); if (h) { h.value = true; setTimeout(() => { h.value = false; }, 1200); } } catch (e) {} }
function narrHtml(text, label){ return `<div class="narr"><div id="boySlot"></div><div class="say" id="say"><small>${label || 'Your reading buddy'}</small><span id="sayText">${text}</span></div></div>`; }
// say a line: show it, nod, and play the admin's own recording of it (no computer voice; unrecorded lines stay silent)
function narrate(text){ const t = $('sayText'); if (t) t.innerHTML = text; boyNod(); if (BOY_EL) { BOY_EL.classList.add('talk'); clearTimeout(narrate.t); narrate.t = setTimeout(() => BOY_EL && BOY_EL.classList.remove('talk'), 1800); }
  speak(text); }

/* ================= recorded voice-over (shared with Aral Math; the admin records, everyone hears) ================= */
const vkey = t => String(t).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
let VCLIPS = null, VAC = null; const VBUF = new Map(); let VPLAY = [];
async function voiceLoad(force){
  if (VCLIPS && !force) return VCLIPS;
  try { const r = await fetch('/api/voice', {credentials: 'same-origin'}); if (r.status !== 200) throw 0; VCLIPS = (await r.json()).clips || {}; } catch (e) { VCLIPS = VCLIPS || {}; VCLIPS.__offline = true; }
  return VCLIPS;
}
const vac = () => VAC || (VAC = new (window.AudioContext || window.webkitAudioContext)());
function vbuf(id){ const k = id + '@' + VCLIPS[id]; if (VBUF.has(k)) return VBUF.get(k);
  const p = fetch('/api/voice?id=' + encodeURIComponent(id) + '&v=' + VCLIPS[id], {credentials: 'same-origin'}).then(r => r.arrayBuffer()).then(b => vac().decodeAudioData(b));
  VBUF.set(k, p); p.catch(() => VBUF.delete(k)); return p; }
// cover the line with recorded clips (longest phrases first, sentence by sentence); null if anything is missing
function vplan(text){
  if (!VCLIPS) return null; const name = vkey(((P.me || {}).name || '').split(' ')[0]), plan = [];
  for (const sn of String(text).split(/(?<=[.!?])\s+/).map(vkey).filter(Boolean)) { const w = sn.split(' '); let i = 0;
    while (i < w.length) { let hit = 0; for (let j = Math.min(w.length, i + 30); j > i; j--) if (VCLIPS[w.slice(i, j).join(' ')]) { hit = j; break; }
      if (hit) { plan.push(w.slice(i, hit).join(' ')); i = hit; } else if (name && w[i] === name) i++; else return null; }
    plan.push('|'); }
  return plan.length > 1 ? plan : null;
}
function vstop(){ VPLAY.forEach(n => { try { n.stop(); } catch (e) {} }); VPLAY = []; }
async function vplay(plan){ vstop(); const ctx = vac(); try { await ctx.resume(); } catch (e) {}
  const me = {}; VPLAY.me = me; const bufs = await Promise.all(plan.filter(x => x !== '|').map(vbuf)); if (VPLAY.me !== me) return;
  let t = ctx.currentTime + .05, b = 0; for (const x of plan) { if (x === '|') { t += .3; continue; } const s = ctx.createBufferSource(); s.buffer = bufs[b++]; s.connect(ctx.destination); s.start(t); VPLAY.push(s); t += s.buffer.duration + .04; }
  VPLAY.me = me; }
function soundOn(){ try { return localStorage.getItem('aralread-sound') !== '0'; } catch (e) { return true; } }
function toggleSound(){ try { localStorage.setItem('aralread-sound', soundOn() ? '0' : '1'); } catch (e) {} if (!soundOn()) vstop(); P.refresh(); }
// turn HTML back into plain text (&#39; -> ', &quot; -> ") so it matches the recorded line
const plain = t => { const d = document.createElement('textarea'); d.innerHTML = String(t).replace(/<[^>]+>/g, ''); return d.value; };
let SPEAK_ID = 0;
async function speak(text){
  vstop(); if (!soundOn()) return; const id = ++SPEAK_ID, t = plain(text);
  if (!VCLIPS || VCLIPS.__offline) await voiceLoad(VCLIPS && VCLIPS.__offline); // wait for the list of recordings
  if (id !== SPEAK_ID) return; // a newer line started meanwhile
  const plan = VCLIPS[vkey(t)] ? [vkey(t), '|'] : vplan(t); // the whole line as one recording first, then pieced together
  if (plan) vplay(plan).catch(() => {});
}
// browsers keep sound off until the first tap: unlock it then, and replay the current line if it was blocked
document.addEventListener('pointerdown', () => { try { const c = vac(); if (c.state === 'suspended') c.resume().then(() => { const l = $('sayText'); if (l && !VPLAY.length) speak(l.innerHTML); }); } catch (e) {} }, {once: true, capture: true});
voiceLoad();

/* ================= STUDENT: library, reader, quiz ================= */
let R = null; // the story being read: {id, i (line), phase: 'read'|'quiz'|'done', q, picked, right}
function library(el){
  if (R) return R.phase === 'read' ? reader(el) : quiz(el);
  const u = P.me.u, stu = isStudent(), b = stu ? bandOf(u) : (library.band || '78'), list = bandStories(b), nx = stu ? nextStory(u) : null;
  const msg = !stu ? `Hello, teacher! Tap any story to read it the way learners see it.` : nx ? `Hi, ${first()}! Let's read <b>${esc(nx.title)}</b> together. I'll read each line with you.` : `Hi, ${first()}! You finished every story. Read one again for 3 stars!`;
  el.innerHTML = `<div class="stack">${narrHtml(msg)}
    <div class="card"><div class="rbar"><div class="grow"><h2 style="margin:0">📚 Story library</h2><p class="hint" style="margin:.2rem 0 0">${stu ? `${gradeOf(u) ? 'Grade ' + gradeOf(u) + ' · ' : ''}${BANDS[b]} book. Read a story, then answer 4 questions. Get ${MIN_PASS} right to unlock the next story.` : 'Preview the stories and questions.'}</p></div>
      ${stu ? '' : `<div class="seg">${Object.entries(BANDS).map(([k, v]) => `<label><input type="radio" name="bnd" ${k === b ? 'checked' : ''} onchange="library.band='${k}';P.refresh()">${v}</label>`).join('')}</div>`}
      <button class="btn ghost sm" onclick="toggleSound()">${soundOn() ? '🔊 Voice on' : '🔇 Voice off'}</button></div></div>
    <div class="shelf">${list.map(s => { const best = bestOf(u, s.id), lk = storyLocked(u, s.id);
      return `<button class="book ${lk ? 'locked' : ''} ${nx && nx.id === s.id ? 'next' : ''}" style="--c:${s.color}" onclick="openStory('${s.id}')">
        <h3>${esc(s.title)}</h3><p>${esc(s.blurb)}</p>
        <div class="meta"><span class="pill p-gray">${s.lines.length} lines · 4 questions</span>${stu && best >= 0 ? starsHtml(starsFor(best)) : ''}</div></button>`; }).join('')}</div>
    <p class="credit">${CREDIT}</p></div>`;
  boyMount(); if (stu && !library.greeted) { library.greeted = true; narrate(msg); }
}
function openStory(id){
  if (storyLocked(P.me.u, id)) { sfx('no'); const nx = nextStory(P.me.u); return narrate(`<b>${esc(storyOf(id).title)}</b> is still locked. Read <b>${esc(nx.title)}</b> first and get ${MIN_PASS} questions right!`); }
  sfx('tap'); R = {id, i: 0, phase: 'read'}; P.refresh(); narrate(esc(storyOf(id).lines[0]));
}
function reader(el){
  const s = storyOf(R.id), n = s.lines.length;
  el.innerHTML = `<div class="stack">
    <div class="rbar"><button class="btn ghost sm" onclick="closeStory()">← Library</button><div class="grow"><b>${esc(s.title)}</b><div class="hint">Line ${R.i + 1} of ${n}</div></div>
      <div class="prog"><i style="width:${Math.round(100 * (R.i + 1) / n)}%"></i></div><button class="btn ghost sm" onclick="toggleSound()">${soundOn() ? '🔊' : '🔇'}</button></div>
    ${narrHtml(esc(s.lines[R.i]), 'Reading with you')}
    <div class="page"><h2>${esc(s.title)}</h2>${s.lines.map((t, k) => `<span class="ln ${k < R.i ? 'done' : k === R.i ? 'cur' : 'todo'}" onclick="${k < R.i ? `readLine(${k})` : ''}">${k === R.i ? curLineHtml(t) : esc(t)}</span> `).join('')}
      ${R.i === n - 1 ? `<div class="vocab"><b>Words to know:</b>${s.vocab.map(([w, m]) => `<span><b>${esc(w)}</b>: ${esc(m)}</span>`).join('')}</div>` : ''}</div>
    ${turnHtml()}
    <div class="rbar"><button class="btn ghost" onclick="readLine(${Math.max(0, R.i - 1)})" ${R.i ? '' : 'disabled'}>◀ Back</button><button class="btn ghost" onclick="readLine(${R.i})">🔁 Read again</button><div class="grow"></div>
      ${R.i < n - 1 ? `<button class="btn" onclick="readLine(${R.i + 1})" ${canGoOn() ? '' : 'disabled title="Read the line out loud first"'}>Next line ▶</button>` : `<button class="btn" onclick="startQuiz()" ${canGoOn() ? '' : 'disabled title="Read the line out loud first"'}>Answer the questions ▶</button>`}</div>

/* ================= YOUR TURN: the learner reads the line aloud; the browser's speech recognition checks it ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PASS = 80, MAX_TRIES = 3; // % of words read right to pass a line; after 3 tries the learner may go on anyway
let REC = null;
const words = t => String(t).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean).map(w => w.replace(/^'+|'+$/g, ''));
function lev(a, b){ if (Math.abs(a.length - b.length) > 2) return 9; const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) { let prev = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } } return d[b.length]; }

  const L = words(line), H = words(heard), n = L.length, m = H.length, T = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));

  return {ok, acc: n ? Math.round(100 * ok.filter(Boolean).length / n) : 0};

const lineState = () => (R.read = R.read || {})[R.i] || (R.read[R.i] = {tries: 0});

function listen(){

    for (const r of e.results) for (const alt of r) { const m = matchWords(line, alt.transcript); if (m.acc > best.acc) best = Object.assign(m, {text: alt.transcript}); }
    const whole = matchWords(line, heard); if (whole.acc > best.acc) best = Object.assign(whole, {text: heard}); };

    if (best.acc >= 0) { st.tries++; st.heard = best.text; st.acc = best.acc; st.ok = st.ok || best.acc >= PASS; st.marks = best.ok; st.err = null;
      sfx(best.acc >= PASS ? 'win' : 'no'); narrate(best.acc >= PASS ? `Great reading, ${first()}!` : 'Almost! Try the red words again.'); }
    P.refresh(); };
  try { rec.start(); REC = rec; st.err = null; P.refresh(); } catch (e) { REC = null; }
}
function turnHtml(){
  const st = (R.read || {})[R.i] || {}, n = storyOf(R.id).lines.length;
  if (!SR) return `<div class="turn"><div class="grow"><h3>🎤 Your turn: read the line out loud</h3><p>This browser can't listen to your reading. Open the School Hub in Chrome or Safari to have your reading checked.</p></div></div>`;
  const tail = R.i < n - 1 ? 'the next line' : 'the questions';
  const msg = REC ? 'Listening… read the yellow line now.' : st.err === 'mic' ? 'Please allow the microphone, then tap the button again.' : st.err === 'quiet' ? 'I didn\'t hear anything. Tap the button and read a little louder.'
    : st.acc == null ? 'Listen to your reading buddy, then tap the button and read the yellow line.' : st.ok ? `You read ${st.acc}% of the words right. On to ${tail}!` : st.tries >= MAX_TRIES ? `You read ${st.acc}% of the words right. Keep practicing! You can go on to ${tail}.` : `You read ${st.acc}% of the words right. Read the red words carefully and try again (try ${st.tries} of ${MAX_TRIES}).`;
  return `<div class="turn ${st.acc == null || REC ? '' : st.ok ? 'pass' : 'miss'}"><div class="grow"><h3>🎤 Your turn, ${first()}! Read this line out loud.</h3><p>${msg}</p>${st.heard && !REC ? `<p class="heard">I heard: “${esc(st.heard)}”</p>` : REC ? '<p class="heard" id="heard"></p>' : ''}</div>
    ${st.acc != null && !REC ? `<div class="acc ${st.ok ? 'good' : 'bad'}">${st.acc}%</div>` : ''}
    <button class="mic ${REC ? 'on' : st.ok ? '' : 'pulse'}" onclick="listen()">${REC ? '■ Stop' : st.acc == null ? '🎤 Read it aloud' : st.ok ? '🎤 Read again' : '🎤 Try again'}</button></div>`;
}
// the current line, word by word, colored after the learner reads it
function curLineHtml(t){ const st = (R.read || {})[R.i]; if (!st || !st.marks) return esc(t); let k = 0;
  return String(t).split(/(\s+)/).map(part => { if (!part.trim()) return part; const has = words(part).length; const cls = has ? (st.marks[k] ? 'ok' : 'miss') : ''; if (has) k += words(part).length; return `<span class="w ${cls}">${esc(part)}</span>`; }).join(''); }
function readLine(k){ if (REC) { try { REC.abort(); } catch (e) {} REC = null; } R.i = k; sfx('tap'); P.refresh(); narrate(esc(storyOf(R.id).lines[k])); }
function closeStory(){ if (REC) { try { REC.abort(); } catch (e) {} REC = null; } R = null; vstop(); P.refresh(); }
function startQuiz(){ if (REC) { try { REC.abort(); } catch (e) {} REC = null; } R.phase = 'quiz'; R.q = 0; R.right = 0; R.picked = null; P.refresh(); narrate(esc(storyOf(R.id).qs[0][0])); }
function quiz(el){
  const s = storyOf(R.id);
  if (R.phase === 'done') { const st = starsFor(R.right), pass = R.right >= MIN_PASS, nx = isStudent() ? nextStory(P.me.u) : null;
    el.innerHTML = `<div class="stack">${narrHtml(R.doneMsg, 'Great reading')}<div class="card result"><div class="big">${R.right} / 4</div><div style="font-size:2rem">${starsHtml(st)}</div>
      <p>${pass ? (nx && nx.id !== s.id ? `You unlocked <b>${esc(nx.title)}</b>!` : 'Story cleared!') : `Get ${MIN_PASS} right to clear this story. Read it once more, then try again.`}</p>
      <div class="actions" style="justify-content:center"><button class="btn ghost" onclick="openStory('${s.id}')">📖 Read again</button><button class="btn" onclick="closeStory()">Back to the library</button></div></div><p class="credit">${CREDIT}</p></div>`;

  el.innerHTML = `<div class="stack">
    <div class="rbar"><button class="btn ghost sm" onclick="closeStory()">← Library</button><div class="grow"><b>${esc(s.title)}</b><div class="hint">Question ${R.q + 1} of 4</div></div><div class="prog"><i style="width:${Math.round(100 * (R.q + (R.picked == null ? 0 : 1)) / 4)}%"></i></div></div>
    ${narrHtml(R.picked == null ? esc(q) : R.picked === ans ? 'Correct! Great reading.' : `Not quite. The answer is: ${esc(opts[ans])}.`, R.picked == null ? 'Question' : R.picked === ans ? 'Yes!' : 'Let\'s check')}
    <div class="card"><p class="q">${esc(q)}</p><div class="opts">${opts.map((o, k) => `<button onclick="pick(${k})" ${R.picked != null ? 'disabled' : ''} class="${R.picked == null ? '' : k === ans ? 'right' : k === R.picked ? 'wrong' : ''}"><b>${'ABCD'[k]}</b>${esc(o)}</button>`).join('')}</div>
      ${R.picked != null ? `<div class="actions" style="justify-content:flex-end;margin-top:1rem"><button class="btn" onclick="nextQ()">${R.q < 3 ? 'Next question ▶' : 'See my score ▶'}</button></div>` : ''}</div>

}
function pick(k){ const ans = storyOf(R.id).qs[R.q][2]; R.picked = k; if (k === ans) { R.right++; sfx('ok'); } else sfx('no'); P.refresh(); narrate(k === ans ? 'Correct! Great reading.' : `Not quite. The answer is: ${esc(storyOf(R.id).qs[R.q][1][ans])}.`); }
function nextQ(){
  if (R.q < 3) { R.q++; R.picked = null; P.refresh(); return narrate(esc(storyOf(R.id).qs[R.q][0])); }

/* ================= STUDENT: my progress ================= */

      return `<tr><td>${esc(s.title)}</td><td>${b >= 0 ? b + ' / 4' : '—'}</td><td>${b >= 0 ? starsHtml(starsFor(b)) : '—'}</td><td>${rd != null ? rd + '%' : '—'}</td><td>${attemptsOf(u, s.id).length}</td></tr>`; }).join('')}</table></div></div></div>`;

        ${mine.map(k => `<tr><td><b style="font-weight:600">${esc(k.name)}</b><br><small class="hint">${esc(k.pos)}</small></td>${list.map(s => { const v = bestOf(k.u, s.id), rd = readOf(k.u, s.id); return `<td>${v >= 0 ? `${v} / 4 ${starsHtml(starsFor(v))}` : '—'}${rd != null ? `<br><small class="hint">🎤 read ${rd}%</small>` : ''}</td>`; }).join('')}</tr>`).join('')}</table></div>`; }).join('')}</div></div>`;

/* ================= ADMIN: voice-over studio (lines shared with Aral Math's recordings) ================= */
let VREC = null;
function voiceLines(){ return [['Greetings & help', ["Let's read", 'together', "I'll read each line with you", 'Correct! Great reading.', 'Not quite. The answer is:', 'Wonderful', 'Good try', 'You got', 'out of 4', "Let's read it again", 'You finished every story. Read one again for 3 stars!', 'is still locked', 'first and get 3 questions right', 'Great reading', 'Almost! Try the red words again.']]]
  .concat(STORIES.map(s => [s.title, [s.title].concat(s.lines, s.qs.map(q => q[0]), s.qs.flatMap(q => q[1]))])); }
function voiceView(el){
  if (!isHubAdmin()) { el.innerHTML = '<div class="card"><h2>Voice-over</h2><p class="hint">Only the admin account can record the voice-over.</p></div>'; return; }
  if (!VCLIPS) { el.innerHTML = '<div class="card"><p class="hint">Loading recordings…</p></div>'; voiceLoad().then(() => P.current === 'voice' && P.refresh()); return; }

    return `<div class="vrow ${has ? 'has' : ''} ${rec ? 'rec' : ''}"><span class="vt">${esc(t)}</span><button class="btn sm ${rec ? 'stop' : ''}" onclick="voiceRec('${ek}')">${rec ? '■ Stop' : has ? '● Re-record' : '● Record'}</button>${has ? `<button class="btn ghost sm" onclick="vplay(['${ek}'])">▶</button><button class="btn ghost sm" title="Delete" onclick="voiceDel('${ek}')">✕</button>` : ''}</div>`; };

    ${groups.map(([name, list]) => `<div class="card"><h3 class="vgh">${esc(name)} <small>${list.filter(t => VCLIPS[vkey(t)]).length}/${list.length}</small></h3>${list.map(row).join('')}</div>`).join('')}</div>`;

async function voiceRec(k){

async function toWav(ab){ // trim the silence, mono 22 kHz WAV
