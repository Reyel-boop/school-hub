<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aral Math</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/proto.css">
<style>
  :root{--brand:#0e7490;--brand-d:#155e75;--brand-soft:#cffafe;--grad:linear-gradient(135deg,#06b6d4,#4338ca)}
  /* stacked fraction */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.92em;line-height:1.1}
  .fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
  .fr span:last-child{padding:0 .15em}
  .rad{border-top:1.5px solid currentColor;padding:0 .1em}
  .bandsw{display:inline-flex;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;background:#fff}
  .bandsw button{padding:.5rem 1rem;font-size:.85rem;color:var(--muted)}
  .bandsw button.on{background:var(--brand);color:#fff;font-weight:500}
  .unit h3{font-size:.95rem;font-weight:600;margin-bottom:.7rem}
  .skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
  .skill{display:flex;flex-direction:column;gap:.35rem;text-align:left;border:1px solid var(--line);border-radius:.7rem;padding:.75rem .85rem;background:#fff;transition:border-color .15s,box-shadow .15s}
  .skill:hover{border-color:var(--brand);box-shadow:0 4px 14px -6px rgba(14,116,144,.35)}
  .skill b{font-weight:500;font-size:.88rem;line-height:1.3}
  .skill small{color:var(--muted);font-size:.72rem}
  .skill .pill{align-self:flex-start}
  .ptop{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .ptop .grow{flex:1;min-width:10rem}
  .ptop h2{margin:0}
  .dots{display:flex;gap:.25rem;flex-wrap:wrap}
  .dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--line)}
  .dots i.ok{background:#16a34a}.dots i.no{background:#dc2626}.dots i.cur{outline:2px solid var(--brand);outline-offset:1px}
  .lesson{background:var(--brand-soft);border-radius:.7rem;padding:.9rem 1rem;font-size:.9rem;line-height:1.6}
  .lesson summary{cursor:pointer;font-weight:600;color:var(--brand-d)}
  .lesson .ex{margin-top:.5rem;background:#fff;border-radius:.5rem;padding:.6rem .8rem}
  .qbox{font-size:1.35rem;line-height:1.9;padding:.6rem 0 1rem}
  .qbox.words{font-size:1rem;line-height:1.6}
  .ansrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .ansrow input{flex:1;min-width:10rem;font-size:1.1rem}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .choices button{border:1px solid #cbd5e1;border-radius:.6rem;padding:.7rem .9rem;text-align:left;background:#fff;font-size:1rem;line-height:1.6}
  .choices button:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .choices button.right{border-color:#16a34a;background:#dcfce7}
  .choices button.wrong{border-color:#dc2626;background:#fee2e2}
  .fb{margin-top:1rem;border-radius:.6rem;padding:.7rem .9rem;font-size:.92rem;line-height:1.6}
  .fb.ok{background:#dcfce7;color:#14532d}.fb.no{background:#fee2e2;color:#7f1d1d}.fb.info{background:#fef3c7;color:#78350f}
  .bar{height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden;min-width:5rem}
  .bar i{display:block;height:100%;background:var(--brand)}
  table.t{width:100%;border-collapse:collapse;font-size:.85rem}
  table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:.75rem;padding:.5rem;border-bottom:1px solid var(--line)}
  table.t td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
  .review{display:flex;flex-direction:column;gap:.4rem;margin-top:1rem}
  .review div{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .7rem;font-size:.9rem;line-height:1.8}
  .review .mk{font-weight:700;width:1.2rem}
  .review .mk.ok{color:#16a34a}.review .mk.no{color:#dc2626}
  .big{font-size:2.4rem;font-weight:700;color:var(--brand-d)}
  /* printable worksheet */
  #printArea{display:none}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:1.4rem;color:#0f172a}
  .sheet h1{font-size:1.15rem;font-weight:700;margin-bottom:.2rem}
  .sheet .who{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;margin:.6rem 0 1rem}
  .sheet .who span{flex:1;min-width:10rem;border-bottom:1px solid #94a3b8;padding-bottom:.2rem}
  .sheet ol{columns:2;column-gap:2rem;padding-left:1.4rem}
  .sheet li{break-inside:avoid;margin-bottom:1.1rem;line-height:1.9}
  .sheet .line{display:block;border-bottom:1px solid #94a3b8;width:70%;height:1.4rem}
  .sheet .mcs{font-size:.92em}
  .sheet .key{break-before:page;margin-top:1.5rem}
  .sheet .key ol li{margin-bottom:.3rem}
  @media print{
    body.printing > *:not(#printArea){display:none!important}
    body.printing #printArea{display:block}
    body.printing .sheet{border:0;padding:0}
  }
  /* ===== Game layer: Bilang Monsters ===== */
  .ico{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block}
  .hud{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;background:var(--grad);color:#fff;border-radius:1rem;padding:1rem 1.2rem;position:relative;overflow:hidden}
  .hud::after{content:"";position:absolute;right:-3rem;top:-3rem;width:12rem;height:12rem;border-radius:50%;background:rgba(255,255,255,.08)}
  .hud .buddy{width:6.5rem;height:6.5rem;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
  .hud .me{flex:1;min-width:12rem;position:relative;z-index:1}
  .hud .me h2{color:#fff;font-size:1.25rem;margin:0}
  .hud .me small{opacity:.85}
  .lvl{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
  .lvl b{background:#fff;color:var(--brand-d);border-radius:1rem;padding:.1rem .6rem;font-size:.75rem;white-space:nowrap}
  .lvl .xp{flex:1;height:.55rem;border-radius:1rem;background:rgba(255,255,255,.3);overflow:hidden}
  .lvl .xp i{display:block;height:100%;background:#fde047}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap;position:relative;z-index:1}
  .chip{background:rgba(255,255,255,.18);border-radius:2rem;padding:.35rem .8rem;font-weight:600;font-size:.9rem;white-space:nowrap}
  .hudbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;position:relative;z-index:1}
  .hbtn{background:#fff;color:var(--brand-d);border-radius:2rem;padding:.5rem 1rem;font-weight:600;font-size:.85rem}
  .hbtn.go{background:#fde047;color:#422006;box-shadow:0 4px 0 #ca8a04}
  .hbtn.go:active{transform:translateY(2px);box-shadow:0 2px 0 #ca8a04}
  .hbtn.ghosty{background:rgba(255,255,255,.15);color:#fff}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  /* map */
  .island{border-radius:1rem;padding:1rem 1.1rem 1.2rem;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden}
  .island .ihead{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
  .island .ihead .num{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;flex:none}
  .island .ihead h3{font-size:1rem;font-weight:600;margin:0;flex:1}
  .island .ihead small{color:var(--muted);font-size:.75rem}
  .path{display:flex;flex-wrap:wrap;gap:1.1rem .6rem;position:relative}
  .node{width:7.2rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center;position:relative}
  .node .disc{width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;border:3px solid #e2e8f0;transition:transform .15s;position:relative}
  .node:hover .disc{transform:scale(1.07)}
  .node .disc svg{width:3.9rem;height:3.9rem}
  .node.caught .disc{background:var(--soft);border-color:var(--c)}
  .node.next .disc{border-color:#facc15;box-shadow:0 0 0 0 rgba(250,204,21,.7);animation:pulse 1.6s infinite}
  .node.next::before{content:"PLAY";position:absolute;top:-.55rem;z-index:2;background:#facc15;color:#422006;font-size:.6rem;font-weight:700;padding:.05rem .45rem;border-radius:1rem;letter-spacing:.06em}
  .node b{font-size:.74rem;font-weight:500;line-height:1.25}
  .node small{font-size:.66rem;color:var(--muted)}
  .stars{display:flex;gap:.05rem;justify-content:center}
  .stars .ico{width:.95rem;height:.95rem}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,204,21,.7)}70%{box-shadow:0 0 0 .7rem rgba(250,204,21,0)}100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}}
  .side{display:flex;flex-direction:column;gap:1rem}
  .lb{display:flex;flex-direction:column;gap:.35rem}
  .lb div{display:flex;align-items:center;gap:.6rem;font-size:.85rem;padding:.35rem .5rem;border-radius:.5rem}
  .lb div.me{background:var(--brand-soft)}
  .lb .rk{width:1.4rem;font-weight:700;color:var(--muted);text-align:center}
  .lb .nm{flex:1}
  .homegrid{display:grid;grid-template-columns:1fr 17rem;gap:1rem;align-items:start}
  /* battle */
  .arena{position:relative;border-radius:1rem;overflow:hidden;padding:1rem 1rem .6rem;background:linear-gradient(#bae6fd,#e0f2fe 55%,#bbf7d0 56%,#86efac);min-height:13rem}
  .arena .sun{position:absolute;right:1.4rem;top:1rem;width:2.6rem;height:2.6rem;border-radius:50%;background:#fde047;box-shadow:0 0 30px #fde047}
  .fighters{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
  .fighter{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:44%}
  .fighter svg.mon{width:8.5rem;height:8.5rem;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
  .fighter .tag{background:rgba(255,255,255,.85);border-radius:.6rem;padding:.3rem .6rem;font-size:.78rem;font-weight:600;width:100%;max-width:12rem}
  .hp{height:.6rem;border-radius:1rem;background:#e2e8f0;overflow:hidden;margin-top:.25rem}
  .hp i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .5s}
  .hp.low i{background:linear-gradient(90deg,#ef4444,#f97316)}
  .vs{font-weight:800;color:#0f172a;opacity:.35;font-size:1.4rem;align-self:center}
  .shake{animation:shake .45s}
  .lunge{animation:lunge .45s}
  .lungeL{animation:lungeL .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(8px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes lunge{50%{transform:translateX(30px) scale(1.08)}}
  @keyframes lungeL{50%{transform:translateX(-30px) scale(1.08)}}
  .zap{position:absolute;font-size:1.6rem;font-weight:800;color:#fff;-webkit-text-stroke:1.5px #be123c;pointer-events:none;animation:rise 1s forwards;z-index:3}
  @keyframes rise{to{transform:translateY(-50px);opacity:0}}
  .combo{position:absolute;left:50%;top:.6rem;transform:translateX(-50%);background:#f97316;color:#fff;font-weight:700;font-size:.8rem;border-radius:1rem;padding:.15rem .7rem;z-index:2}
  .qcard{border-radius:1rem}
  .qtools{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
  .linkbtn{color:var(--brand);font-size:.82rem;font-weight:500}
  .linkbtn:hover{text-decoration:underline}
  /* win screen + collection + shop */
  .win{text-align:center;padding:1.6rem 1rem;position:relative;overflow:hidden}
  .win .bigstars{display:flex;justify-content:center;gap:.4rem;margin:.6rem 0}
  .win .bigstars .ico{width:3rem;height:3rem;animation:pop .5s backwards}
  .win .bigstars .ico:nth-child(2){animation-delay:.2s}.win .bigstars .ico:nth-child(3){animation-delay:.4s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .caughtcard{display:inline-flex;align-items:center;gap:.8rem;background:var(--brand-soft);border-radius:1rem;padding:.6rem 1rem;margin-top:.6rem;text-align:left}
  .caughtcard svg{width:4rem;height:4rem}
  .confetti{position:fixed;top:-1rem;width:.6rem;height:.9rem;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.7rem}
  .dexcard{border:1px solid var(--line);border-radius:.8rem;padding:.7rem;text-align:center;background:#fff}
  .dexcard svg{width:5rem;height:5rem}
  .dexcard b{display:block;font-size:.85rem;font-weight:600}
  .dexcard small{display:block;font-size:.7rem;color:var(--muted)}
  .dexcard.locked svg{filter:brightness(0) opacity(.15)}
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.7rem}
  .shopitem{border:1px solid var(--line);border-radius:.8rem;padding:.8rem;text-align:center;background:#fff;display:flex;flex-direction:column;gap:.4rem;align-items:center}
  .shopitem svg{width:5.5rem;height:5.5rem}
  .shopitem.on{border-color:var(--brand);background:var(--brand-soft)}
  .pickrow{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
  .pick{border:2px solid var(--line);border-radius:1rem;padding:1rem;background:#fff;width:10rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .pick:hover{border-color:var(--brand)}
  .pick svg{width:7rem;height:7rem;animation:bob 2.6s ease-in-out infinite}
  .mute{position:absolute;right:.6rem;top:.6rem;z-index:2;background:rgba(255,255,255,.75);border-radius:2rem;padding:.25rem .55rem;font-size:.75rem}
  @media (max-width:860px){ .homegrid{grid-template-columns:1fr} }
  @media (max-width:640px){ .fighter svg.mon{width:6rem;height:6rem} .node{width:6rem} .node .disc{width:4rem;height:4rem} .node .disc svg{width:3.3rem;height:3.3rem} .hud .buddy{width:5rem;height:5rem} }
  @media (prefers-reduced-motion: reduce){ .hud .buddy,.pick svg,.node.next .disc{animation:none} }
  svg.mini{width:100%;height:100%}
  svg.locked{filter:brightness(0) opacity(.18)}
  svg.p{width:7rem;height:7rem}
  @media (max-width:640px){ .choices{grid-template-columns:1fr} .sheet ol{columns:1} .qbox{font-size:1.15rem} }
  /* ===== Storyboard (animated) ===== */
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
  .storybox{border-radius:1.2rem;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 40px -20px rgba(15,23,42,.55)}
  .scene{position:relative;height:19rem;overflow:hidden;isolation:isolate;--land:#22c55e;--soft:#dcfce7}
  .scene .world{position:absolute;inset:0;animation:kenburns 18s ease-in-out infinite alternate;transform-origin:50% 70%}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
  .sky{position:absolute;inset:0;background:linear-gradient(#38bdf8,#bae6fd 55%,#e0f2fe 62%);transition:opacity 1s}
  .sky.n{background:linear-gradient(#0b0820,#2e1065 50%,#5b21b6 62%);opacity:0}
  .scene.night .sky.n{opacity:1}
  .stars{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1s}
  .scene.night .stars{opacity:1}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
  .orb{position:absolute;right:2.2rem;top:1.3rem;width:3.4rem;height:3.4rem;border-radius:50%;background:#fde047;box-shadow:0 0 40px 8px rgba(253,224,71,.7);transition:background 1s,box-shadow 1s}
  .orb::before{content:"";position:absolute;inset:-1.2rem;border-radius:50%;background:repeating-conic-gradient(rgba(253,224,71,.55) 0 10deg,transparent 10deg 30deg);animation:spin 24s linear infinite;z-index:-1}
  .scene.night .orb{background:#f5f3ff;box-shadow:0 0 34px 6px rgba(196,181,253,.7)}
  .scene.night .orb::before{opacity:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cloud{position:absolute;height:1.5rem;background:#fff;border-radius:2rem;opacity:.92;animation:drift linear infinite;transition:background 1s}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:55%;height:180%;left:12%;bottom:30%}.cloud::after{width:40%;height:150%;right:12%;bottom:25%}
  .cloud.c1{top:2.2rem;width:7rem;animation-duration:46s;animation-delay:-10s}
  .cloud.c2{top:4.6rem;width:5rem;animation-duration:34s;animation-delay:-25s;opacity:.75}
  .cloud.c3{top:1.2rem;width:4rem;animation-duration:58s;animation-delay:-40s;opacity:.6}
  .scene.night .cloud{background:#4c1d95;opacity:.55}
  @keyframes drift{from{transform:translateX(-10rem)}to{transform:translateX(60rem)}}
  .birds{position:absolute;top:3.2rem;left:0;width:3.4rem;animation:fly 20s linear infinite;transition:opacity 1s}
  .scene.night .birds{opacity:0}
  .birds path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
  @keyframes fly{from{transform:translate(-4rem,0)}50%{transform:translate(28rem,-1rem)}to{transform:translate(62rem,.5rem)}}
  @keyframes flap{to{transform:scaleY(.4)}}
  .sea{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(#0ea5e9,#0369a1);transition:background 1s;overflow:hidden}
  .scene.night .sea{background:linear-gradient(#3b0764,#1e1b4b)}
  .wave{position:absolute;left:0;width:200%;height:2.4rem}
  .wave.w1{top:-.6rem;animation:waves 9s linear infinite;opacity:.55}
  .wave.w2{top:.6rem;animation:waves 14s linear infinite reverse;opacity:.35}
  @keyframes waves{to{transform:translateX(-50%)}}
  .land{position:absolute;bottom:-2.5rem;border-radius:50% 50% 0 0;transition:background 1s}
  .land.l1{left:-3rem;width:24rem;height:7.5rem;background:#fde68a}
  .land.l2{right:-4rem;width:20rem;height:6.5rem;background:var(--land)}
  .scene.night .land.l1{background:#5b21b6}.scene.night .land.l2{background:#7c3aed}
  .palm{position:absolute;bottom:4.4rem;left:2.2rem;width:5.5rem;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  .palm.p2{left:auto;right:3.5rem;bottom:3.6rem;width:4.4rem;animation-delay:-2s}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .gloom{position:absolute;inset:0;background:radial-gradient(circle at 70% 60%,transparent 20%,rgba(46,16,101,.75));opacity:0;transition:opacity .8s;z-index:2;pointer-events:none}
  .scene.gloomy .gloom{opacity:1}
  .chaos{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
  .chaos.on{opacity:1}
  .chaos span{position:absolute;bottom:-2rem;font-weight:800;color:#fde047;text-shadow:0 0 8px rgba(250,204,21,.8);animation:chaos 4s linear infinite}
  @keyframes chaos{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22rem) rotate(540deg);opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
  .flash.go{animation:flash .7s}
  @keyframes flash{0%,40%{opacity:0}45%{opacity:.9}55%{opacity:.1}62%{opacity:.75}100%{opacity:0}}
  .scene.quake{animation:quake .6s}
  @keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
  .cast{position:absolute;left:0;right:0;bottom:.4rem;display:flex;justify-content:center;align-items:flex-end;gap:1rem;z-index:3}
  .actor{position:relative;display:flex;justify-content:center}
  .actor svg.mon{width:9rem;height:9rem;filter:drop-shadow(0 12px 8px rgba(0,0,0,.28));transform-origin:50% 92%;animation:breathe 2.6s ease-in-out infinite}
  .actor.talker svg.mon{width:11.5rem;height:11.5rem}
  .actor.side svg.mon{width:7.5rem;height:7.5rem}
  .actor.crowd svg.mon{width:7rem;height:7rem}
  .actor.talking svg.mon{animation:talk .28s ease-in-out infinite alternate}
  .actor.dim{filter:saturate(.9)}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
  @keyframes talk{from{transform:scale(1,1) translateY(0)}to{transform:scale(1.035,.95) translateY(-4px)}}
  .actor.in-r{animation:inR .7s cubic-bezier(.2,.9,.3,1.25) both}
  .actor.in-l{animation:inL .7s cubic-bezier(.2,.9,.3,1.25) both}
  .actor.in-pop{animation:inPop .8s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes inR{from{transform:translateX(26rem)}to{transform:none}}
  @keyframes inL{from{transform:translateX(-26rem)}to{transform:none}}

<script>
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8.5h4M9 6.5v4M13.5 8.5h4M7 15l3 3M10 15l-3 3M13.5 15.2h4M13.5 17.8h4"/></svg>';

/* ================= MATH HELPERS ================= */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const nz = (a, b) => { let x = 0; while (!x) x = R(a, b); return x; };          // random non-zero integer
const sgn = n => Math.random() < .5 ? -n : n;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const m = n => n < 0 ? MINUS + (-n) : '' + n;                                  // number with a proper minus sign
const sn = n => n < 0 ? `(${MINUS}${-n})` : '' + n;                            // negative numbers in parentheses
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const numStr = x => m(+(+x).toFixed(6));
const NAMES = ['Ana','Ben','Carlo','Dina','Elmer','Faye','Gino','Hana','Ivy','Jun','Kaye','Lito','Mara','Noel','Rico','Tess'];

// exact fractions {n, d}
const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return {n: n / g, d: d / g}; };
const fadd = (x, y) => F(x.n * y.d + y.n * x.d, x.d * y.d);
const fsub = (x, y) => F(x.n * y.d - y.n * x.d, x.d * y.d);
const fmul = (x, y) => F(x.n * y.n, x.d * y.d);
const fdiv = (x, y) => F(x.n * y.d, x.d * y.n);
const feq = (x, y) => x.n * y.d === y.n * x.d;
const mixF = (w, n, d) => F(w * d + n, d);
const decF = s => { s = String(s); const neg = s[0] === '-'; s = s.replace('-', ''); const [i, f = ''] = s.split('.'); const k = 10 ** f.length; return F((neg ? -1 : 1) * (+(i || 0) * k + +(f || 0)), k); };
const frH = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fH = f => { if (f.d === 1) return m(f.n); const s = f.n < 0 ? MINUS : '', a = Math.abs(f.n);
  return a > f.d ? `${s}${Math.floor(a / f.d)}${frH(a % f.d, f.d)}` : s + frH(a, f.d); };
const fT = f => { if (f.d === 1) return m(f.n); const s = f.n < 0 ? MINUS : '', a = Math.abs(f.n);
  return a > f.d ? `${s}${Math.floor(a / f.d)} ${a % f.d}/${f.d}` : `${s}${a}/${f.d}`; };
const mixH = (w, n, d) => `${w}${frH(n, d)}`;
const sfr = f => f.n < 0 ? `(${MINUS}${frH(-f.n, f.d)})` : frH(f.n, f.d);     // signed simple fraction for questions
const sup = (b, e) => `${b}<sup>${e}</sup>`;

// polynomials as coefficient arrays (index = power of x)
const pclean = a => { a = a.slice(); while (a.length > 1 && !a[a.length - 1]) a.pop(); return a; };
const padd = (a, b) => pclean(Array.from({length: Math.max(a.length, b.length)}, (_, i) => (a[i] || 0) + (b[i] || 0)));
const pscale = (a, k) => pclean(a.map(c => c * k));
const pmul = (a, b) => { const r = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => r[i + j] += x * y)); return pclean(r); };
const pshift = (a, k) => pclean(Array(k).fill(0).concat(a));
const polyH = (a, v = 'x') => { const t = [];
  for (let e = a.length - 1; e >= 0; e--) { const c = a[e]; if (!c) continue;
    const abs = Math.abs(c), co = abs === 1 && e > 0 ? '' : abs, vv = e === 0 ? '' : e === 1 ? v : sup(v, e);
    t.push((t.length ? (c < 0 ? ` ${MINUS} ` : ' + ') : (c < 0 ? MINUS : '')) + co + vv); }
  return t.join('') || '0'; };
const randPoly = (deg, k = 9) => { const a = []; for (let i = 0; i <= deg; i++) a.push(i === deg ? nz(-k, k) : R(-k, k)); return a; };
const mono = (c, v, e) => (e === 0 ? m(c) : (c === 1 ? '' : c === -1 ? MINUS : m(c)) + (e === 1 ? v : sup(v, e)));
const bin = (a, b, v = 'x') => `(${a === 1 ? '' : a === -1 ? MINUS : a}${v} ${b < 0 ? MINUS : '+'} ${Math.abs(b)})`;

/* ================= ITEM BUILDERS ================= */
const fracItem = (q, ans, extra) => Object.assign({q, kind:'frac', ans, show: fH(ans)}, extra);
const numItem = (q, ans, unit = '', tol = 1e-9, extra) => Object.assign({q, kind:'num', ans, tol, show: numStr(ans) + (unit ? ' ' + unit : '')}, extra);
const mcItem = (q, correct, wrongs, keepOrder) => {
  const set = [correct]; for (const w of wrongs) { if (set.length >= 4) break; if (!set.includes(w)) set.push(w); }
  if (!keepOrder) shuffle(set);
  return {q, kind:'mc', choices:set, ans:set.indexOf(correct), show:correct};
};
const W = (q, item) => Object.assign(item, {words:true}); // word problem: smaller question text

    if (t === 1) { const a = R(2, 5), b = R(2, 4), c = R(2, 3); return numItem(`${nm} has ${a} shirts, ${b} pairs of pants and ${c} pairs of shoes. How many different outfits of 1 shirt, 1 pair of pants and 1 pair of shoes can ${nm} wear?`, a * b * c, '', 1e-9, {words:true}); }
    if (t === 2) { const n = R(2, 4); return numItem(`A coin is tossed ${n} times in a row. How many possible outcomes (like HT${n > 2 ? 'H' : ''}) are there?`, 2 ** n, '', 1e-9, {words:true}); }
    if (t === 3) { const k = R(3, 6); return numItem(`${nm} flips a coin and spins a spinner with ${k} colors. How many combined outcomes are possible?`, 2 * k, '', 1e-9, {words:true}); }
    if (t === 4) { const L = R(2, 5), D = R(3, 9); return numItem(`A locker code is 1 letter (from ${'ABCDE'.slice(0, L).split('').join(', ')}) followed by 1 digit (from 1 to ${D}). How many different codes can be made?`, L * D, '', 1e-9, {words:true}); }
    return numItem(`Two ordinary dice are rolled. In how many outcomes are <b>both</b> numbers even?`, 9, '', 1e-9, {words:true}); });

// ---------- Integers ----------
const iv = () => Math.random() < .6 ? nz(-20, 20) : sgn(R(21, 999));
skill('i-add', 'Adding integers',
  `<b>Same signs:</b> add the numbers and keep the sign. <b>Different signs:</b> subtract the smaller from the larger (ignoring signs) and use the sign of the larger.

  () => { const a = iv(), b = iv(); return numItem(`${sn(a)} + ${sn(b)}`, a + b); });
skill('i-sub', 'Subtracting integers',
  `Change subtraction into addition: <b>add the opposite</b> of the number being subtracted, then follow the rules for adding integers.

skill('i-mul', 'Multiplying integers',

skill('i-div', 'Dividing integers',

skill('i-frac', 'Signed fractions',
  `Use the integer rules on fractions. Adding or subtracting with the same denominator: work on the numerators and keep the denominator. Multiplying: multiply numerators and denominators, then fix the sign. Simplify at the end.
   <div class="ex">${frH(1,6)} + (−${frH(5,6)}) = −${frH(4,6)} = −${frH(2,3)} &nbsp;·&nbsp; (−${frH(2,3)}) × (−${frH(5,2)}) = ${frH(5,3)} = 1${frH(2,3)}</div>`,
  () => { const t = R(0, 2), d = R(2, 12);

    const a = sgn(R(1, 25)), b = sgn(R(1, 25)); const x = {n:a, d}, y = {n:b, d};
    return t === 0 ? fracItem(`${sfr(x)} + ${sfr(y)}`, F(a + b, d)) : fracItem(`${sfr(x)} − ${sfr(y)}`, F(a - b, d)); });

// ---------- Fractions & decimals together (G9–10) ----------
const fracOrMixed = () => { const d = R(2, 9), n = R(1, d - 1); return Math.random() < .5 ? F(n, d) : mixF(R(1, 9), n, d); };
const fdH = x => typeof x === 'string' ? x : x.d === 1 ? m(x.n) : (Math.abs(x.n) > x.d ? fH(x) : frH(x.n, x.d));
const fdV = x => typeof x === 'string' ? decF(x) : x;
const shortDec = () => pick(['0.5', '0.25', '0.75', '1.2', '1.5', '2.5', '0.4', '0.8', '3.5', '2.1', '0.6', '1.25', '4.2', '6.8', '9.5']);
skill('fd-addsub', 'Adding & subtracting decimals and fractions',
  `Change the decimal to a fraction in lowest terms, make the fractions similar, then add or subtract. Write the answer as a proper fraction or mixed number.
   <div class="ex">${frH(3,4)} + 0.5 = ${frH(3,4)} + ${frH(1,2)} = ${frH(3,4)} + ${frH(2,4)} = 1${frH(1,4)}</div>`,
  () => { let a = Math.random() < .5 ? dec(20, R(1, 2)) : fracOrMixed(), b = typeof a === 'string' ? fracOrMixed() : dec(9, R(1, 2));
    let add = Math.random() < .5; let v = add ? fadd(fdV(a), fdV(b)) : fsub(fdV(a), fdV(b));
    if (v.n <= 0) { [a, b] = [b, a]; v = fsub(fdV(a), fdV(b)); if (v.n <= 0) { add = true; v = fadd(fdV(a), fdV(b)); } }
    return fracItem(`${fdH(a)} ${add ? '+' : '−'} ${fdH(b)}`, v); });
skill('fd-muldiv', 'Multiplying & dividing decimals and fractions',
  `Change decimals to fractions and mixed numbers to improper fractions. Then multiply (or multiply by the reciprocal to divide) and simplify.
   <div class="ex">2${frH(1,4)} ÷ 0.4 = ${frH(9,4)} ÷ ${frH(2,5)} = ${frH(9,4)} × ${frH(5,2)} = ${frH(45,8)} = 5${frH(5,8)}</div>`,
  () => { const a = fracOrMixed(), b = shortDec(), mul = Math.random() < .5, first = Math.random() < .5;
    const [x, y] = first ? [a, b] : [b, a];
    return fracItem(`${fdH(x)} ${mul ? '×' : '÷'} ${fdH(y)}`, mul ? fmul(fdV(x), fdV(y)) : fdiv(fdV(x), fdV(y))); });
skill('fd-order', 'Order of operations with fractions & decimals',
  `Do <b>× and ÷ first</b> (left to right), then <b>+ and −</b> (left to right). Change decimals to fractions as you go.
   <div class="ex">1${frH(1,4)} + 3.5 × 2.1 = 1${frH(1,4)} + ${frH(7,2)} × ${frH(21,10)} = 1${frH(1,4)} + 7${frH(7,20)} = 8${frH(3,5)}</div>`,
  () => { for (let tries = 0; tries < 50; tries++) {
      const vals = [0, 1, 2].map(() => Math.random() < .5 ? shortDec() : fracOrMixed()), ops = pick([['+', '×'], ['−', '÷'], ['×', '−'], ['÷', '+'], ['+', '−'], ['−', '×']]);
      const [a, b, c] = vals.map(fdV), ap = (x, o, y) => o === '+' ? fadd(x, y) : o === '−' ? fsub(x, y) : o === '×' ? fmul(x, y) : fdiv(x, y);
      const hi = o => o === '×' || o === '÷'; let v;
      if (hi(ops[1]) && !hi(ops[0])) v = ap(a, ops[0], ap(b, ops[1], c)); else v = ap(ap(a, ops[0], b), ops[1], c);
      if (v.n > 0 && v.d <= 400) return fracItem(`${fdH(vals[0])} ${ops[0]} ${fdH(vals[1])} ${ops[1]} ${fdH(vals[2])}`, v);
    } return SK['fd-addsub'].gen(); });
skill('i-order', 'Order of operations with integers',
  `Follow <b>GEMDAS</b>: Grouping symbols first, then Exponents, then Multiplication and Division (left to right), then Addition and Subtraction (left to right).
   <div class="ex">7 − 4[2 + 3] = 7 − 4(5) = 7 − 20 = −13</div>`,
  () => { const t = R(0, 4), a = nz(-20, 20), b = nz(-9, 9), c = nz(-9, 9), d = nz(-12, 12);
    if (t === 0) return numItem(`${m(a)} + ${sn(b)} × ${sn(c)}`, a + b * c);
    if (t === 1) return numItem(`${m(a)} × ${sn(b)} − ${sn(c)} × ${sn(d)}`, a * b - c * d);
    if (t === 2) return numItem(`${m(a)} − ${sn(b * c)} ÷ ${sn(c)}`, a - b);
    if (t === 3) return numItem(`(${m(a)} + ${sn(b)}) × ${sn(c)}`, (a + b) * c);
    return numItem(`${m(d)} × (${m(b)} − ${sn(c)}) + ${sn(a)}`, d * (b - c) + a); });

// ---------- Exponents ----------
skill('e-eval', 'Evaluating exponents',
  `The exponent tells how many times to multiply the base by itself.
   <div class="ex">5⁴ = 5 × 5 × 5 × 5 = 625</div>`,
  () => { let b, e; do { b = R(2, 12); e = R(2, 6); } while (b ** e > 2e6);
    if (Math.random() < .3) { let b2, e2; do { b2 = R(2, 9); e2 = R(2, 4); } while (b2 ** e2 > 1e4); const plus = Math.random() < .6;
      return numItem(`${sup(b, e)} ${plus ? '+' : '−'} ${sup(b2, e2)}`, plus ? b ** e + b2 ** e2 : b ** e - b2 ** e2); }
    return numItem(sup(b, e), b ** e); });
skill('e-notation', 'Writing numbers in exponential form',
  `Find how many times the base must be multiplied by itself to make the number.
   <div class="ex">81 = 3 × 3 × 3 × 3 = 3⁴ → the exponent is 4</div>`,
  () => { let b, e; do { b = R(2, 10); e = R(2, 7); } while (b ** e > 1e6);
    return numItem(`Write ${(b ** e).toLocaleString()} as a power of ${b}. What is the exponent? &nbsp; ${b ** e} = ${sup(b, '?')}`, e, '', 1e-9, {words:true, show: `${e} &nbsp;(${(b ** e).toLocaleString()} = ${sup(b, e)})`}); });
skill('e-laws', 'Laws of exponents',
  `Same base: <b>multiply → add</b> the exponents (aᵐ × aⁿ = aᵐ⁺ⁿ), <b>divide → subtract</b> them (aᵐ ÷ aⁿ = aᵐ⁻ⁿ), <b>power of a power → multiply</b> them ((aᵐ)ⁿ = aᵐⁿ).
   <div class="ex">5⁴ × 5⁶ = 5¹⁰ &nbsp;·&nbsp; 10⁸ ÷ 10⁶ = 10² &nbsp;·&nbsp; (8⁵)² = 8¹⁰</div>`,
  () => { const a = R(2, 25), x = R(2, 12), y = R(2, 12), t = R(0, 2);
    if (t === 0) return numItem(`${sup(a, x)} × ${sup(a, y)} = ${sup(a, '?')}`, x + y, '', 1e-9, {show: sup(a, x + y)});
    if (t === 1) { const [p, q] = x > y ? [x, y] : [y + x, y]; return numItem(`${sup(a, p)} ÷ ${sup(a, q)} = ${sup(a, '?')}`, p - q, '', 1e-9, {show: sup(a, p - q)}); }
    return numItem(`(${sup(a, x)})<sup>${y}</sup> = ${sup(a, '?')}`, x * y, '', 1e-9, {show: sup(a, x * y)}); });
skill('e-zero-neg', 'Zero and negative exponents',
  `Any non-zero number to the power 0 is <b>1</b>. A negative exponent means a <b>reciprocal</b>: a⁻ⁿ = 1/aⁿ.
   <div class="ex">8⁰ = 1 &nbsp;·&nbsp; 5⁻² + 2⁴ = ${frH(1,25)} + 16 = 16${frH(1,25)}</div>`,
  () => { const t = R(0, 4), a = R(2, 12), b = R(2, 9);
    if (t === 0) { const k = R(2, 3); return fracItem(`${sup(a, 0)} + ${sup(b, k)}`, F(1 + b ** k)); }
    if (t === 1) { const k = a > 6 ? 2 : R(1, 3); return fracItem(sup(a, MINUS + k), F(1, a ** k)); }
    if (t === 2) return fracItem(`${sup(a, MINUS + 1)} + ${sup(b, MINUS + 1)}`, fadd(F(1, a), F(1, b)));
    if (t === 3) { const p = R(1, 4), q = p + R(1, 2); return fracItem(`${sup(b, p)} ÷ ${sup(b, q)}`, F(1, b ** (q - p))); }
    const k = R(2, 3); return fracItem(`${sup(b, k)} − ${sup(a, 0)} + ${sup(a, MINUS + 1)}`, fadd(F(b ** k - 1), F(1, a))); });
skill('e-vars', 'Exponents with variables',
  `Combine the numbers first, then apply the laws of exponents to each variable. A simplified answer has no negative exponents.
   <div class="ex">2x³ · 3x² = 6x⁵ &nbsp;·&nbsp; 12y⁷ ÷ 4y³ = 3y⁴ &nbsp;·&nbsp; (2a³)² = 4a⁶</div>`,
  () => { const v = pick(['x', 'y', 'a', 'm', 'k']), t = R(0, 2);
    if (t === 0) { const c1 = nz(-6, 9), c2 = R(2, 7), e1 = R(1, 7), e2 = R(2, 6);
      return mcItem(`(${mono(c1, v, e1)})(${mono(c2, v, e2)})`, mono(c1 * c2, v, e1 + e2), [mono(c1 * c2, v, e1 * e2), mono(c1 + c2, v, e1 + e2), mono(c1 * c2, v, e1 + e2 + 1), mono(-c1 * c2, v, e1 + e2)]); }
    if (t === 1) { const k = R(2, 9), c2 = R(2, 8), e2 = R(1, 5), e1 = e2 + R(1, 6);
      return mcItem(`${mono(k * c2, v, e1)} ÷ ${mono(c2, v, e2)}`, mono(k, v, e1 - e2), [mono(k, v, e1 + e2), mono(k * c2 - c2, v, e1 - e2), mono(k, v, e1 - e2 + 1), mono(k + 1, v, e1 - e2)]); }
    const c = R(2, 5), e = R(2, 5), n = R(2, 3);
    return mcItem(`(${mono(c, v, e)})<sup>${n}</sup>`, mono(c ** n, v, e * n), [mono(c, v, e * n), mono(c ** n, v, e + n), mono(c * n, v, e * n), mono(c * n, v, e + n)]); });

// ---------- Square roots ----------
const rt = x => `√<span class="rad">${x}</span>`;
skill('r-perfect', 'Square roots of perfect squares',
  `The square root of a number is the number that, multiplied by itself, gives it. For big numbers, list the prime factors and take one from each pair.
   <div class="ex">√49 = 7 because 7 × 7 = 49 &nbsp;·&nbsp; 900 = (2×2)(3×3)(5×5) → √900 = 2 × 3 × 5 = 30</div>`,
  () => { const k = Math.random() < .5 ? R(2, 15) : R(16, 50); return numItem(rt(k * k), k); });
skill('r-simplify', 'Simplifying square roots',
  `If the number is not a perfect square, find its biggest perfect-square factor and take its root out of the radical.
   <div class="ex">√56 = √(4 × 14) = 2√14</div>`,
  () => { const b = pick([2, 3, 5, 6, 7, 10, 11, 13]), a = R(2, 7);
    return mcItem(rt(a * a * b), `${a}${rt(b)}`, [`${b}${rt(a)}`, `${a * a}${rt(b)}`, `${a + 1}${rt(b)}`, `${a}${rt(a * b)}`, `${2 * a}${rt(b)}`]); });

// ---------- Algebraic expressions ----------
skill('a-translate', 'Translating words into expressions',
  `Key words: <b>plus, more than, increased by</b> → +; <b>minus, less than, decreased by</b> → −; <b>times, product, twice</b> → ×; <b>divided by, quotient</b> → ÷. Careful: "4 less than x" is <b>x − 4</b>, and "subtract x from 7" is <b>7 − x</b>. Write the number before the variable: 3 × y → 3y.`,
  () => { const v = pick(['x', 'y', 'n', 'a', 'm', 'p']), n = R(2, 20), t = R(0, 8);
    const T = [
      [`${n} more than ${v}`, `${v} + ${n}`, [`${n} − ${v}`, `${n}${v}`, `${v} − ${n}`]],
      [`${n} less than ${v}`, `${v} − ${n}`, [`${n} − ${v}`, `${v} + ${n}`, `${n}${v}`]],
      [`the product of ${n} and ${v}`, `${n}${v}`, [`${n} + ${v}`, sup(v, n), `${v} ÷ ${n}`]],
      [`${v} divided by ${n}`, `${v} ÷ ${n}`, [`${n} ÷ ${v}`, `${v} − ${n}`, `${n}${v}`]],
      [`twice ${v} decreased by ${n}`, `2${v} − ${n}`, [`2(${v} − ${n})`, `${n} − 2${v}`, `2${v} + ${n}`]],
      [`${n} times the sum of ${v} and 3`, `${n}(${v} + 3)`, [`${n}${v} + 3`, `${n} + ${v} + 3`, `3(${v} + ${n})`]],
      [`subtract ${v} from ${n}`, `${n} − ${v}`, [`${v} − ${n}`, `${n} + ${v}`, `${MINUS}${n}${v}`]],
      [`the square of ${v} increased by ${n}`, `${sup(v, 2)} + ${n}`, [`2${v} + ${n}`, `(${v} + ${n})<sup>2</sup>`, `${sup(v, 2)} − ${n}`]],
      [`${n} decreased by three times ${v}`, `${n} − 3${v}`, [`3${v} − ${n}`, `3(${n} − ${v})`, `${n} + 3${v}`]],
    ][t];

skill('a-evaluate', 'Evaluating expressions',
  `Replace each variable with its value <b>inside parentheses</b>, then compute using the order of operations.
   <div class="ex">If a = −2 and b = 3: a² − 2b = (−2)² − 2(3) = 4 − 6 = −2</div>`,
  () => { for (let i = 0; i < 30; i++) {
      const a = nz(-6, 6), b = nz(-6, 6), c = nz(-6, 6), t = R(0, 8);
      const T = [
        [`a − b`, F(a - b)], [`2(b − c)`, F(2 * (b - c))], [`${sup('a', 2)} + b`, F(a * a + b)], [`ab − c`, F(a * b - c)],
        [`${sup('a', 2)} − 2b`, F(a * a - 2 * b)], [`3a + 2b − c`, F(3 * a + 2 * b - c)], [`(a + b)<sup>2</sup>`, F((a + b) ** 2)],
        [`${sup('a', 3)} − bc`, F(a ** 3 - b * c)], [`<span class="fr"><span>a − b</span><span>c</span></span>`, F(a - b, c)],
      ][t];
      if (T[1].d <= 12) return Object.assign(fracItem(`If a = ${m(a)}, b = ${m(b)} and c = ${m(c)}, find &nbsp;${T[0]}`, T[1]), {words:true});
    } return SK['i-add'].gen(); });

// ---------- Polynomials ----------
const flipOne = p => { const q = p.slice(), idx = q.map((c, i) => c ? i : -1).filter(i => i >= 0); const i = pick(idx); q[i] = -q[i]; return q; };
const nudge = p => { const q = p.slice(), idx = q.map((c, i) => c ? i : -1).filter(i => i >= 0); const i = pick(idx); q[i] += pick([-1, 1]); return pclean(q); };
skill('p-add', 'Adding polynomials',
  `Combine <b>like terms</b> only: add the numbers in front of terms with the same variable and exponent. Terms with no partner are copied.
   <div class="ex">(7x² + 2) + (−x² + 3x − 6) = 6x² + 3x − 4</div>`,
  () => { const A = randPoly(R(1, 3)), B = randPoly(R(1, 3)), S = padd(A, B);
    return mcItem(`(${polyH(A)}) + (${polyH(B)})`, polyH(S), [polyH(padd(A, pscale(B, -1))), polyH(flipOne(S)), polyH(nudge(S)), polyH(flipOne(flipOne(S)))]); });
skill('p-sub', 'Subtracting polynomials',
  `Change the sign of <b>every</b> term in the polynomial being subtracted, then add like terms.
   <div class="ex">(2x − 19) − (−x + 13) = 2x − 19 + x − 13 = 3x − 32</div>`,
  () => { const A = randPoly(R(1, 3)), B = randPoly(R(1, 3)), D = padd(A, pscale(B, -1));
    const onlyFirst = B.slice(); onlyFirst[onlyFirst.length - 1] *= -1; // forgot to change all signs
    return mcItem(`(${polyH(A)}) − (${polyH(B)})`, polyH(D), [polyH(padd(A, B)), polyH(padd(A, onlyFirst)), polyH(flipOne(D)), polyH(nudge(D))]); });
skill('p-mul-mono', 'Multiplying by a monomial',
  `Use the <b>distributive property</b>: multiply the outside term by every term inside. When multiplying powers of x, add the exponents.
   <div class="ex">−2(4x² − 3x + 1) = −8x² + 6x − 2 &nbsp;·&nbsp; 3x(2x − 5) = 6x² − 15x</div>`,
  () => { const k = nz(-9, 9), e = R(0, 2), P = randPoly(R(1, 2)), Mn = Array(e).fill(0).concat([k]), Pr = pmul(Mn, P);
    const firstOnly = pshift(P.map((c, i) => i === P.length - 1 ? c * k : c), e);
    return mcItem(`${mono(k, 'x', e)}(${polyH(P)})`, polyH(Pr), [polyH(firstOnly), polyH(flipOne(Pr)), polyH(pscale(P, k)), polyH(nudge(Pr))]); });
skill('p-foil', 'Multiplying binomials (FOIL)',
  `Multiply <b>F</b>irst, <b>O</b>uter, <b>I</b>nner, <b>L</b>ast terms, then combine the middle terms.
   <div class="ex">(2x + 3)(x − 5) = 2x² − 10x + 3x − 15 = 2x² − 7x − 15</div>`,
  () => { const a = R(1, 5), b = nz(-9, 9), c = R(1, 5), d = nz(-9, 9), P = pmul([b, a], [d, c]);
    return mcItem(`${bin(a, b)}${bin(c, d)}`, polyH(P), [polyH(pclean([b * d, 0, a * c])), polyH([b * d, a * d - b * c, a * c]), polyH([-b * d, a * d + b * c, a * c]), polyH([b * d, a * d + b * c + 1, a * c])]); });
skill('p-div-mono', 'Dividing by a monomial',
  `Divide <b>each term</b> by the monomial: divide the numbers and subtract the exponents.
   <div class="ex">(18x⁴ − 10x² + 6x⁷) ÷ 2x² = 9x² − 5 + 3x⁵</div>`,
  () => { const k = nz(-6, 6) || 2, j = R(1, 3), Q = randPoly(R(1, 3), 8), Dd = pmul(pshift([k], j), Q);
    return mcItem(`(${polyH(Dd)}) ÷ ${mono(k, 'x', j)}`, polyH(Q), [polyH(pshift(Q, 1)), polyH(flipOne(Q)), polyH(nudge(Q)), polyH(pscale(Q, -1))]); });

// ---------- Equations & inequalities ----------
skill('eq-linear', 'Solving linear equations',
  `Do the same thing to <b>both sides</b> to get x alone: remove parentheses, collect the x terms on one side and the numbers on the other, then divide.

  () => { const x = nz(-10, 10), t = R(0, 3), a = nz(-9, 9), b = nz(-15, 15);

  () => { let a, b, c, d; do { a = R(1, 5); c = R(1, 5); b = nz(-7, 7); d = nz(-7, 7); } while (a * c < 2 || gcd(a, b) !== 1 || gcd(c, d) !== 1);

/* ================= ANSWER CHECKING ================= */
function parseAns(raw){
  const s = String(raw).trim().replace(/[−–—]/g, '-').replace(/,/g, '').replace(/\s+/g, ' ');
  let x;
  if ((x = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) { const w = +x[2], n = +x[3], d = +x[4]; if (!d) return null;
    return {f: F((x[1] ? -1 : 1) * (w * d + n), d), reduced: n < d && gcd(n, d) === 1}; }
  if ((x = s.match(/^(-?\d+)\/(-?\d+)$/))) { const n = +x[1], d = +x[2]; if (!d) return null; return {f: F(n, d), reduced: gcd(n, d) === 1 && d > 0}; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) { const f = decF(s.startsWith('-.') ? '-0' + s.slice(1) : s.startsWith('.') ? '0' + s : s); return {f, reduced:true, dec: s.includes('.')}; }
  return null;
}
function checkItem(it, raw){
  if (it.kind === 'mc') return {ok: raw === it.ans};
  const p = parseAns(raw);
  if (!p) return {invalid:true, msg: it.kind === 'frac' ? 'Type a whole number, a fraction like 3/4, or a mixed number like 2 1/3.' : 'Type a number, for example 12.5 or −7.'};
  if (it.kind === 'num') return {ok: Math.abs(p.f.n / p.f.d - it.ans) <= it.tol + 1e-9};
  if (!feq(p.f, it.ans)) return {ok:false};
  if (p.dec && it.ans.d !== 1) return {ok:false, note:'Right value, but write it as a fraction or mixed number.'};
  if (!p.reduced) return {ok:false, note:'Right value, but it is not in lowest terms yet.'};
  return {ok:true};
}

const D = 864e5, now = Date.now();
const pref = u => P.db.prefs[u] || (P.db.prefs[u] = {});
const bandOf = u => pref(u).band || (/\b(9|10)\b/.test(P.userOf(u).pos || '') ? '910' : '78');
const myAttempts = (u, id) => P.db.attempts.filter(a => a.u === u && (!id || a.skill === id));
const bestOf = (u, id) => { const a = myAttempts(u, id); return a.length ? Math.max(...a.map(x => x.score)) : null; };
const starsOf = s => s == null ? 0 : s >= 10 ? 3 : s >= MASTER ? 2 : s >= 5 ? 1 : 0;
const status = best => best == null ? ['Not started', 'p-gray'] : best >= MASTER ? ['Mastered', 'p-green'] : best >= 5 ? ['Practicing', 'p-amber'] : ['Needs help', 'p-red'];
const sPill = best => { const [t, c] = status(best); return `<span class="pill ${c}">${t}${best != null ? ` · ${best}/${ITEMS}` : ''}</span>`; };
const isStudent = () => P.me.role === 'student';
const caught = (u, id) => (bestOf(u, id) || 0) >= MASTER;
const coinsOf = u => myAttempts(u).reduce((s, a) => s + (a.coins || 0), 0) - (pref(u).spent || 0);
const weekCoins = u => myAttempts(u).filter(a => a.at > Date.now() - 7 * D).reduce((s, a) => s + (a.coins || 0), 0);
const xpOf = u => myAttempts(u).reduce((s, a) => s + a.score * 10, 0);
const levelOf = xp => 1 + Math.floor(Math.sqrt(xp / 100));
const levelPct = xp => { const l = levelOf(xp), lo = (l - 1) ** 2 * 100, hi = l ** 2 * 100; return Math.round(100 * (xp - lo) / (hi - lo)); };
const totalStars = u => Object.keys(SK).reduce((s, id) => s + starsOf(bestOf(u, id)), 0);
const streakOf = u => { const days = new Set(myAttempts(u).map(a => ymd(new Date(a.at)))); let d = new Date(), n = 0;
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); } return n; };
const nextSkill = (u, b) => bandSkills(b).find(id => !caught(u, id)) || null;
const buddyOf = u => pref(u).buddy || BUDDIES[0];
const buddySVG = (u, mood = 'idle', cls = 'buddy') => monsterSVG(buddyOf(u), mood, pref(u).wear || [], cls);
const monName = id => monsterOf('mon-' + id).name;

// sample progress so the teacher view and leaderboard aren't empty in the demo
const seed = (u, list) => list.map(([skill, score, days], i) => ({u, skill, score, total:ITEMS, coins: score * 10 + (score === 10 ? 20 : 0), at: now - days * D - i * 36e5}));
const SEED = [
  ...seed('student',  [['f-add-sim',9,6],['f-sub-sim',8,6],['f-mixed-sim',6,5],['f-mixed-sim',8,4],['f-add-dis',5,3],['f-sub-dis',4,2],['f-mul',7,1]]),
  ...seed('student2', [['f-add-sim',7,5],['f-add-sim',10,4],['f-sub-sim',9,4],['f-mixed-sim',9,3],['f-add-dis',8,2],['f-sub-dis',8,2],['f-word',6,1],['d-add',10,1]]),
  ...seed('student5', [['f-add-sim',4,3],['f-add-sim',6,2],['f-sub-sim',3,1]]),
  ...seed('student3', [['i-add',10,6],['i-sub',9,5],['i-mul',8,4],['i-div',9,4],['i-frac',6,3],['fd-addsub',5,2],['e-eval',9,1]]),
  ...seed('student4', [['i-add',8,4],['i-sub',5,3],['i-sub',7,2],['i-mul',4,1]]),
];

/* ================= PLAY: MAP, BATTLE, COLLECTION, SHOP ================= */
let S = null, screen = 'map';
function bandSwitch(b, fn){
  return `<div class="bandsw">${Object.entries(BANDS).map(([k, v]) => `<button class="${k === b ? 'on' : ''}" onclick="${fn}('${k}')">${v.label}</button>`).join('')}</div>`;
}
function setBand(b){ pref(P.me.u).band = b; P.save(); P.refresh(); }
function go(s){ screen = s; P.refresh(); window.scrollTo(0, 0); }

function learn(el){
  if (LS) return lessonView(el);
  if (STORY) return storyView(el);
  if (S) return battle(el);
  if (isStudent() && !pref(P.me.u).buddy) return buddyPick(el);
  if (isStudent() && !seenStory('prologue')) return playStory('prologue');
  if (screen === 'book') return book(el);
  if (screen === 'dex') return dex(el);
  if (screen === 'shop') return shop(el);
  map(el);
}
function hud(u){
  const xp = xpOf(u), b = bandOf(u), nx = nextSkill(u, b), all = bandSkills(b);
  return `<div class="hud">${buddySVG(u)}
    <div class="me"><h2>${esc(P.me.name.split(' ')[0])} &amp; ${monsterOf(buddyOf(u)).name}</h2><small>${esc(P.me.pos)}</small>
      <div class="lvl"><b>Level ${levelOf(xp)}</b><div class="xp"><i style="width:${levelPct(xp)}%"></i></div></div>
      <div class="hudbtns">${nx ? `<button class="hbtn go" onclick="startPractice('${nx}')">▶ Play: ${SK[nx].title}</button>` : `<span class="chip">All ${all.length} monsters caught! 🎉</span>`}
        <button class="hbtn ghosty" onclick="go('dex')">Monsters ${all.filter(id => caught(u, id)).length}/${all.length}</button>
        <button class="hbtn ghosty" onclick="go('shop')">Buddy shop</button>
        <button class="hbtn ghosty" onclick="go('book')">📖 Story</button></div></div>
    <div class="chips"><span class="chip">${COIN} ${coinsOf(u)}</span><span class="chip">${STAR()} ${totalStars(u)}</span><span class="chip">${FLAME} ${streakOf(u)} day${streakOf(u) === 1 ? '' : 's'}</span></div></div>`;
}
function map(el){
  const u = P.me.u, b = bandOf(u), stu = isStudent(), nx = stu ? nextSkill(u, b) : null;
  const islands = BANDS[b].units.map(([name, list], ix) => { const [c, soft] = ISLE[ix % ISLE.length], got = stu ? list.filter(([id]) => caught(u, id)).length : 0;
    return `<div class="island" style="--c:${c};--soft:${soft}"><div class="ihead"><span class="num" style="background:${c}">${ix + 1}</span><div style="flex:1"><span class="ichap">Chapter ${ix + 1} · ${ISLAND[b][ix]}</span><h3>${name}</h3></div>${stu ? `<small>${got}/${list.length} caught</small>` : ''}
        ${!stu || seenStory(`${b}-${ix}-intro`) ? `<button class="storybtn" onclick="playStory('${b}-${ix}-intro')">📖 Story</button>` : ''}</div>
      <div class="path">${list.map(([id, ws]) => { const cg = stu && caught(u, id), show = !stu || cg;
        return `<button class="node ${cg ? 'caught' : ''} ${id === nx ? 'next' : ''}" onclick="startPractice('${id}')" title="${SK[id].title}">
          <span class="disc">${monsterSVG('mon-' + id, cg ? 'happy' : 'idle', [], show ? 'mini' : 'mini locked')}</span>
          ${stu ? stars3(starsOf(bestOf(u, id))) : ''}<b>${SK[id].title}</b><small>WS ${ws}</small></button>`; }).join('')}</div></div>`; }).join('');
  const kids = P.usersWith('student').filter(s => bandOf(s.u) === b).map(s => ({s, c: weekCoins(s.u)})).sort((x, y) => y.c - x.c).slice(0, 6);
  el.innerHTML = `<div class="stack">
    ${stu ? hud(u) : `<div class="card"><div class="ptop"><div class="grow"><h2>Lessons (preview)</h2><p class="hint" style="margin:0">Play any lesson the way learners see it. Nothing you do here is saved.</p></div><button class="btn ghost sm" onclick="go('book')">📖 Read the story</button></div></div>`}
    <div class="homegrid"><div class="stack">
      <div class="card" style="padding:.9rem 1.1rem"><div class="ptop"><div class="grow"><b style="font-weight:600">Monster map</b><br><small style="color:var(--muted)">Each lesson hides a Bilang Monster. Beat it to catch it!</small></div>${bandSwitch(b, 'setBand')}</div></div>
      ${islands}</div>
      <div class="side">
        <div class="card"><h2>${COIN} Top this week</h2><p class="hint" style="margin-bottom:.6rem">${BANDS[b].label} learners</p><div class="lb">
          ${kids.map((k, i) => `<div class="${k.s.u === u ? 'me' : ''}"><span class="rk">${i + 1}</span><span style="width:2rem;height:2rem;flex:none">${monsterSVG(buddyOf(k.s.u), 'idle', pref(k.s.u).wear || [], 'mini')}</span><span class="nm">${esc(k.s.name.split(' ')[0])}</span><b>${k.c}</b></div>`).join('') || '<div class="empty">No players yet.</div>'}</div></div>
        <div class="card"><h2>How to play</h2><ol style="padding-left:1.1rem;font-size:.85rem;line-height:1.7;color:var(--muted)">
          <li>Tap a monster on the map.</li><li>Answer ${ITEMS} questions. Every right answer hits the monster.</li>
          <li>Get ${MASTER} right to <b>catch</b> it (${STAR()}${STAR()}). All ${ITEMS} = ${STAR()}${STAR()}${STAR()}.</li>
          <li>Stuck? Tap <b>🎬 Watch the lesson</b> and Lolo Pawikan will show you how.</li><li>Spend coins on gear for your buddy.</li></ol></div>
      </div></div></div>`;
}
function buddyPick(el){
  el.innerHTML = `<div class="card" style="text-align:center;padding:2rem 1rem"><h2 style="font-size:1.4rem">Choose your math buddy!</h2>
    <p class="hint">Your buddy fights the Bilang Monsters with you. You can dress it up later with coins you earn.</p>
    <div class="pickrow">${BUDDIES.map(b => `<button class="pick" onclick="chooseBuddy('${b}')">${monsterSVG(b, 'happy', [], 'p')}<b>${monsterOf(b).name}</b><span class="btn sm">Choose</span></button>`).join('')}</div></div>`;
}
function chooseBuddy(b){ pref(P.me.u).buddy = b; P.save(); sfx('buy'); P.refresh(); }

function startPractice(id, skipStory, skipLesson){
  const sb = bandOf(P.me.u), ix = unitIndex(sb, id);
  if (isStudent() && !skipStory && ix >= 0 && !seenStory(`${sb}-${ix}-intro`)) return playStory(`${sb}-${ix}-intro`, () => startPractice(id, true));
  if (!skipLesson && !(pref(P.me.u).watched || {})[id] && !myAttempts(P.me.u, id).length) return playLesson(id, () => startPractice(id, true, true));
  S = {id, items: Array.from({length: ITEMS}, () => SK[id].gen()), i:0, res:[], answered:false, combo:0, coins:0, hint:{}, wrongRun:0, mood:'idle', anim:null, lvl0: levelOf(xpOf(P.me.u))};
  screen = 'map'; P.tab('learn'); window.scrollTo(0, 0);
}
function leavePractice(){ S = null; P.refresh(); }
function showLesson(){ if (S && !S.answered) S.hint[S.i] = true; playLesson(S.id, () => P.refresh()); }

function battle(el){
  if (S.i >= ITEMS) return winScreen(el);
  const sk = SK[S.id], b = bandOf(P.me.u), M = monsterOf('mon-' + S.id), it = S.items[S.i], last = S.last;
  const hits = S.res.filter(r => r.ok).length, hp = Math.max(0, 100 - hits * (100 / MASTER)), ko = hits >= MASTER;
  const lvl = isStudent() ? levelOf(xpOf(P.me.u)) : 1;
  el.innerHTML = `<div class="stack">
    <div class="ptop"><button class="btn ghost sm" onclick="leavePractice()">← Map</button><div class="grow"><b style="font-weight:600">${sk.title}</b><br><small style="color:var(--muted)">${BANDS[b].label} · Worksheet ${wsOf(b, S.id) || '—'}</small></div>
      <span class="chip" style="background:var(--brand-soft);color:var(--brand-d)">${COIN} +${S.coins}</span></div>
    <div class="arena" id="arena"><span class="sun"></span>
      ${S.i === 0 && !S.answered ? `<span class="speech mon-s">${pick(TAUNT).replace('{topic}', sk.title.toLowerCase())}</span>` : ''}<button class="mute" onclick="toggleMute()">${isMuted() ? '🔇 Sound off' : '🔊 Sound on'}</button>
      ${S.combo >= 2 ? `<span class="combo">Combo ×${S.combo}!</span>` : ''}
      <div class="fighters">
        <div class="fighter" id="fBuddy">${monsterSVG(isStudent() ? buddyOf(P.me.u) : BUDDIES[0], last && !last.ok ? 'hit' : last && last.ok ? 'happy' : 'idle', isStudent() ? pref(P.me.u).wear || [] : [], 'mon')}
          <div class="tag">${isStudent() ? esc(P.me.name.split(' ')[0]) : 'You'} · Lv ${lvl}</div></div>
        <span class="vs">VS</span>
        <div class="fighter" id="fMon">${monsterSVG('mon-' + S.id, ko ? 'ko' : last ? (last.ok ? 'hit' : 'happy') : 'idle', [], 'mon')}
          <div class="tag">${M.name}<div class="hp ${hp <= 25 ? 'low' : ''}"><i style="width:${hp}%"></i></div></div></div>
      </div></div>
    <div class="card qcard"><div class="qtools"><small style="color:var(--muted)">Question ${S.i + 1} of ${ITEMS}${ko ? ' · <b style="color:#ca8a04">Bonus round: get them all for 3 stars!</b>' : ''}</small>
        <div class="dots">${S.items.map((_, k) => `<i class="${k < S.res.length ? (S.res[k].ok ? 'ok' : 'no') : k === S.i ? 'cur' : ''}"></i>`).join('')}</div>
        <button class="linkbtn" onclick="showLesson()">🎬 Watch the lesson</button></div>
      <div class="qbox ${it.words ? 'words' : ''}">${it.q}</div>
      ${it.kind === 'mc'
        ? `<div class="choices">${it.choices.map((c, k) => `<button id="ch${k}" ${S.answered ? 'disabled' : ''} class="${S.answered ? (k === it.ans ? 'right' : last.k === k ? 'wrong' : '') : ''}" onclick="answer(${k})">${c}</button>`).join('')}</div>`
        : `<div class="ansrow"><input id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" ${S.answered ? `disabled value="${esc(last.raw)}"` : ''} placeholder="${it.kind === 'frac' ? 'e.g. 3/4 or 2 1/3' : 'Your answer'}">${S.answered ? '' : '<button class="btn" id="chk" onclick="answer()">Attack!</button>'}</div>
           <small style="color:var(--muted);display:block;margin-top:.4rem">${it.kind === 'frac' ? 'Fractions: 3/4 · mixed numbers: 2 1/3 · negatives: -5/6. Answer in lowest terms.' : 'Numbers only. Use - for negative.'}</small>`}
      <div id="fb">${S.answered ? `<div class="fb ${last.ok ? 'ok' : 'no'}">${last.ok ? `<b>Hit!</b> +${last.coins} coins${S.combo >= 3 ? ' (combo bonus!)' : ''}` : `<b>Missed!</b> ${last.note ? last.note + ' ' : ''}The answer is <b>${it.show}</b>.`}</div>
        ${!last.ok && S.wrongRun >= 2 ? `<div class="fb info"><b>Let's review together:</b><div style="margin-top:.3rem">${sk.learn}</div></div>` : ''}
        <div class="actions" style="margin-top:.8rem"><button class="btn" id="nextBtn" onclick="next()">${S.i === ITEMS - 1 ? 'Finish battle' : 'Next question →'}</button></div>` : (S.err ? `<div class="fb info">${S.err}</div>` : '')}</div>
    </div></div>`;
  const inp = $('ans');
  if (inp && !S.answered) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); answer(); } }; }
  if (S.answered) $('nextBtn').focus();
  if (S.anim) { const [a, bb] = S.anim === 'hit' ? ['fBuddy', 'fMon'] : ['fMon', 'fBuddy'];
    $(a).classList.add(S.anim === 'hit' ? 'lunge' : 'lungeL'); setTimeout(() => $(bb) && $(bb).classList.add('shake'), 180);
    if (S.anim === 'hit') { const z = document.createElement('span'); z.className = 'zap'; z.textContent = S.combo >= 3 ? 'CRITICAL!' : 'POW!'; z.style.cssText = 'right:14%;top:22%'; $('arena').appendChild(z); }
    S.anim = null; }
}
function answer(k){
  if (S.answered) return;
  const it = S.items[S.i], raw = it.kind === 'mc' ? k : $('ans').value, r = checkItem(it, raw);
  if (r.invalid) { S.err = r.msg; P.refresh(); return; }
  S.err = null; S.answered = true;
  let coins = 0;
  if (r.ok) { S.combo++; S.wrongRun = 0; coins = (S.hint[S.i] ? 5 : 10) + (S.combo >= 3 ? 5 : 0); S.coins += coins; sfx('ok'); S.anim = 'hit'; }
  else { S.combo = 0; S.wrongRun++; sfx('no'); S.anim = 'miss'; }
  S.last = {ok: r.ok, note: r.note, k, raw: it.kind === 'mc' ? '' : raw, coins};
  S.res.push({ok: r.ok, given: it.kind === 'mc' ? it.choices[k] : esc(raw)});
  P.refresh();
}
function next(){ S.i++; S.answered = false; S.last = null; P.refresh(); }
function winScreen(el){
  const score = S.res.filter(r => r.ok).length, st = starsOf(score), M = monsterOf('mon-' + S.id), u = P.me.u, stu = isStudent();
  const wasCaught = stu && caught(u, S.id), nowCaught = score >= MASTER;
  if (!S.saved) {
    if (score === ITEMS) S.coins += 20;
    if (stu) { P.db.attempts.push({u, skill:S.id, band:bandOf(u), score, total:ITEMS, coins:S.coins, at:Date.now()}); P.save(); }
    S.saved = true; S.lvlUp = stu && levelOf(xpOf(u)) > S.lvl0;
    setTimeout(() => { sfx(S && S.lvlUp ? 'lvl' : nowCaught ? 'win' : 'no'); if (nowCaught) confetti(); }, 150);
  }
  const nx = stu ? nextSkill(u, bandOf(u)) : null, wb = bandOf(u), wix = unitIndex(wb, S.id);
  const storyKey = stu && wix >= 0 && islandDone(u, wb, wix) && !seenStory(`${wb}-${wix}-outro`) ? `${wb}-${wix}-outro` : null;
  if (!S.line) S.line = pick(nowCaught ? THANKS : ESCAPE);
  el.innerHTML = `<div class="stack"><div class="card win">
      <h2 style="font-size:1.5rem">${nowCaught ? (score === ITEMS ? 'Perfect battle!' : 'You caught it!') : st ? 'So close!' : 'The monster got away!'}</h2>
      <div class="bigstars">${[1, 2, 3].map(k => STAR(k <= st)).join('')}</div>
      <div class="big">${score} / ${ITEMS}</div>
      <div class="caughtcard">${monsterSVG('mon-' + S.id, nowCaught ? 'happy' : 'idle', [], 'c')}<div><b>${M.name}</b><br><small>${nowCaught ? (wasCaught ? 'Already in your collection. Nice rematch!' : 'New monster added to your collection!') : `Get ${MASTER} right to catch ${M.name}.`}</small></div></div>
      <div><span class="monsay">${M.name}: “${S.line}”</span></div>
      ${storyKey ? `<div style="margin-top:1rem"><span class="pill p-amber">${ISLAND[wb][wix]} is saved!</span><br><button class="btn" style="margin-top:.6rem;background:#ca8a04" onclick="S=null;playStory('${storyKey}')">📖 Continue the story ▶</button></div>` : ''}
      <p style="margin-top:1rem;font-weight:600">${COIN} +${S.coins} coins${score === ITEMS ? ' (includes +20 perfect bonus)' : ''}</p>
      ${S.lvlUp ? `<p style="margin-top:.4rem;font-weight:700;color:#ca8a04">⬆ Level up! You are now Level ${levelOf(xpOf(u))}.</p>` : ''}
      ${stu ? '' : '<p class="hint">Preview only: nothing was saved.</p>'}
      <div class="actions" style="justify-content:center;margin-top:1.2rem"><button class="btn ghost" onclick="leavePractice()">Back to map</button>${nowCaught ? '' : `<button class="btn ghost" onclick="const i='${S.id}';S=null;playLesson(i)">🎬 Watch the lesson</button>`}<button class="btn ghost" onclick="startPractice('${S.id}', true, true)">Battle again</button>
        ${nx && nx !== S.id ? `<button class="btn" onclick="startPractice('${nx}')">Next monster →</button>` : ''}</div></div>
    <details class="card"><summary style="cursor:pointer;font-weight:600">Review my answers</summary><div class="review">${S.items.map((it, k) => `<div><span class="mk ${S.res[k].ok ? 'ok' : 'no'}">${S.res[k].ok ? '✓' : '✗'}</span>
      <span style="flex:1;min-width:12rem">${it.q}</span><span>You: <b>${S.res[k].given || '—'}</b></span>${S.res[k].ok ? '' : `<span>Answer: <b>${it.show}</b></span>`}</div>`).join('')}</div></details></div>`;
}
function dex(el){
  const u = P.me.u, b = bandOf(u), all = bandSkills(b), got = all.filter(id => caught(u, id)).length;
  el.innerHTML = `<div class="stack"><div class="card"><div class="ptop"><button class="btn ghost sm" onclick="go('map')">← Map</button><div class="grow"><h2>My monster collection</h2><small style="color:var(--muted)">${got} of ${all.length} caught · ${BANDS[b].label}</small></div>${bandSwitch(b, 'setBand')}</div>
    <div class="bar" style="margin-top:1rem"><i style="width:${Math.round(100 * got / all.length)}%"></i></div></div>
    ${BANDS[b].units.map(([name, list]) => `<div class="card"><h2 style="margin-bottom:.8rem">${name}</h2><div class="dex">${list.map(([id]) => { const cg = caught(u, id);
      return `<button class="dexcard ${cg ? '' : 'locked'}" onclick="startPractice('${id}')">${monsterSVG('mon-' + id, cg ? 'happy' : 'idle', [], 'd')}<b>${cg ? monName(id) : '???'}</b><small>${SK[id].title}</small>${cg ? stars3(starsOf(bestOf(u, id))) : '<small>Tap to battle</small>'}</button>`; }).join('')}</div></div>`).join('')}</div>`;
}
function shop(el){
  const u = P.me.u, p = pref(u), owned = p.owned || [], wear = p.wear || [], coins = coinsOf(u);

const ttsOn = () => { try { return localStorage.getItem('aralmath-tts') === '1'; } catch (e) { return false; } };
/* ---- read-aloud with the most natural voice on this device ----
   Picks neural/"Natural" voices first (Edge, Chrome, Apple enhanced voices), prefers Philippine
   English, skips novelty/robotic voices, casts a matching voice per character instead of
   stretching the pitch, and reads math the way a teacher would say it. */
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|hysterical|deranged|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|espeak/i;
const MALE = /\b(james|guy|davis|andrew|brian|christopher|eric|roger|steffan|tony|ryan|thomas|william|daniel|alex|aaron|arthur|oliver|george|rishi|tom|evan|nathan|liam|male|david|mark|jacob|jason|ethan|noah|lee|gordon)\b/i;
const FEMALE = /\b(rosa|jenny|aria|ana|emma|michelle|sara|samantha|ava|allison|susan|zira|karen|moira|tessa|serena|victoria|fiona|female|libby|sonia|natasha|jane|nancy|joanna|salli|kimberly|ivy|kendra|catherine|hazel|heera|neerja|clara|amber|ashley|cora|elizabeth|jessa|nicole|zoe|isabella|maisie|blessica)\b/i;
let VOICES = [];
function loadVoices(){
  try { VOICES = speechSynthesis.getVoices().filter(v => /^en|^fil/i.test(v.lang) && !NOVELTY.test(v.name)); } catch (e) { VOICES = []; }
  document.querySelectorAll('select.vsel').forEach(fillVoiceSelect);
}
try { if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } } catch (e) {}
const voiceScore = v => { const n = v.name;
  return (/natural/i.test(n) ? 60 : 0) + (/neural/i.test(n) ? 50 : 0) + (/premium|enhanced|siri/i.test(n) ? 40 : 0) + (/online/i.test(n) ? 20 : 0) + (/google/i.test(n) ? 25 : 0)
    + (/en-PH|fil/i.test(v.lang) ? 30 : /en-(US|GB|AU)/i.test(v.lang) ? 10 : 0) + (v.localService === false ? 5 : 0); };
const rankedVoices = () => VOICES.slice().sort((a, b) => voiceScore(b) - voiceScore(a));
const chosenVoice = () => { try { return localStorage.getItem('aralmath-voice') || 'auto'; } catch (e) { return 'auto'; } };
function setVoice(name){ try { localStorage.setItem('aralmath-voice', name); } catch (e) {} document.querySelectorAll('select.vsel').forEach(s => s.value = name);
  speak(name === 'auto' ? "Hi! I'll pick a voice for each character." : "Hello! This is how I sound.", 'nar'); }
function fillVoiceSelect(sel){
  const top = rankedVoices().slice(0, 10), cur = chosenVoice();
  sel.innerHTML = `<option value="auto">Voice: best for each character</option>` + top.map(v => `<option value="${esc(v.name)}" ${v.name === cur ? 'selected' : ''}>${esc(v.name.replace(/Microsoft |Online |\(Natural\)|- English.*$/g, '').trim())} (${v.lang})</option>`).join('');
  sel.value = top.some(v => v.name === cur) ? cur : 'auto';
}
const voiceSelect = () => `<select class="vsel icb" onchange="setVoice(this.value)" title="Choose the voice that sounds most human on this device"></select>`;
// who → [wanted gender, pitch, rate]: small, natural adjustments only
const CAST = {lolo:['m', .95, .88], gulo:['m', .9, .92], buddy:['f', 1.08, 1], mon:['f', 1.05, 1.02], nar:['f', 1, .95], crowd:['f', 1, .95]};
function voiceFor(who){
  const all = rankedVoices(); if (!all.length) return null;
  const pickName = chosenVoice(); if (pickName !== 'auto') return all.find(v => v.name === pickName) || all[0];
  const [g] = CAST[who] || ['f'], same = all.filter(v => (g === 'm' ? MALE : FEMALE).test(v.name));
  if (who === 'gulo' && same.length > 1) { const lolo = voiceFor('lolo'); return same.find(v => v !== lolo && voiceScore(v) >= voiceScore(same[0]) - 25) || same[0]; } // a different man from Lolo
  return same[0] || all[0];
}
const ORD = {2:'half', 3:'third', 4:'fourth', 5:'fifth', 6:'sixth', 7:'seventh', 8:'eighth', 9:'ninth', 10:'tenth', 12:'twelfth'};
function spoken(t){
  return t.replace(/&amp;/g, '&').replace(/(\d+)\/(\d+)/g, (_, n, d) => ORD[d] ? `${n} ${ORD[d]}${+n === 1 ? '' : 's'}` : `${n} over ${d}`)
    .replace(/[−-](?=\d)/g, ' negative ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/ = \?/g, ' equals what?').replace(/=/g, ' equals ')
    .replace(/x²/g, 'x squared').replace(/√/g, 'square root of ').replace(/\.\.\./g, ', ').replace(/\s+/g, ' ').trim();
}
function speak(text, who = 'nar'){
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const v = voiceFor(who), [, pitch, rate] = CAST[who] || ['f', 1, .95];
    // one utterance per sentence: sounds more natural and avoids Chrome cutting off long lines
    spoken(text).split(/(?<=[.!?])\s+/).filter(Boolean).forEach(sen => { const u = new SpeechSynthesisUtterance(sen);
      if (v) { u.voice = v; u.lang = v.lang; } u.pitch = pitch; u.rate = rate; speechSynthesis.speak(u); }); } catch (e) {}
}

  if (isMuted() || ttsOn()) return;

}

    <p style="font-size:.85rem;margin-bottom:.8rem">${sheet.items[0].kind === 'mc' ? 'Choose the letter of the correct answer.' : 'Solve each item. Show your solution. Write fractions in lowest terms.'}</p>
    <ol>${sheet.items.map(it => `<li>${it.q}${it.kind === 'mc' ? `<div class="mcs">${it.choices.map((c, k) => `${L[k]}) ${c}`).join(' &nbsp;&nbsp; ')}</div>` : '<span class="line"></span>'}</li>`).join('')}</ol>
    <div class="key"><h1>Answer key</h1><ol>${sheet.items.map(it => `<li>${it.kind === 'mc' ? `${L[it.ans]}) ${it.show}` : it.show}</li>`).join('')}</ol></div></div>`;
}
function printSheet(){
  $('printArea').innerHTML = sheetHTML();
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

P.init(CFG);
</script>
<script src="../shared/hublock.js"></script>
