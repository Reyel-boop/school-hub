<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../shared/cloud.js" data-mod="aralmath"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aral Math</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Patrick+Hand&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/proto.css">
<style>
  :root{--brand:#0e7490;--brand-d:#155e75;--brand-soft:#cffafe;--grad:linear-gradient(135deg,#06b6d4,#4338ca)}
  /* stacked fraction */
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.92em;line-height:1.1}
  .fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
  .fr span:last-child{padding:0 .15em}
  .rad{border-top:1.5px solid currentColor;padding:0 .1em}
  .bandsw{display:inline-flex;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;background:#fff}
  .bandsw button{padding:.5rem 1rem;font-size:.85rem;color:var(--muted)}
  .bandsw button.on{background:var(--brand);color:#fff;font-weight:500}
  .unit h3{font-size:.95rem;font-weight:600;margin-bottom:.7rem}
  .skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
  .skill{display:flex;flex-direction:column;gap:.35rem;text-align:left;border:1px solid var(--line);border-radius:.7rem;padding:.75rem .85rem;background:#fff;transition:border-color .15s,box-shadow .15s}
  .skill:hover{border-color:var(--brand);box-shadow:0 4px 14px -6px rgba(14,116,144,.35)}
  .skill b{font-weight:500;font-size:.88rem;line-height:1.3}
  .skill small{color:var(--muted);font-size:.72rem}
  .skill .pill{align-self:flex-start}
  .ptop{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .ptop .grow{flex:1;min-width:10rem}
  .ptop h2{margin:0}
  .dots{display:flex;gap:.25rem;flex-wrap:wrap}
  .dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--line)}
  .dots i.ok{background:#16a34a}.dots i.no{background:#dc2626}.dots i.cur{outline:2px solid var(--brand);outline-offset:1px}
  .lesson{background:var(--brand-soft);border-radius:.7rem;padding:.9rem 1rem;font-size:.9rem;line-height:1.6}
  .lesson summary{cursor:pointer;font-weight:600;color:var(--brand-d)}
  .lesson .ex{margin-top:.5rem;background:#fff;border-radius:.5rem;padding:.6rem .8rem}
  .qbox{font-size:1.35rem;line-height:1.9;padding:.6rem 0 1rem}
  .qbox.words{font-size:1rem;line-height:1.6}
  .ansrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .ansrow input{flex:1;min-width:10rem;font-size:1.1rem}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .choices button{border:1px solid #cbd5e1;border-radius:.6rem;padding:.7rem .9rem;text-align:left;background:#fff;font-size:1rem;line-height:1.6}
  .choices button:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .choices button.right{border-color:#16a34a;background:#dcfce7}
  .choices button.wrong{border-color:#dc2626;background:#fee2e2}
  .fb{margin-top:1rem;border-radius:.6rem;padding:.7rem .9rem;font-size:.92rem;line-height:1.6}
  .fb.ok{background:#dcfce7;color:#14532d}.fb.no{background:#fee2e2;color:#7f1d1d}.fb.info{background:#fef3c7;color:#78350f}
  .bar{height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden;min-width:5rem}
  .bar i{display:block;height:100%;background:var(--brand)}
  table.t{width:100%;border-collapse:collapse;font-size:.85rem}
  table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:.75rem;padding:.5rem;border-bottom:1px solid var(--line)}
  table.t td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
  .review{display:flex;flex-direction:column;gap:.4rem;margin-top:1rem}
  .review div{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .7rem;font-size:.9rem;line-height:1.8}
  .review .mk{font-weight:700;width:1.2rem}
  .review .mk.ok{color:#16a34a}.review .mk.no{color:#dc2626}
  .big{font-size:2.4rem;font-weight:700;color:var(--brand-d)}
  /* printable worksheet */
  #printArea{display:none}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:1.4rem;color:#0f172a}
  .sheet h1{font-size:1.15rem;font-weight:700;margin-bottom:.2rem}
  .sheet .who{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;margin:.6rem 0 1rem}
  .sheet .who span{flex:1;min-width:10rem;border-bottom:1px solid #94a3b8;padding-bottom:.2rem}
  .sheet ol{columns:2;column-gap:2rem;padding-left:1.4rem}
  .sheet li{break-inside:avoid;margin-bottom:1.1rem;line-height:1.9}
  .sheet .line{display:block;border-bottom:1px solid #94a3b8;width:70%;height:1.4rem}
  .sheet .mcs{font-size:.92em}
  .sheet .key{break-before:page;margin-top:1.5rem}
  .sheet .key ol li{margin-bottom:.3rem}
  @media print{
    body.printing > *:not(#printArea){display:none!important}
    body.printing #printArea{display:block}
    body.printing .sheet{border:0;padding:0}
  }
  /* ===== Game layer: Bilang Monsters ===== */
  .ico{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block}
  .hud{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;background:var(--grad);color:#fff;border-radius:1rem;padding:1rem 1.2rem;position:relative;overflow:hidden}
  .hud::after{content:"";position:absolute;right:-3rem;top:-3rem;width:12rem;height:12rem;border-radius:50%;background:rgba(255,255,255,.08)}
  .hud .buddy{width:6.5rem;height:6.5rem;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
  .hudsobo{width:17rem;height:17rem;margin:0 -1rem 0 -1rem;flex:none;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
  .hudsay{margin:.45rem 0 .1rem;background:rgba(255,255,255,.95);color:#0f172a;border-radius:.8rem;padding:.45rem .75rem;font-size:.9rem;font-weight:600;display:inline-block;max-width:100%}
  .hudsay b{color:var(--brand-d)}
  .hud .me{flex:1;min-width:12rem;position:relative;z-index:1}
  .hud .me h2{color:#fff;font-size:1.25rem;margin:0}
  .hud .me small{opacity:.85}
  .lvl{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
  .lvl b{background:#fff;color:var(--brand-d);border-radius:1rem;padding:.1rem .6rem;font-size:.75rem;white-space:nowrap}
  .lvl .xp{flex:1;height:.55rem;border-radius:1rem;background:rgba(255,255,255,.3);overflow:hidden}
  .lvl .xp i{display:block;height:100%;background:#fde047}
  .chips{display:flex;gap:.5rem;flex-wrap:wrap;position:relative;z-index:1}
  .chip{background:rgba(255,255,255,.18);border-radius:2rem;padding:.35rem .8rem;font-weight:600;font-size:.9rem;white-space:nowrap}
  .hudbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;position:relative;z-index:1}
  .hbtn{background:#fff;color:var(--brand-d);border-radius:2rem;padding:.5rem 1rem;font-weight:600;font-size:.85rem}
  .hbtn.go{background:#fde047;color:#422006;box-shadow:0 4px 0 #ca8a04}
  .hbtn.go:active{transform:translateY(2px);box-shadow:0 2px 0 #ca8a04}
  .hbtn.ghosty{background:rgba(255,255,255,.15);color:#fff}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  /* map */
  .island{border-radius:1rem;padding:1rem 1.1rem 1.2rem;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden}
  .island .ihead{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
  .island .ihead .num{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;flex:none}
  .island .ihead h3{font-size:1rem;font-weight:600;margin:0;flex:1}
  .island .ihead small{color:var(--muted);font-size:.75rem}
  .path{display:flex;flex-wrap:wrap;gap:1.1rem .6rem;position:relative}
  .node{width:7.2rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center;position:relative}
  .node .disc{width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;border:3px solid #e2e8f0;transition:transform .15s;position:relative}
  .node:hover .disc{transform:scale(1.07)}
  .node .disc svg{width:3.9rem;height:3.9rem}
  .node.caught .disc{background:var(--soft);border-color:var(--c)}
  .node.next .disc{border-color:#facc15;box-shadow:0 0 0 0 rgba(250,204,21,.7);animation:pulse 1.6s infinite}
  .node.next::before{content:"PLAY";position:absolute;top:-.55rem;z-index:2;background:#facc15;color:#422006;font-size:.6rem;font-weight:700;padding:.05rem .45rem;border-radius:1rem;letter-spacing:.06em}
  .node b{font-size:.74rem;font-weight:500;line-height:1.25}
  .node small{font-size:.66rem;color:var(--muted)}
  .stars{display:flex;gap:.05rem;justify-content:center}
  .stars .ico{width:.95rem;height:.95rem}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,204,21,.7)}70%{box-shadow:0 0 0 .7rem rgba(250,204,21,0)}100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}}
  .side{display:flex;flex-direction:column;gap:1rem}
  .lb{display:flex;flex-direction:column;gap:.35rem}
  .lb div{display:flex;align-items:center;gap:.6rem;font-size:.85rem;padding:.35rem .5rem;border-radius:.5rem}
  .lb div.me{background:var(--brand-soft)}
  .lb .rk{width:1.4rem;font-weight:700;color:var(--muted);text-align:center}
  .lb .nm{flex:1}
  .homegrid{display:grid;grid-template-columns:1fr 17rem;gap:1rem;align-items:start}
  /* practice */
  .arena{position:relative;border-radius:1rem;overflow:hidden;padding:1rem 1rem .6rem;background:linear-gradient(#bae6fd,#e0f2fe 55%,#bbf7d0 56%,#86efac);min-height:13rem}
  .arena .sun{position:absolute;right:1.4rem;top:1rem;width:2.6rem;height:2.6rem;border-radius:50%;background:#fde047;box-shadow:0 0 30px #fde047}
  .pals{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
  .pal{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:44%}
  .pal svg.mon{width:8.5rem;height:8.5rem;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
  .pal .tag{background:rgba(255,255,255,.85);border-radius:.6rem;padding:.3rem .6rem;font-size:.78rem;font-weight:600;width:100%;max-width:12rem}
  /* friendship meter: one star per right answer, full at ${MASTER} */
  .joy{display:flex;justify-content:center;gap:2px;margin-top:.3rem}
  .joy i{width:.85rem;height:.85rem;background:#e2e8f0;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%);transition:background .3s}
  .joy i.on{background:#facc15}
  .vs{font-size:1.6rem;align-self:center;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{50%{transform:scale(1.18)}}
  .cheer{animation:palyay .6s ease-out}
  .ponder{animation:ponder .7s ease-in-out}
  @keyframes palyay{30%{transform:translateY(-22px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.92)}}
  @keyframes ponder{30%{transform:rotate(-6deg)}70%{transform:rotate(5deg)}}
  .zap{position:absolute;font-size:1.4rem;font-weight:800;color:#ca8a04;-webkit-text-stroke:1px #fff;pointer-events:none;animation:rise 1.2s forwards;z-index:3}
  @keyframes rise{to{transform:translateY(-50px);opacity:0}}
  .combo{position:absolute;left:50%;top:.6rem;transform:translateX(-50%);background:#f97316;color:#fff;font-weight:700;font-size:.8rem;border-radius:1rem;padding:.15rem .7rem;z-index:2}
  .qcard{border-radius:1rem}
  .qtools{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
  .linkbtn{color:var(--brand);font-size:.82rem;font-weight:500}
  .linkbtn:hover{text-decoration:underline}
  /* win screen + collection + shop */
  .win{text-align:center;padding:1.6rem 1rem;position:relative;overflow:hidden}
  .win .bigstars{display:flex;justify-content:center;gap:.4rem;margin:.6rem 0}
  .win .bigstars .ico{width:3rem;height:3rem;animation:pop .5s backwards}
  .win .bigstars .ico:nth-child(2){animation-delay:.2s}.win .bigstars .ico:nth-child(3){animation-delay:.4s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .caughtcard{display:inline-flex;align-items:center;gap:.8rem;background:var(--brand-soft);border-radius:1rem;padding:.6rem 1rem;margin-top:.6rem;text-align:left}
  .caughtcard svg{width:4rem;height:4rem}
  .confetti{position:fixed;top:-1rem;width:.6rem;height:.9rem;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.7rem}
  .dexcard{border:1px solid var(--line);border-radius:.8rem;padding:.7rem;text-align:center;background:#fff}
  .dexcard svg{width:5rem;height:5rem}
  .dexcard b{display:block;font-size:.85rem;font-weight:600}
  .dexcard small{display:block;font-size:.7rem;color:var(--muted)}
  .dexcard.locked svg{filter:brightness(0) opacity(.15)}
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.7rem}
  .shopitem{border:1px solid var(--line);border-radius:.8rem;padding:.8rem;text-align:center;background:#fff;display:flex;flex-direction:column;gap:.4rem;align-items:center}
  .shopitem svg{width:5.5rem;height:5.5rem}
  .shopitem.on{border-color:var(--brand);background:var(--brand-soft)}
  .pickrow{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
  .pick{border:2px solid var(--line);border-radius:1rem;padding:1rem;background:#fff;width:10rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .pick:hover{border-color:var(--brand)}
  .pick svg{width:7rem;height:7rem;animation:bob 2.6s ease-in-out infinite}
  .mute{position:absolute;right:.6rem;top:.6rem;z-index:2;background:rgba(255,255,255,.75);border-radius:2rem;padding:.25rem .55rem;font-size:.75rem}
  @media (max-width:860px){ .homegrid{grid-template-columns:1fr} }
  @media (max-width:640px){ .pal svg.mon{width:6rem;height:6rem} .node{width:6rem} .node .disc{width:4rem;height:4rem} .node .disc svg{width:3.3rem;height:3.3rem} .hud .buddy{width:5rem;height:5rem} }
  @media (prefers-reduced-motion: reduce){ .hud .buddy,.pick svg,.node.next .disc{animation:none} }
  svg.mini{width:100%;height:100%}
  svg.locked{filter:brightness(0) opacity(.18)}
  svg.p{width:7rem;height:7rem}
  @media (max-width:640px){ .choices{grid-template-columns:1fr} .sheet ol{columns:1} .qbox{font-size:1.15rem} }
  /* ===== Storyboard (animated) ===== */
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
  .storybox{border-radius:1.2rem;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 40px -20px rgba(15,23,42,.55)}
  .scene{position:relative;height:19rem;overflow:hidden;isolation:isolate;--land:#22c55e;--soft:#dcfce7}
  .scene .world{position:absolute;inset:0;animation:kenburns 18s ease-in-out infinite alternate;transform-origin:50% 70%}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
  .sky{position:absolute;inset:0;background:linear-gradient(#38bdf8,#bae6fd 55%,#e0f2fe 62%);transition:opacity 1s}
  .sky.n{background:linear-gradient(#0b0820,#2e1065 50%,#5b21b6 62%);opacity:0}
  .scene.night .sky.n{opacity:1}
  .stars{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1s}
  .scene.night .stars{opacity:1}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
  .orb{position:absolute;right:2.2rem;top:1.3rem;width:3.4rem;height:3.4rem;border-radius:50%;background:#fde047;box-shadow:0 0 40px 8px rgba(253,224,71,.7);transition:background 1s,box-shadow 1s}
  .orb::before{content:"";position:absolute;inset:-1.2rem;border-radius:50%;background:repeating-conic-gradient(rgba(253,224,71,.55) 0 10deg,transparent 10deg 30deg);animation:spin 24s linear infinite;z-index:-1}
  .scene.night .orb{background:#f5f3ff;box-shadow:0 0 34px 6px rgba(196,181,253,.7)}
  .scene.night .orb::before{opacity:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cloud{position:absolute;height:1.5rem;background:#fff;border-radius:2rem;opacity:.92;animation:drift linear infinite;transition:background 1s}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:55%;height:180%;left:12%;bottom:30%}.cloud::after{width:40%;height:150%;right:12%;bottom:25%}
  .cloud.c1{top:2.2rem;width:7rem;animation-duration:46s;animation-delay:-10s}
  .cloud.c2{top:4.6rem;width:5rem;animation-duration:34s;animation-delay:-25s;opacity:.75}
  .cloud.c3{top:1.2rem;width:4rem;animation-duration:58s;animation-delay:-40s;opacity:.6}
  .scene.night .cloud{background:#4c1d95;opacity:.55}
  @keyframes drift{from{transform:translateX(-10rem)}to{transform:translateX(60rem)}}
  .birds{position:absolute;top:3.2rem;left:0;width:3.4rem;animation:fly 20s linear infinite;transition:opacity 1s}
  .scene.night .birds{opacity:0}
  .birds path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
  @keyframes fly{from{transform:translate(-4rem,0)}50%{transform:translate(28rem,-1rem)}to{transform:translate(62rem,.5rem)}}
  @keyframes flap{to{transform:scaleY(.4)}}
  .sea{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(#0ea5e9,#0369a1);transition:background 1s;overflow:hidden}
  .scene.night .sea{background:linear-gradient(#3b0764,#1e1b4b)}
  .wave{position:absolute;left:0;width:200%;height:2.4rem}
  .wave.w1{top:-.6rem;animation:waves 9s linear infinite;opacity:.55}
  .wave.w2{top:.6rem;animation:waves 14s linear infinite reverse;opacity:.35}
  @keyframes waves{to{transform:translateX(-50%)}}
  .land{position:absolute;bottom:-2.5rem;border-radius:50% 50% 0 0;transition:background 1s}
  .land.l1{left:-3rem;width:24rem;height:7.5rem;background:#fde68a}
  .land.l2{right:-4rem;width:20rem;height:6.5rem;background:var(--land)}
  .scene.night .land.l1{background:#5b21b6}.scene.night .land.l2{background:#7c3aed}
  .palm{position:absolute;bottom:4.4rem;left:2.2rem;width:5.5rem;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  .palm.p2{left:auto;right:3.5rem;bottom:3.6rem;width:4.4rem;animation-delay:-2s}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .gloom{position:absolute;inset:0;background:radial-gradient(circle at 70% 60%,transparent 20%,rgba(46,16,101,.75));opacity:0;transition:opacity .8s;z-index:2;pointer-events:none}
  .scene.gloomy .gloom{opacity:1}
  .chaos{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
  .chaos.on{opacity:1}
  .chaos span{position:absolute;bottom:-2rem;font-weight:800;color:#fde047;text-shadow:0 0 8px rgba(250,204,21,.8);animation:chaos 4s linear infinite}
  @keyframes chaos{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-22rem) rotate(540deg);opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
  .flash.go{animation:flash .7s}
  @keyframes flash{0%,40%{opacity:0}45%{opacity:.9}55%{opacity:.1}62%{opacity:.75}100%{opacity:0}}
  .scene.quake{animation:quake .6s}
  @keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
  .cast{position:absolute;left:0;right:0;bottom:.4rem;display:flex;justify-content:center;align-items:flex-end;gap:1rem;z-index:3}
  .actor{position:relative;display:flex;justify-content:center}
  .actor svg.mon{width:9rem;height:9rem;filter:drop-shadow(0 12px 8px rgba(0,0,0,.28));transform-origin:50% 92%;animation:breathe 2.6s ease-in-out infinite}
  .actor.talker svg.mon{width:11.5rem;height:11.5rem}
  .actor.side svg.mon{width:7.5rem;height:7.5rem}
  .actor.crowd svg.mon{width:7rem;height:7rem}
  .actor.talking svg.mon{animation:talk .28s ease-in-out infinite alternate}
  .actor.dim{filter:saturate(.9)}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}

/* ================= ITEM BUILDERS ================= */
const fracItem = (q, ans, extra) => Object.assign({q, kind:'frac', ans, show: fH(ans)}, extra);

/* ================= STEP-BY-STEP SOLUTIONS =================
   Every item carries sol: [[chalk html, what Lolo says (plain text), side note], ...]. "Show me the steps"
   plays them on the chalkboard, one row at a time. Items with fd (family data) also get the picture

const st = (w, s, n) => [w, s, n || ''];
const withSol = (it, sol, fd) => Object.assign(it, {sol}, fd ? {fd} : {});
const txt = h => String(h).replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, ' $1/$2').replace(/<sup>(.*?)<\/sup>/g, '^$1')
  .replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();

const OPW = {'+': 'plus', '−': 'minus', '×': 'times', '÷': 'divided by'};
const ps = n => n === 1 ? '' : 's';
// fractions: {n, d} as shown (not reduced); mix = shown as a mixed number; fr = already shown as a fraction
const fI = f => f.d === 1 ? m(f.n) : (f.n < 0 ? MINUS : '') + frH(Math.abs(f.n), f.d);
const fP = f => f.n < 0 ? `(${fI(f)})` : fI(f);

const MX = (w, n, d) => ({n: w * d + n, d, mix: true});

const fq = f => f.d === 1 ? (f.n < 0 ? `(${MINUS}${frH(-f.n, 1)})` : frH(f.n, 1)) : fP(f);

function improperStep(x, y, op){

  if (!conv.length) return [];
  const say = conv.map(f => { if (f.d === 1) return `${m(f.n)} is the same as ${m(f.n)}/1`;
    const a = Math.abs(f.n), w = Math.floor(a / f.d); return `${w} ${a % f.d}/${f.d} becomes ${w} times ${f.d} plus ${a % f.d}, over ${f.d}. That's ${a}/${f.d}`; }).join('. And ');

function fracASSteps(x, y, op){
  const out = improperStep(x, y, op), add = op === '+', same = x.d === y.d;

    const how = [[x, a], [y, b]].filter(([f]) => f.d !== L).map(([f, nn]) => `${tI(f)} becomes ${m(nn)}/${L} when we multiply the top and bottom by ${L / f.d}`).join(', and ');

const PI = 3.14, piNote = ' <small style="color:var(--muted)">(π = 3.14, round to the nearest hundredth)</small>';
skill('g-composite', 'Area of composite figures',

   <div class="ex">Rectangle 10 cm × 6 cm with a triangle (base 10 cm, height 5 cm) on top → 60 + 25 = 85 cm²</div>`,
  () => { const u = pick(['cm', 'm']), t = R(0, 4), U = u === 'cm' ? 'square centimeters' : 'square meters', N = x => numStr(r2(x));
    const tot = (a, b, v, sub) => st(`${sub ? 'Grass' : 'Total'} = ${N(a)} ${sub ? MINUS : '+'} ${N(b)} = ${N(v)} ${u}²`, `${sub ? 'Subtract the fountain from the square' : 'Add the parts'}: the area is ${N(v)} ${U}.`, sub ? 'subtract the hole' : 'add the parts');
    const rect = (l, w) => st(`Rectangle: ${l} × ${w} = ${l * w}`, `Rectangle area is length times width: ${l} times ${w} is ${l * w}.`, 'l × w');

    if (t === 0) { const l = R(4, 14), w = R(3, 10), h = R(2, 9), v = r2(l * w + l * h / 2); return withSol(numItem(`A figure is a rectangle ${l} ${u} long and ${w} ${u} wide with a triangle on top. The triangle's base is the ${l} ${u} side and its height is ${h} ${u}. What is the total area?`, v, u + '²', .011, {words:true}),
      [rect(l, w), st(`Triangle: ½ × ${l} × ${h} = ${N(l * h / 2)}`, `Triangle area is one half times base times height: half of ${l} times ${h} is ${N(l * h / 2)}.`, '½ × b × h'), tot(l * w, l * h / 2, v)]); }

    if (t === 2) { const l = R(6, 14), d = 2 * R(1, 4), r = d / 2, v = r2(l * d + PI * r * r); return withSol(numItem(`A running track is a rectangle ${l} ${u} by ${d} ${u} with a semicircle on each ${d} ${u} end. What is the total area?${piNote}`, v, u + '²', .011, {words:true}),

skill('g-sa-prism', 'Surface area: rectangular prism & cube',

skill('g-sa-round', 'Surface area: cylinder, cone & sphere',

    return withSol(mcItem(rt(a * a * b), `${a}${rt(b)}`, [`${b}${rt(a)}`, `${a * a}${rt(b)}`, `${a + 1}${rt(b)}`, `${a}${rt(a * b)}`, `${2 * a}${rt(b)}`]),
      [st(`= ${rt(`${a * a} × ${b}`)}`, `Find the biggest perfect square that divides ${a * a * b}. It's ${a * a}, because ${a} times ${a} is ${a * a}.`, `${a * a} = ${a} × ${a}`), st(`= ${rt(a * a)} × ${rt(b)}`, 'Split it into two square roots.'), st(`= ${a}${rt(b)}`, `The square root of ${a * a} is ${a}, so ${a} comes out in front.`, 'take out the root')]); });

// ---------- Algebraic expressions ----------
skill('a-translate', 'Translating words into expressions',
  `Key words: <b>plus, more than, increased by</b> → +; <b>minus, less than, decreased by</b> → −; <b>times, product, twice</b> → ×; <b>divided by, quotient</b> → ÷. Careful: "4 less than x" is <b>x − 4</b>, and "subtract x from 7" is <b>7 − x</b>. Write the number before the variable: 3 × y → 3y.`,
  () => { const v = pick(['x', 'y', 'n', 'a', 'm', 'p']), n = R(2, 20), t = R(0, 8);
    const T = [
      [`${n} more than ${v}`, `${v} + ${n}`, [`${n} − ${v}`, `${n}${v}`, `${v} − ${n}`], `"More than" means add: ${n} is added to ${v}.`],
      [`${n} less than ${v}`, `${v} − ${n}`, [`${n} − ${v}`, `${v} + ${n}`, `${n}${v}`], `"${n} less than ${v}" means start with ${v} and take away ${n}. Careful, the order flips!`],
      [`the product of ${n} and ${v}`, `${n}${v}`, [`${n} + ${v}`, sup(v, n), `${v} ÷ ${n}`], `"Product" means multiply. ${n} times ${v} is written ${n}${v}.`],
      [`${v} divided by ${n}`, `${v} ÷ ${n}`, [`${n} ÷ ${v}`, `${v} − ${n}`, `${n}${v}`], `"Divided by" means divide, in the same order: ${v} divided by ${n}.`],
      [`twice ${v} decreased by ${n}`, `2${v} − ${n}`, [`2(${v} − ${n})`, `${n} − 2${v}`, `2${v} + ${n}`], `"Twice ${v}" is 2${v}, and "decreased by ${n}" means subtract ${n}.`],
      [`${n} times the sum of ${v} and 3`, `${n}(${v} + 3)`, [`${n}${v} + 3`, `${n} + ${v} + 3`, `3(${v} + ${n})`], `"The sum of ${v} and 3" is (${v} + 3). ${n} times the whole sum needs parentheses.`],
      [`subtract ${v} from ${n}`, `${n} − ${v}`, [`${v} − ${n}`, `${n} + ${v}`, `${MINUS}${n}${v}`], `"Subtract ${v} from ${n}" means start with ${n} and take away ${v}.`],
      [`the square of ${v} increased by ${n}`, `${sup(v, 2)} + ${n}`, [`2${v} + ${n}`, `(${v} + ${n})<sup>2</sup>`, `${sup(v, 2)} − ${n}`], `"The square of ${v}" is ${v}², and "increased by ${n}" means add ${n}.`],
      [`${n} decreased by three times ${v}`, `${n} − 3${v}`, [`3${v} − ${n}`, `3(${n} − ${v})`, `${n} + 3${v}`], `"Three times ${v}" is 3${v}. "${n} decreased by" it means ${n} minus 3${v}.`],
    ][t];
    return withSol(Object.assign(mcItem(`Write as an expression: <b>${T[0]}</b>`, T[1], T[2]), {words:true}), [st(`<span class="small">${T[3]}</span>`, T[3], 'key words'), st(`= ${T[1]}`, `So the expression is ${txt(T[1])}.`)]); });
skill('a-evaluate', 'Evaluating expressions',
  `Replace each variable with its value <b>inside parentheses</b>, then compute using the order of operations.
   <div class="ex">If a = −2 and b = 3: a² − 2b = (−2)² − 2(3) = 4 − 6 = −2</div>`,
  () => { for (let i = 0; i < 30; i++) {
      const a = nz(-6, 6), b = nz(-6, 6), c = nz(-6, 6), t = R(0, 8);
      const T = [
        [`a − b`, F(a - b), `${sn(a)} − ${sn(b)}`],
        [`2(b − c)`, F(2 * (b - c)), `2(${sn(b)} − ${sn(c)})`, `2(${m(b - c)})`, `Parentheses first: ${m(b)} minus ${m(c)} is ${m(b - c)}.`],
        [`${sup('a', 2)} + b`, F(a * a + b), `${sn(a)}<sup>2</sup> + ${sn(b)}`, `${a * a} + ${sn(b)}`, `Exponent first: ${m(a)} squared is ${a * a}.`],
        [`ab − c`, F(a * b - c), `${sn(a)} × ${sn(b)} − ${sn(c)}`, `${m(a * b)} − ${sn(c)}`, `Multiply first: ${m(a)} times ${m(b)} is ${m(a * b)}.`],
        [`${sup('a', 2)} − 2b`, F(a * a - 2 * b), `${sn(a)}<sup>2</sup> − 2 × ${sn(b)}`, `${a * a} − ${sn(2 * b)}`, `Exponent and multiplication first: ${m(a)} squared is ${a * a}, and 2 times ${m(b)} is ${m(2 * b)}.`],
        [`3a + 2b − c`, F(3 * a + 2 * b - c), `3 × ${sn(a)} + 2 × ${sn(b)} − ${sn(c)}`, `${m(3 * a)} + ${sn(2 * b)} − ${sn(c)}`, `Multiply first: 3 times ${m(a)} is ${m(3 * a)}, and 2 times ${m(b)} is ${m(2 * b)}.`],
        [`(a + b)<sup>2</sup>`, F((a + b) ** 2), `(${sn(a)} + ${sn(b)})<sup>2</sup>`, `${sn(a + b)}<sup>2</sup>`, `Parentheses first: ${m(a)} plus ${m(b)} is ${m(a + b)}.`],
        [`${sup('a', 3)} − bc`, F(a ** 3 - b * c), `${sn(a)}<sup>3</sup> − ${sn(b)} × ${sn(c)}`, `${m(a ** 3)} − ${sn(b * c)}`, `${m(a)} cubed is ${m(a ** 3)}, and ${m(b)} times ${m(c)} is ${m(b * c)}.`],
        [`<span class="fr"><span>a − b</span><span>c</span></span>`, F(a - b, c), frH(`${sn(a)} − ${sn(b)}`, sn(c)), frH(m(a - b), sn(c)), `Work out the top first: ${m(a)} minus ${m(b)} is ${m(a - b)}.`],
      ][t];
      const sol = [st(`= ${T[2]}`, `Replace a with ${m(a)}, b with ${m(b)} and c with ${m(c)}. Put negative numbers in parentheses.`, 'substitute')];
      if (T[3]) sol.push(st(`= ${T[3]}`, T[4], 'order of operations'));
      sol.push(st(`= ${fH(T[1])}`, `Finish the arithmetic. The answer is ${fT(T[1])}.`));
      if (T[1].d <= 12) return withSol(Object.assign(fracItem(`If a = ${m(a)}, b = ${m(b)} and c = ${m(c)}, find &nbsp;${T[0]}`, T[1]), {words:true}), sol);
    } return SK['i-add'].gen(); });

// ---------- Polynomials ----------
const flipOne = p => { const q = p.slice(), idx = q.map((c, i) => c ? i : -1).filter(i => i >= 0); const i = pick(idx); q[i] = -q[i]; return q; };
const nudge = p => { const q = p.slice(), idx = q.map((c, i) => c ? i : -1).filter(i => i >= 0); const i = pick(idx); q[i] += pick([-1, 1]); return pclean(q); };
skill('p-add', 'Adding polynomials',
  `Combine <b>like terms</b> only: add the numbers in front of terms with the same variable and exponent. Terms with no partner are copied.
   <div class="ex">(7x² + 2) + (−x² + 3x − 6) = 6x² + 3x − 4</div>`,
  () => { const A = randPoly(R(1, 3)), B = randPoly(R(1, 3)), S = padd(A, B);
    return withSol(mcItem(`(${polyH(A)}) + (${polyH(B)})`, polyH(S), [polyH(padd(A, pscale(B, -1))), polyH(flipOne(S)), polyH(nudge(S)), polyH(flipOne(flipOne(S)))]), likeTermSteps(A, B).concat([polyEnd(S)])); });
skill('p-sub', 'Subtracting polynomials',
  `Change the sign of <b>every</b> term in the polynomial being subtracted, then add like terms.
   <div class="ex">(2x − 19) − (−x + 13) = 2x − 19 + x − 13 = 3x − 32</div>`,
  () => { const A = randPoly(R(1, 3)), B = randPoly(R(1, 3)), D = padd(A, pscale(B, -1));
    const onlyFirst = B.slice(); onlyFirst[onlyFirst.length - 1] *= -1; // forgot to change all signs
    return withSol(mcItem(`(${polyH(A)}) − (${polyH(B)})`, polyH(D), [polyH(padd(A, B)), polyH(padd(A, onlyFirst)), polyH(flipOne(D)), polyH(nudge(D))]),
      [st(`= (${polyH(A)}) + (${polyH(pscale(B, -1))})`, 'Subtracting a polynomial means changing the sign of every term inside it. Then we add.', 'change every sign')].concat(likeTermSteps(A, pscale(B, -1)), [polyEnd(D)])); });
skill('p-mul-mono', 'Multiplying by a monomial',
  `Use the <b>distributive property</b>: multiply the outside term by every term inside. When multiplying powers of x, add the exponents.
   <div class="ex">−2(4x² − 3x + 1) = −8x² + 6x − 2 &nbsp;·&nbsp; 3x(2x − 5) = 6x² − 15x</div>`,
  () => { const k = nz(-9, 9), e = R(0, 2), P = randPoly(R(1, 2)), Mn = Array(e).fill(0).concat([k]), Pr = pmul(Mn, P);
    const firstOnly = pshift(P.map((c, i) => i === P.length - 1 ? c * k : c), e);
    const rows = []; for (let i = P.length - 1; i >= 0; i--) if (P[i]) rows.push(st(`${mono(k, 'x', e)} × ${pm1(P[i], i)} = ${mono(k * P[i], 'x', e + i)}`, `${rows.length ? '' : 'Multiply the outside term by every term inside. '}${m(k)} times ${m(P[i])} is ${m(k * P[i])}${e && i ? `, and add the exponents: ${e} plus ${i} is ${e + i}` : ''}.`, rows.length ? '' : 'multiply each term'));
    return withSol(mcItem(`${mono(k, 'x', e)}(${polyH(P)})`, polyH(Pr), [polyH(firstOnly), polyH(flipOne(Pr)), polyH(pscale(P, k)), polyH(nudge(Pr))]), rows.concat([st(`= ${polyH(Pr)}`, 'Put all the terms together.', 'final answer')])); });
skill('p-foil', 'Multiplying binomials (FOIL)',
  `Multiply <b>F</b>irst, <b>O</b>uter, <b>I</b>nner, <b>L</b>ast terms, then combine the middle terms.
   <div class="ex">(2x + 3)(x − 5) = 2x² − 10x + 3x − 15 = 2x² − 7x − 15</div>`,
  () => { const a = R(1, 5), b = nz(-9, 9), c = R(1, 5), d = nz(-9, 9), P = pmul([b, a], [d, c]);
    const ax = mono(a, 'x', 1), cx = mono(c, 'x', 1), mid = a * d + b * c;
    return withSol(mcItem(`${bin(a, b)}${bin(c, d)}`, polyH(P), [polyH(pclean([b * d, 0, a * c])), polyH([b * d, a * d - b * c, a * c]), polyH([-b * d, a * d + b * c, a * c]), polyH([b * d, a * d + b * c + 1, a * c])]),
      [st(`F: ${ax} × ${cx} = ${mono(a * c, 'x', 2)}`, `First terms: ${txt(ax)} times ${txt(cx)} is ${txt(mono(a * c, 'x', 2))}.`, 'First'), st(`O: ${ax} × ${sn(d)} = ${mono(a * d, 'x', 1)}`, `Outer terms: ${txt(ax)} times ${m(d)} is ${txt(mono(a * d, 'x', 1))}.`, 'Outer'),
       st(`I: ${sn(b)} × ${cx} = ${mono(b * c, 'x', 1)}`, `Inner terms: ${m(b)} times ${txt(cx)} is ${txt(mono(b * c, 'x', 1))}.`, 'Inner'), st(`L: ${sn(b)} × ${sn(d)} = ${m(b * d)}`, `Last terms: ${m(b)} times ${m(d)} is ${m(b * d)}.`, 'Last'),
       st(`${mono(a * d, 'x', 1)} ${b * c < 0 ? MINUS : '+'} ${mono(Math.abs(b * c), 'x', 1)} = ${mid ? mono(mid, 'x', 1) : '0'}`, `Combine the two middle terms: ${m(a * d)} ${b * c < 0 ? 'minus' : 'plus'} ${Math.abs(b * c)} is ${m(mid)}.`, 'O + I'), st(`= ${polyH(P)}`, 'Write it all together.', 'final answer')]); });
skill('p-div-mono', 'Dividing by a monomial',
  `Divide <b>each term</b> by the monomial: divide the numbers and subtract the exponents.
   <div class="ex">(18x⁴ − 10x² + 6x⁷) ÷ 2x² = 9x² − 5 + 3x⁵</div>`,
  () => { const k = nz(-6, 6) || 2, j = R(1, 3), Q = randPoly(R(1, 3), 8), Dd = pmul(pshift([k], j), Q);
    const rows = []; for (let i = Dd.length - 1; i >= 0; i--) if (Dd[i]) rows.push(st(`${pm1(Dd[i], i)} ÷ ${mono(k, 'x', j)} = ${mono(Dd[i] / k, 'x', i - j)}`, `${rows.length ? '' : 'Divide each term by the monomial. '}${m(Dd[i])} divided by ${m(k)} is ${m(Dd[i] / k)}, and ${i} minus ${j} is ${i - j}.`, rows.length ? '' : 'divide each term'));
    return withSol(mcItem(`(${polyH(Dd)}) ÷ ${mono(k, 'x', j)}`, polyH(Q), [polyH(pshift(Q, 1)), polyH(flipOne(Q)), polyH(nudge(Q)), polyH(pscale(Q, -1))]), rows.concat([st(`= ${polyH(Q)}`, 'Put all the answers together.', 'final answer')])); });

// ---------- Equations & inequalities ----------
skill('eq-linear', 'Solving linear equations',
  `Do the same thing to <b>both sides</b> to get x alone: remove parentheses, collect the x terms on one side and the numbers on the other, then divide.
   <div class="ex">5x − 2 = 13 → 5x = 15 → x = 3 &nbsp;·&nbsp; 2(x − 4) = 6 → 2x − 8 = 6 → 2x = 14 → x = 7</div>`,
  () => { const x = nz(-10, 10), t = R(0, 3), a = nz(-9, 9), b = nz(-15, 15);
    if (t === 0) return withSol(fracItem(`Solve for x: &nbsp;${polyH([b, a])} = ${m(a * x + b)}`, F(x)), linSteps(a, b, a * x + b, x));
    if (t === 1) return withSol(fracItem(`Solve for x: &nbsp;${m(a)}(x ${b < 0 ? MINUS : '+'} ${Math.abs(b)}) = ${m(a * (x + b))}`, F(x)),
      [st(`${polyH([a * b, a])} = ${m(a * (x + b))}`, `Remove the parentheses: multiply ${m(a)} by x and by ${m(b)}.`, 'distribute')].concat(linSteps(a, a * b, a * (x + b), x)));
    if (t === 2) { let c = nz(-9, 9); while (c === a) c = nz(-9, 9); const d = a * x + b - c * x;
      return withSol(fracItem(`Solve for x: &nbsp;${polyH([b, a])} = ${polyH([d, c])}`, F(x)),
        [st(`${polyH([b, a - c])} = ${m(d)}`, `Get the x terms on one side: ${c > 0 ? 'subtract' : 'add'} ${txt(mono(Math.abs(c), 'x', 1))} ${c > 0 ? 'from' : 'to'} both sides. ${m(a)} minus ${m(c)} is ${m(a - c)}.`, `${c > 0 ? MINUS : '+'} ${mono(Math.abs(c), 'x', 1)} both sides`)].concat(linSteps(a - c, b, d, x))); }
    const k = R(2, 6), xx = k * R(-5, 5), c = xx / k + b;
    return withSol(fracItem(`Solve for x: &nbsp;${frH('x', k)} + ${sn(b)} = ${m(c)}`, F(xx)),
      [st(`${frH('x', k)} = ${m(c - b)}`, b > 0 ? `Subtract ${b} from both sides.` : `Add ${-b} to both sides.`, b > 0 ? `− ${b} both sides` : `+ ${-b} both sides`), st(`x = ${m(c - b)} × ${k}`, `Multiply both sides by ${k} to undo the division.`, `× ${k} both sides`), st(`x = ${m(xx)}`, `${m(c - b)} times ${k} is ${m(xx)}. So x = ${m(xx)}.`)]); });

const INEQ = {'<': (a, b) => a < b, '>': (a, b) => a > b, '≤': (a, b) => a <= b, '≥': (a, b) => a >= b};
const FLIP = {'<': '>', '>': '<', '≤': '≥', '≥': '≤'};
skill('ineq-check', 'Is it a solution of the inequality?',
  `Put the given number in place of the variable. If the statement is <b>true</b>, the number is a solution.
   <div class="ex">x + 3 < 8 with x = 4 → 7 < 8 is true → 4 is a solution</div>`,
  () => { const a = nz(-9, 9), b = R(-15, 15), x = R(-10, 15), s = pick(Object.keys(INEQ)), c = a * x + b + R(-6, 6);
    const val = a * x + b, ok = INEQ[s](val, c);
    return withSol(mcItem(`${polyH([b, a])} ${s} ${m(c)} &nbsp; when x = ${m(x)}`, ok ? 'Solution' : 'Not a solution', [ok ? 'Not a solution' : 'Solution'], true),
      [st(`${m(a)}(${m(x)})${b ? ` ${b < 0 ? MINUS : '+'} ${Math.abs(b)}` : ''} = ${m(val)}`, `Put ${m(x)} in place of x and work out the left side: it's ${m(val)}.`, 'substitute'),
       st(`${m(val)} ${s} ${m(c)} ?`, `Now check: is ${m(val)} ${INW[s]} ${m(c)}? ${ok ? 'Yes, that is true.' : 'No, that is false.'}`, ok ? 'true ✓' : 'false ✗'),
       st(`= ${ok ? 'Solution' : 'Not a solution'}`, ok ? `The statement is true, so ${m(x)} is a solution.` : `The statement is false, so ${m(x)} is not a solution.`)]); });
skill('ineq-solve', 'Solving linear inequalities',
  `Solve like an equation, but <b>flip the inequality sign</b> whenever you multiply or divide both sides by a negative number.
   <div class="ex">−9x < 81 → x > −9 (divided by −9, so &lt; became &gt;)</div>`,
  () => { const a = nz(-9, 9), k = R(-9, 9), b = R(-12, 12), s = pick(Object.keys(INEQ)), c = a * k + b, sol = a < 0 ? FLIP[s] : s;
    const alt = {'<': '≤', '>': '≥', '≤': '<', '≥': '>'};
    const rows = [];
    if (b) rows.push(st(`${mono(a, 'x', 1)} ${s} ${m(c - b)}`, `${b > 0 ? `Subtract ${b} from` : `Add ${-b} to`} both sides. Adding or subtracting never flips the sign.`, b > 0 ? `− ${b} both sides` : `+ ${-b} both sides`));
    if (a !== 1) rows.push(st(`x ${sol} ${m(k)}`, `Divide both sides by ${m(a)}. ${a < 0 ? `We divided by a negative number, so flip the sign: ${INW[s]} becomes ${INW[sol]}.` : `${a} is positive, so the sign stays the same.`}`, a < 0 ? 'negative → flip!' : 'sign stays'));
    else if (!b) rows.push(st(`x ${sol} ${m(k)}`, `x is already alone: x is ${INW[sol]} ${m(k)}.`));
    return withSol(mcItem(`${polyH([b, a])} ${s} ${m(c)}`, `x ${sol} ${m(k)}`, [`x ${FLIP[sol]} ${m(k)}`, `x ${sol} ${m(-k || 1)}`, `x ${alt[sol]} ${m(k)}`, `x ${FLIP[sol]} ${m(-k || 1)}`]), rows); });

// ---------- Factoring ----------
const facPair = (p, q) => { const [x, y] = p >= q ? [p, q] : [q, p]; return `${bin(1, x)}${bin(1, y)}`; };
skill('fac-gcf', 'Factoring out the greatest common factor',
  `Find the biggest number and the highest power of the variable that divide <b>every</b> term, write it outside, and write what is left inside the parentheses.
   <div class="ex">6x² + 9x = 3x(2x + 3)</div>`,
  () => { const g = R(2, 9), e = R(0, 2), inner = [nz(-9, 9), R(1, 9)]; if (gcd(inner[0], inner[1]) !== 1) inner[0] = inner[0] > 0 ? 1 : -1;
    const P = pmul(pshift([g], e), inner), G = mono(g, 'x', e), inH = polyH(inner);
    const fsol = [st(`GCF = ${G}`, `Look for what divides both terms. The biggest number is ${g}${e ? `, and both terms have at least ${e === 1 ? 'one x' : `x to the ${e}`}` : ''}. So the GCF is ${txt(G)}.`, 'greatest common factor'),
      st(`${pm1(g * inner[1], e + 1)} ÷ ${G} = ${mono(inner[1], 'x', 1)}`, 'Divide each term by the GCF.', 'divide each term'), st(`${pm1(g * inner[0], e)} ÷ ${G} = ${m(inner[0])}`, `And the other term gives ${m(inner[0])}.`),
      st(`= ${G}(${inH})`, 'Write the GCF outside, and what is left inside the parentheses.')];
    return withSol(mcItem(polyH(P), `${G}(${inH})`, [`${mono(g, 'x', Math.max(0, e - 1))}(${polyH(pshift(inner, e ? 1 : 0))})`, `${G}(${polyH(flipOne(inner))})`, `${mono(g * 2, 'x', e)}(${polyH(inner)})`, `${G}(${polyH(nudge(inner))})`]), fsol); });
skill('fac-tri', 'Factoring x² + bx + c',

  () => { let p = nz(-9, 9), q = nz(-9, 9); if (p === -q) q = q + 1 || 2; const P = [p * q, p + q, 1];

      [st(`? × ? = ${m(p * q)} &nbsp; ? + ? = ${m(p + q)}`, `We need two numbers that multiply to ${m(p * q)} and add to ${m(p + q)}.`, 'multiply to c, add to b'),
       st(`${m(p)} × ${sn(q)} = ${m(p * q)} ✓ &nbsp; ${m(p)} + ${sn(q)} = ${m(p + q)} ✓`, `Try ${m(p)} and ${m(q)}: they multiply to ${m(p * q)} and add to ${m(p + q)}. Both work!`, 'found them'), st(`= ${facPair(p, q)}`, 'Put each number in a binomial with x.')]); });
skill('fac-sq', 'Special products: squares',

function parseAns(raw){
  const s = String(raw).trim().replace(/[−–—]/g, '-').replace(/,/g, '').replace(/\s+/g, ' ');
  let x;
  if ((x = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) { const w = +x[2], n = +x[3], d = +x[4]; if (!d) return null;
    return {f: F((x[1] ? -1 : 1) * (w * d + n), d), reduced: n < d && gcd(n, d) === 1}; }
  if ((x = s.match(/^(-?\d+)\/(-?\d+)$/))) { const n = +x[1], d = +x[2]; if (!d) return null; return {f: F(n, d), reduced: gcd(n, d) === 1 && d > 0}; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) { const f = decF(s.startsWith('-.') ? '-0' + s.slice(1) : s.startsWith('.') ? '0' + s : s); return {f, reduced:true, dec: s.includes('.')}; }
  return null;
}
function checkItem(it, raw){
  if (it.kind === 'mc') return {ok: raw === it.ans};
  const p = parseAns(raw);
  if (!p) return {invalid:true, msg: it.kind === 'frac' ? 'Type a whole number, a fraction like 3/4, or a mixed number like 2 1/3.' : 'Type a number, for example 12.5 or −7.'};
  if (it.kind === 'num') return {ok: Math.abs(p.f.n / p.f.d - it.ans) <= it.tol + 1e-9};
  if (!feq(p.f, it.ans)) return {ok:false};
  if (p.dec && it.ans.d !== 1) return {ok:false, note:'Right value, but write it as a fraction or mixed number.'};
  if (!p.reduced) return {ok:false, note:'Right value, but it is not in lowest terms yet.'};
  return {ok:true};
}

  const stripes = (id, c1, c2) => `<pattern id="${id}" width="44" height="10" patternUnits="userSpaceOnUse"><rect width="44" height="10" fill="${c1}"/><rect width="22" height="10" fill="${c2}"/></pattern>`;
  return `<svg class="hall" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
    <defs>${stripes('wl', '#22c39a', '#33d6ad')}${stripes('wr', '#20b994', '#30cfa7')}
      <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c026d3"/><stop offset="1" stop-color="#a21caf"/></linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f9fae"/><stop offset="1" stop-color="#0b7f92"/></linearGradient>
      <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3730a3"/><stop offset="1" stop-color="#1e1b6b"/></linearGradient></defs>
    <rect x="420" y="240" width="360" height="370" fill="url(#room)"/>

    <polygon points="0,0 1200,0 780,240 420,240" fill="url(#ceil)"/>
    <polygon points="0,0 420,240 420,610 0,800" fill="url(#wl)"/>
    <polygon points="1200,0 780,240 780,610 1200,800" fill="url(#wr)"/>
    <polygon points="0,800 420,610 780,610 1200,800" fill="url(#floor)"/>
    <polygon points="0,742 420,584 420,610 0,800" fill="#2563eb"/><polygon points="1200,742 780,584 780,610 1200,800" fill="#1d4ed8"/>
    <polygon points="0,0 36,0 420,236 420,250" fill="#1d4ed8" opacity=".6"/><polygon points="1200,0 1164,0 780,236 780,250" fill="#1d4ed8" opacity=".6"/>
    <path d="M600 0v58" stroke="#155e75" stroke-width="6"/><ellipse cx="600" cy="62" rx="90" ry="30" fill="#fde68a"/><ellipse cx="600" cy="56" rx="90" ry="22" fill="#fcd34d"/><circle cx="600" cy="92" r="10" fill="#b45309"/>
  </svg>`;
}
function welcomeView(el){
  if (!WELCOME) WELCOME = 'door';
  const u = P.me.u, buddy = pref(u).buddy;
  const star = monsterSVG(buddy || 'mon-welcome', 'happy', buddy ? pref(u).wear || [] : [], 'wbuddy');
  const frames = `<div class="wf wf-big">${monsterSVG('mon-i-add', 'happy', ['party'], 'wfm')}</div><div class="wf wf-oval">${monsterSVG('mon-f-mul', 'idle', [], 'wfm')}</div>
    <div class="wf wf-b1">${monsterSVG('mon-e-eval', 'happy', [], 'wfm')}</div><div class="wf wf-b2">${monsterSVG('mon-p-add', 'idle', [], 'wfm')}</div>
    <div class="wwin"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>`;
  let panel;
  if (WELCOME === 'door') panel = `<div class="wbanner"><svg viewBox="0 0 700 230" aria-hidden="true">
        <path d="M40 70 0 120l40 50h80V70z" fill="#f59e0b"/><path d="M660 70l40 50-40 50h-80V70z" fill="#f59e0b"/><path d="M120 170l-40-20h40zM580 170l40-20h-40z" fill="#b45309"/>
        <path d="M90 40q260-40 520 0v140q-260-40-520 0z" fill="#fbbf24" stroke="#f59e0b" stroke-width="6"/></svg>
        <h1><span>Welcome to</span>Aral Math</h1></div>
      <div class="wgo">${GLOVE}<button class="wbtn" onclick="welcomeGo('who')">Let’s Go!</button></div>`;
  else if (WELCOME === 'who') panel = `<div class="wpanel"><div class="wtab">Who is here?</div>
        <button class="wbtn" onclick="welcomeGo('kid')">Student</button><button class="wbtn" onclick="WELCOME_AFTER='parent';welcomeGo(pref(P.me.u).parentEmail ? 'parent' : 'pemail')">Parent</button><button class="wbtn" onclick="welcomeGo('both')">Both of us</button></div>`;
  else if (WELCOME === 'kid') panel = kidChoice();
  else if (WELCOME === 'pemail') panel = parentEmailPanel();
  else if (WELCOME === 'grade') panel = gradePanel();
  else if (WELCOME === 'maker') panel = makerView();
  else panel = parentReport(u, WELCOME === 'both');
  if (WELCOME === 'tryit') { el.innerHTML = `<div class="welcome w-tryit">${tryView()}</div>`; return; }
  if (WELCOME === 'maproom') { el.innerHTML = `<div class="welcome w-maproom">${mapRoomView()}</div>`; return; }
  el.innerHTML = `<div class="welcome w-${WELCOME} plain"><div class="wfront">${panel}</div></div>`; // no hallway background
  if (WELCOME === 'door' && ttsOn()) speak('Welcome to Aral Math!', 'nar');
}
// a short, friendly report for a parent (or a parent and child together)
function parentReport(u, both){
  const b = bandOf(u), all = bandSkills(b), first = esc(P.me.name.split(' ')[0]), mine = myAttempts(u), week = mine.filter(a => a.at > Date.now() - 7 * 864e5);
  const got = all.filter(id => caught(u, id)).length, stars = all.reduce((s, id) => s + starsOf(bestOf(u, id)), 0);
  const help = all.filter(id => status(bestOf(u, id))[0] === 'Needs help').slice(0, 3), nx = nextSkill(u, b), last = mine.length ? Math.max(...mine.map(a => a.at)) : null;
  const tip = help.length ? `Sit together for one practice round on <b>${SK[help[0]].title}</b>. Watch the lesson first, then let ${first} try. Use “Show me the steps” after a miss.`
    : nx ? `Ask ${first} to explain the last lesson to you. Teaching it back is one of the best ways to remember it.` : `${first} made friends with every monster in ${BANDS[b].label}. Try a rematch for 3 stars!`;
  return `<div class="wpanel wide"><div class="wtab">${both ? 'Let’s look together!' : 'Hello, parent!'}</div>
    <p class="wsub">Here’s how <b>${first}</b> is doing in ${BANDS[b].label} math.</p>
    <div class="wstats"><div><b>${levelOf(xpOf(u))}</b><span>Level</span></div><div><b>${got}<small>/${all.length}</small></b><span>Monster friends</span></div>
      <div><b>${stars}</b><span>Stars</span></div><div><b>${week.length}</b><span>Practice rounds this week</span></div></div>
    <div class="wrows"><div><span>Last played</span><b>${last ? ago(last) : 'Not yet'}</b></div>
      <div><span>Learning now</span><b>${nx ? SK[nx].title : 'All lessons done 🎉'}</b></div>
      <div><span>Needs a little help</span><b>${help.length ? help.map(id => SK[id].title).join(', ') : 'Nothing right now 👍'}</b></div></div>
    <p class="wtip">💡 ${tip}</p>
    <div class="wacts">${both ? `<button class="wbtn" onclick="nextOnboard()">▶ Let’s play together!</button>` : `<button class="wbtn" onclick="welcomeDone()">Done</button>`}
      <button class="wbtn ghost" onclick="try{sessionStorage.setItem('aralmath-welcome','1')}catch(e){}WELCOME=null;P.tab('progress')">See every lesson</button></div></div>`;
}

/* ================= MY PROGRESS (learner) ================= */
function progress(el){
  const u = P.me.u, b = bandOf(u), all = bandSkills(b), bests = all.map(id => bestOf(u, id));
  const cnt = k => bests.filter(x => status(x)[0] === k).length, mine = myAttempts(u);
  el.innerHTML = `<div class="stack">
    <div class="card"><div class="ptop"><div class="grow"><h2>My progress</h2><p class="hint" style="margin:0">${BANDS[b].label} · ${all.length} lessons · Level ${levelOf(xpOf(u))}</p></div>${bandSwitch(b, 'setBand')}</div></div>
    <div class="stats"><div class="stat"><b>${cnt('Mastered')}</b><span>Monster friends (mastered)</span></div><div class="stat"><b>${cnt('Practicing')}</b><span>Practicing</span></div>
      <div class="stat"><b>${cnt('Needs help')}</b><span>Needs help</span></div><div class="stat"><b>${mine.length}</b><span>Practice rounds</span></div></div>
    ${BANDS[b].units.map(([name, list]) => `<div class="card"><h3 style="font-size:.95rem;font-weight:600;margin-bottom:.4rem">${name}</h3><div class="tablewrap"><table class="t">
      <tr><th>Lesson</th><th>Stars</th><th>Status</th><th>Rounds</th><th>Last played</th><th></th></tr>
      ${list.map(([id]) => { const a = myAttempts(u, id); return `<tr><td>${SK[id].title}</td><td>${stars3(starsOf(bestOf(u, id)))}</td><td>${sPill(bestOf(u, id))}</td><td>${a.length}</td><td>${a.length ? ago(Math.max(...a.map(x => x.at))) : '—'}</td>
        <td style="text-align:right"><button class="btn ghost sm" onclick="P.tab('learn');startPractice('${id}')">Play</button></td></tr>`; }).join('')}
    </table></div></div>`).join('')}
  </div>`;
}

/* ================= CLASS PROGRESS (teacher) ================= */
let classBand = null;
function setClassBand(b){ classBand = b; P.refresh(); }
function classView(el){
  const b = classBand || '78', all = bandSkills(b);
  const kids = P.usersWith('student').filter(s => bandOf(s.u) === b);
  const rows = kids.map(s => { const bests = all.map(id => bestOf(s.u, id)), at = myAttempts(s.u);
    return {s, mastered: bests.filter(x => x >= MASTER).length, help: bests.filter(x => x != null && x < 5).length, sets: at.length, last: at.length ? Math.max(...at.map(a => a.at)) : 0, stars: all.reduce((n, id) => n + starsOf(bestOf(s.u, id)), 0)}; })
    .sort((x, y) => x.mastered - y.mastered);
  const week = P.db.attempts.filter(a => kids.some(k => k.u === a.u) && a.at > Date.now() - 7 * D).length;
  const struggle = all.map(id => ({id, n: kids.filter(k => { const x = bestOf(k.u, id); return x != null && x < 5; }).length})).filter(x => x.n).sort((x, y) => y.n - x.n).slice(0, 5);
  const avg = rows.length ? Math.round(100 * rows.reduce((s, r) => s + r.mastered, 0) / (rows.length * all.length)) : 0;
  el.innerHTML = `<div class="stack">
    <div class="card"><div class="ptop"><div class="grow"><h2>Class progress</h2><p class="hint" style="margin:0">Learners are grouped by the grade in their profile. Mastered = ${MASTER}+ out of ${ITEMS} (monster caught).</p></div>${bandSwitch(b, 'setClassBand')}</div></div>
    <div class="stats"><div class="stat"><b>${kids.length}</b><span>Learners</span></div><div class="stat"><b>${avg}%</b><span>Average lessons mastered</span></div>
      <div class="stat"><b>${week}</b><span>Practice rounds this week</span></div><div class="stat"><b>${rows.filter(r => r.help).length}</b><span>Learners needing help</span></div></div>
    <div class="twocol">
      <div class="card"><h2>Learners</h2><div class="tablewrap"><table class="t"><tr><th>Name</th><th>Mastered</th><th>Stars</th><th>Rounds</th><th>Last active</th><th></th></tr>
        ${rows.map(r => `<tr><td><div style="display:flex;align-items:center;gap:.5rem"><span style="width:2.2rem;height:2.2rem;flex:none">${monsterSVG(buddyOf(r.s.u), 'idle', pref(r.s.u).wear || [], 'mini')}</span><span><b style="font-weight:500">${esc(r.s.name)}</b><br><small style="color:var(--muted)">${esc(r.s.pos)}</small></span></div></td>
          <td><div style="display:flex;align-items:center;gap:.5rem"><div class="bar" style="flex:1"><i style="width:${Math.round(100 * r.mastered / all.length)}%"></i></div><small>${r.mastered}/${all.length}</small></div>${r.help ? `<span class="pill p-red" style="margin-top:.3rem">${r.help} need help</span>` : ''}</td>
          <td>${STAR()} ${r.stars}</td><td>${r.sets}</td><td>${r.last ? ago(r.last) : '—'}</td><td style="text-align:right"><button class="btn ghost sm" onclick="viewLearner('${r.s.u}')">View</button></td></tr>`).join('') || `<tr><td colspan="6"><div class="empty">No learners in ${BANDS[b].label} yet.</div></td></tr>`}
      </table></div></div>
      <div class="card"><h2>Where learners struggle</h2><p class="hint">Lessons where learners scored below 5 out of ${ITEMS}.</p>
        ${struggle.length ? struggle.map(x => `<div style="display:flex;justify-content:space-between;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.88rem">
          <span>${SK[x.id].title}<br><small style="color:var(--muted)">Worksheet ${wsOf(b, x.id)}</small></span><span class="pill p-red" style="align-self:center">${x.n} learner${x.n > 1 ? 's' : ''}</span></div>`).join('') : '<div class="empty">No problem areas yet.</div>'}
        <div class="actions" style="margin-top:1rem"><button class="btn ghost sm" onclick="P.tab('print')">Print a practice sheet</button></div></div>
    </div></div>`;
}
function viewLearner(u){
  const s = P.userOf(u), b = bandOf(u);
  P.open(`<div class="head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><div><h2>${esc(s.name)}</h2><small style="color:var(--muted)">${esc(s.pos)} · ${BANDS[b].label} · Level ${levelOf(xpOf(u))} · ${COIN} ${coinsOf(u)}</small></div><button class="btn ghost sm" onclick="P.close()">Close</button></div>
    ${BANDS[b].units.map(([name, list]) => `<h3 style="font-size:.85rem;font-weight:600;margin:1rem 0 .4rem">${name}</h3><table class="t">
      ${list.map(([id]) => { const a = myAttempts(u, id); return `<tr><td>${SK[id].title}</td><td>${stars3(starsOf(bestOf(u, id)))}</td><td>${sPill(bestOf(u, id))}</td><td style="color:var(--muted);font-size:.78rem">${a.length ? a.length + ' round' + (a.length > 1 ? 's' : '') : ''}</td></tr>`; }).join('')}</table>`).join('')}`);
}

/* ================= PRINT WORKSHEETS (teacher) ================= */
let sheet = null;
function printView(el){
  const b = (sheet && sheet.band) || classBand || '78';
  el.innerHTML = `<div class="stack"><div class="card"><h2>Print a practice sheet</h2>
    <p class="hint">Make a fresh worksheet for learners without devices. Every sheet has new items and an answer key on the last page.</p>
    <form class="form" id="pf">
      <div><label>Grade level</label><select name="band" onchange="sheet={band:this.value};P.refresh()">${Object.entries(BANDS).map(([k, v]) => `<option value="${k}" ${k === b ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
      <div><label>Lesson</label><select name="skill">${BANDS[b].units.map(([name, list]) => `<optgroup label="${name}">${list.map(([id, ws]) => `<option value="${id}" ${sheet && sheet.id === id ? 'selected' : ''}>${SK[id].title} (WS ${ws})</option>`).join('')}</optgroup>`).join('')}</select></div>
      <div><label>Number of items</label><select name="n">${[10, 15, 20].map(n => `<option ${sheet && sheet.items && sheet.items.length === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div style="align-self:end"><button class="btn" type="submit">Make worksheet</button></div>
    </form></div>
    ${sheet && sheet.items ? `<div class="card"><div class="actions" style="justify-content:space-between;margin-bottom:1rem"><h2 style="margin:0">Preview</h2><div class="actions"><button class="btn ghost" onclick="makeSheet()">New items</button><button class="btn" onclick="printSheet()">Print</button></div></div>${sheetHTML()}</div>` : ''}
  </div>`;
  $('pf').onsubmit = e => { e.preventDefault(); const f = e.target; sheet = {band:f.band.value, id:f.skill.value, n:+f.n.value}; makeSheet(); };
}
function makeSheet(){ sheet.items = Array.from({length: sheet.n}, () => SK[sheet.id].gen()); P.refresh(); }
function sheetHTML(){
  const L = 'abcd';
  return `<div class="sheet"><h1>ARAL Math · ${SK[sheet.id].title}</h1><small>${BANDS[sheet.band].label} · Worksheet ${wsOf(sheet.band, sheet.id)} · San Vicente National High School</small>
    <div class="who"><span>Name:</span><span>Grade &amp; Section:</span><span>Date:</span><span>Score: &nbsp;&nbsp;&nbsp;&nbsp;/ ${sheet.items.length}</span></div>
    <p style="font-size:.85rem;margin-bottom:.8rem">${sheet.items[0].kind === 'mc' ? 'Choose the letter of the correct answer.' : 'Solve each item. Show your solution. Write fractions in lowest terms.'}</p>
    <ol>${sheet.items.map(it => `<li>${it.q}${it.kind === 'mc' ? `<div class="mcs">${it.choices.map((c, k) => `${L[k]}) ${c}`).join(' &nbsp;&nbsp; ')}</div>` : '<span class="line"></span>'}</li>`).join('')}</ol>
    <div class="key"><h1>Answer key</h1><ol>${sheet.items.map(it => `<li>${it.kind === 'mc' ? `${L[it.ans]}) ${it.show}` : it.show}</li>`).join('')}</ol></div></div>`;
}
function printSheet(){
  $('printArea').innerHTML = sheetHTML();
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

P.init(CFG);
</script>
